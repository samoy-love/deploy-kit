# Формат журнала для метрик посещаемости samoy.love.
#
# Ставится как /etc/nginx/conf.d/samoylove-log-metrics.conf — этот каталог
# подключён из http-блока nginx.conf (`include /etc/nginx/conf.d/*.conf;`).
# Иначе никак: директива log_format допустима ТОЛЬКО на уровне http, а файлы
# в sites-available — это server-блоки, и объявить формат там нельзя.
#
# ---------------------------------------------------------------------------
# ПОЧЕМУ ОТДЕЛЬНЫЙ ФОРМАТ, А НЕ ШТАТНЫЙ combined
# ---------------------------------------------------------------------------
# 1. В combined нет времени ответа. Вопрос «сайт стал медленнее?» по нему не
#    задать вообще никак, а это половина смысла затеи.
# 2. В combined есть IP клиента и полный User-Agent — то есть персональные
#    данные. Экспортёр метрик читал бы их построчно, и любая ошибка в разборе
#    или в метках означала бы утечку. Здесь их просто нет: строку, которой не
#    существует, невозможно случайно превратить в метку.
#
# Обычные журналы доступа при этом остаются как были: они нужны для разбора
# инцидентов и живут по своим правилам ротации. Этот файл — второй, узкий,
# и пишется ДОПОЛНИТЕЛЬНО (nginx допускает несколько access_log на уровень).
#
# ---------------------------------------------------------------------------
# ПОЛЯ И ПОРЯДОК
# ---------------------------------------------------------------------------
# Порядок обязан совпадать со строкой format в конфиге экспортёра
# (metrics.samoy.love/nginxlog/nginxlog.yml). Расхождение не роняет ни nginx, ни
# экспортёр — метрики просто молча перестают появляться, поэтому менять поля
# нужно в двух местах одной правкой.
#
#   $host              домен, чтобы считать посещаемость по сайтам
#   "$request"         метод и путь; экспортёр режет строку сам
#   $status            код ответа
#   $body_bytes_sent   отданный объём
#   $request_time      время ответа в секундах
#
# Чего здесь нет и не будет: $remote_addr, $http_user_agent, $http_referer,
# $http_x_forwarded_for, $cookie_*, $args.
#
# Этим же форматом пишется журнал событий интерфейса (см. snippets/
# samoylove-events.conf): там в поле запроса стоит /e/<имя события>, и
# отсутствие перечисленных полей важно ровно так же. Обещание в README
# формулируется от того, чего нет: ни cookie, ни идентификатора посетителя,
# ни третьих сторон. Считается, ЧТО произошло, а не КТО это сделал —
# пересечь две строки журнала между собой не по чему.
log_format samoylove_metrics '$host "$request" $status $body_bytes_sent $request_time';

# ---------------------------------------------------------------------------
# СВОИ ПРОВЕРКИ В ЖУРНАЛ ПОСЕЩАЕМОСТИ НЕ ПИШУТСЯ
# ---------------------------------------------------------------------------
# Проба blackbox ходит на «/» каждого сайта раз в 30 секунд, агент
# статус-страницы — раз в минуту, внешняя проба из GitHub Actions — реже.
# Итого на «/» приходит около трёх служебных запросов в минуту, и у тихих
# сайтов это ВЕСЬ трафик: страница выглядит посещаемой, когда на неё не
# заходил никто. Дашборды вычитали пробы формулой, но вычитание — это
# поправка к неверному числу; тревога TrafficCollapse считает по тому же ряду
# и настоящего падения посещаемости не увидела бы вовсе.
#
# Поэтому служебные запросы не попадают в журнал посещаемости с самого начала.
# Различаются они по User-Agent — единственному признаку, который у нас есть и
# который при этом в журнал не пишется: переменная нужна на уровне http, а
# файл журнала остаётся без персональных данных.
#
# Наши ходоки представляются префиксом samoylove- (агент и внешняя проба
# статус-страницы, пробы blackbox из metrics.samoy.love). Штатное имя
# blackbox-exporter оставлено рядом: если заголовок в его конфиге когда-нибудь
# пропадёт, фильтр продолжит работать.
#
# Подделать User-Agent может кто угодно — и тем самым выпасть из счётчика
# посещаемости. Цена этого ноль: обманувший себя же и не посчитал, а обычный
# журнал доступа и защита от сканеров работают отдельно от этой переменной.
map $http_user_agent $samoylove_metrics_loggable {
    default                1;
    "~*^samoylove-"        0;
    "~*^Blackbox-Exporter" 0;
}
