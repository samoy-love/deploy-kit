# Общесерверные умолчания, которым место на уровне http.
# Ставится как /etc/nginx/conf.d/samoylove-hardening.conf — nginx.conf
# подключает каталог целиком, поэтому `--enable` этому файлу не нужен:
#
#     nginx-apply.sh --app hardening \
#       --conf nginx/conf.d/samoylove-hardening.conf \
#       --dest /etc/nginx/conf.d/samoylove-hardening.conf
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ СТРОКА В nginx.conf. Сам nginx.conf в этом
# репозитории не лежит и выкаткой не управляется: он ставится вместе с пакетом
# nginx и правится руками. Всё, что мы хотим держать под ревью и уметь
# восстановить при пересборке хоста, обязано жить здесь, в conf.d.
#
# ПОЧЕМУ НЕ СНИППЕТ. snippets/ подключаются из server-блоков, то есть каждый
# сайт должен вспомнить про include. Директивы ниже относятся ко всему хосту
# сразу, включая ответы, которые ни одному сайту не принадлежат: 400 на
# кривой запрос, 408 по таймауту, 444 от catch-all. Сниппет их не покрывает,
# conf.d покрывает.

# Не отдавать версию nginx.
#
# По умолчанию nginx пишет её и в заголовок Server, и в тело страниц ошибок.
# До этого файла `server_tokens off` стоял ровно в одном конфиге из шести
# (chillhub-launcher.conf), и остальные домены отвечали снаружи буквально так:
#
#     $ curl -sI https://samoy.love/ | grep -i ^server
#     Server: nginx/1.24.0 (Ubuntu)
#
# Это не уязвимость сама по себе, но точная версия и дистрибутив избавляют
# сканирующего от работы: список CVE именно для 1.24.0 подбирается по строке,
# а не перебором. Здесь директива задана один раз для всего хоста, поэтому
# новый сайт получает её по факту появления, а не по факту того, что автор
# вспомнил.
#
# Строка Server не исчезает совсем — остаётся голое `nginx`. Полностью её
# убирает только модуль headers-more, которого в пакетном nginx нет.
server_tokens off;
