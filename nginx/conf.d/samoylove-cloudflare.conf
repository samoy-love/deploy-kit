# Настоящий IP клиента за Cloudflare.
#
# Ставится как /etc/nginx/conf.d/samoylove-cloudflare.conf — каталог подключён
# из http-блока nginx.conf целиком, поэтому `--enable` файлу не нужен:
#
#     nginx-apply.sh --app deploy-kit \
#       --conf nginx/conf.d/samoylove-cloudflare.conf \
#       --dest /etc/nginx/conf.d/samoylove-cloudflare.conf
#
# Возит его `bin/install-server` вместе с остальным ничейным (conf.d, snippets,
# catch-all): файл защищает все сайты хоста сразу, владельца-проекта у него нет.
#
# ---------------------------------------------------------------------------
# ЗАЧЕМ
# ---------------------------------------------------------------------------
# Домены samoy.love проксируются Cloudflare: DNS смотрит на её IP, а она уже
# ходит на этот сервер. Без этого файла nginx видит в $remote_addr адрес
# узла Cloudflare, а не игрока, и ломается всё, что на $remote_addr опирается:
#
#   1. limit_req/limit_conn по $binary_remote_addr (snakes.conf). Все игроки
#      мира приходят с горстки адресов Cloudflare и делят между собой ОДИН
#      лимит — 2 r/s на WebSocket на всех разом. Второй игрок уже получает 429.
#   2. X-Real-IP / X-Forwarded-For, которые сайты передают в бэкенды
#      (metrics, chillhub): бэкенд видит Cloudflare вместо клиента.
#   3. Обычные журналы доступа: разбор инцидента по IP невозможен.
#
# Модуль realip подменяет $remote_addr значением из заголовка — но ТОЛЬКО если
# соединение пришло с адреса из списка set_real_ip_from. Запрос напрямую на
# сервер, минуя Cloudflare, свой заголовок CF-Connecting-IP подделать не
# сможет: его источник не в списке, и nginx оставит настоящий адрес.
#
# ---------------------------------------------------------------------------
# ПОЧЕМУ CF-Connecting-IP, А НЕ X-Forwarded-For
# ---------------------------------------------------------------------------
# X-Forwarded-For — список, который клиент дописывает сам, и из него пришлось
# бы выбирать «последний доверенный» (real_ip_recursive). CF-Connecting-IP
# Cloudflare ставит одним значением и затирает то, что прислал клиент.
# Заголовок один, разбирать нечего, ошибиться негде.
#
# ---------------------------------------------------------------------------
# ОТКУДА СПИСОК И КАК ОБНОВЛЯТЬ
# ---------------------------------------------------------------------------
# https://www.cloudflare.com/ips-v4 и https://www.cloudflare.com/ips-v6,
# снято 2026-08-16. Cloudflare меняет диапазоны редко, но меняет; узел с
# адресом вне списка не сломает сайт — nginx просто оставит для него адрес
# Cloudflare, то есть вернётся к поведению до этого файла. Обновление — снять
# оба списка заново, положить сюда, выложить `install-server --apply`.
#
# ---------------------------------------------------------------------------
# ЧЕГО ЗДЕСЬ НЕТ
# ---------------------------------------------------------------------------
# Никаких `allow`/`deny` только для адресов Cloudflare: сервер обязан отвечать
# и напрямую — так его проверяют мониторинг и dk (HEALTH по origin), так к нему
# ходит certbot через webroot, и так работает dev.die.samoy.love, которого
# Universal SSL Cloudflare не покрывает (второй уровень поддомена — см.
# nginx/README.md, раздел «Cloudflare»).

# IPv4 — https://www.cloudflare.com/ips-v4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6 — https://www.cloudflare.com/ips-v6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
