# metro.samoy.love
#
# Выделен из общего launcher.conf, где раньше жили два проекта в одном файле.
# Деплой ChillHub перезаписывал этот файл целиком и снёс бы metro; теперь у
# каждого проекта свой конфиг и свой симлинк, деплои не пересекаются.
#
# ВАЖНО ПРО add_header: в nginx заголовки НЕ наследуются с родительского уровня,
# если на текущем уровне объявлен хотя бы один свой add_header. Раньше заголовки
# безопасности стояли один раз на уровне server, а каждый location объявлял свой
# Cache-Control — и заголовки безопасности не доходили ни до index.html, ни до
# service worker'а, ни до манифеста (проверено curl'ом по бою). Поэтому блок
# заголовков безопасности продублирован в КАЖДОМ location. Это не украшательство:
# стоит убрать его из одного блока — и именно там защита пропадёт молча.
#
# Include-сниппет намеренно не используется: scripts/deploy.sh выкладывает ровно
# один файл, и конфиг обязан быть самодостаточным.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name metro.samoy.love;

    # Serve robots.txt and sitemap.xml over HTTP without redirect (for crawlers)
    location = /robots.txt {
        root /var/www/site;
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location = /sitemap.xml {
        root /var/www/site;
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name metro.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/metro.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metro.samoy.love/privkey.pem;

    # Дубль на уровне server нужен для ответов, которые не попали ни в один
    # location (ошибки nginx, редиректы) — там своих add_header нет.
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    # Приложение полностью самодостаточно: в прод-бандле нет ни одного внешнего
    # запроса (проверено grep'ом по dist — только XML-неймспейсы SVG).
    # script-src без 'unsafe-inline': инлайн-скрипт темы вынесен в
# public/theme-init.js (обычный внешний скрипт так же блокирует отрисовку,
# поэтому вспышки светлой темы нет). В style-src 'unsafe-inline' остаётся:
# его требуют style-атрибуты, которые проставляет React.
    # index.html (ранняя установка темы). Хеш вместо него не берём осознанно:
    # он молча протухнет при любой правке этого скрипта, а сломается при этом
    # прод, а не сборка. Внешние скрипты запрещены в любом случае.
    # 'unsafe-inline' в style-src — из-за style-атрибутов, которые ставит React.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    etag on;

    access_log /var/log/nginx/metro_access.log;
    error_log  /var/log/nginx/metro_error.log;

    root /var/www/metro/current;
    index index.html;

    location / {
        root /var/www/metro/current;
        try_files $uri /index.html;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Ассеты Vite: имена уже содержат хеш, содержимое неизменно.
    # Модификатор ^~ отключает проверку regex-локаций, поэтому правило
    # immutable ниже сюда не доходит — его надо повторить здесь.
    location ^~ /assets/ {
        root /var/www/metro/current;
        try_files $uri =404;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        root /var/www/metro/current;
        try_files /index.html =404;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Explicit PWA manifest: short caching with revalidation
    location = /kitty-metro-manifest.webmanifest {
        root /var/www/metro/current;
        try_files /kitty-metro-manifest.webmanifest =404;

        # В mime.types нет .webmanifest, и nginx отдаёт манифест как
        # application/octet-stream. Само по себе это работало, но вместе с
        # nosniff (который до этого локейшна раньше просто не доходил) браузер
        # вправе отказаться его читать. Задаём тип явно.
        types { }
        default_type application/manifest+json;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }

    # Explicit service worker: must always revalidate
    location = /kitty-metro-sw.js {
        root /var/www/metro/current;
        try_files /kitty-metro-sw.js =404;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Легаси service worker (клинер старых регистраций, см. docs/DEPLOY.md) —
    # тоже всегда ревалидировать.
    location = /sw.js {
        root /var/www/metro/current;
        try_files /sw.js =404;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ~* "^/.+[-.][a-f0-9]{8,}\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$" {
        root /var/www/metro/current;
        try_files $uri =404;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/.+\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$ {
        root /var/www/metro/current;
        try_files $uri =404;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ~* ^/.+\.(?:html)$ {
        root /var/www/metro/current;
        try_files $uri =404;

        add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
