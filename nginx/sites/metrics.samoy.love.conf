# metrics.samoy.love — Grafana и Prometheus (репозиторий metrics.samoy.love).
#
# Ставится как /etc/nginx/sites-available/metrics.samoy.love.conf + симлинк.
# Требует установленного /etc/nginx/snippets/samoylove-metrics-headers.conf.
#
# Сертификат: certbot certonly --webroot -w /var/www/metrics-acme \
#             -d metrics.samoy.love
# Выпускать ТОЛЬКО после появления A-записи metrics.samoy.love — до этого
# nginx -t упадёт на отсутствующем файле сертификата, и nginx-apply.sh
# честно откатит конфиг.
#
# Сами Grafana и Prometheus портов наружу не имеют: контейнеры слушают
# 127.0.0.1, единственный вход — этот конфиг, закрытый basic-auth.

server {
    listen 80;
    listen [::]:80;
    server_name metrics.samoy.love;

    # Каталог, в который пишет certbot. Подменять его на каталог приложения
    # нельзя: продление сертификата тогда молча перестанет работать, и узнать
    # об этом получится через три месяца, когда домен отвалится.
    location /.well-known/acme-challenge/ { root /var/www/metrics-acme; }

    location / { return 301 https://metrics.samoy.love$request_uri; }
}

server {
    # На проде nginx 1.24: отдельной директивы `http2 on;` там ещё нет,
    # она появилась в 1.25.1 и валит nginx -t. Только старая форма в listen.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metrics.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/metrics.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.samoy.love/privkey.pem;

    access_log /var/log/nginx/metrics_access.log;
    error_log  /var/log/nginx/metrics_error.log;

    include /etc/nginx/snippets/samoylove-metrics-headers.conf;

    # Basic-auth на весь домен. Файл лежит только на сервере и в репозитории
    # отсутствует; создаётся при установке (см. metrics.samoy.love/README.md).
    auth_basic           "samoy.love metrics";
    auth_basic_user_file /etc/nginx/.htpasswd-metrics;

    # Grafana умеет отдавать снапшоты дашбордов, а Prometheus — ответы API;
    # и то и другое бывает крупным.
    client_max_body_size 16m;

    # ACME-проба должна проходить БЕЗ пароля, иначе продление сертификата
    # будет получать 401 и молча ломаться.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/metrics-acme;
        include /etc/nginx/snippets/samoylove-metrics-headers.conf;
    }

    # Проверка выкатки. Мониторинг теперь катится через deploy-kit, а его
    # release.sh подтверждает релиз кодом 200 — панель же за basic-auth
    # отвечает 401 одинаково и живому стеку, и мёртвому, то есть проверять
    # ею нечего.
    #
    # Отдаётся здоровье Prometheus (/-/healthy), а не заглушка `return 200`:
    # заглушка подтверждала бы только что жив nginx, и выкатка со сломанным
    # конфигом сбора уезжала бы зелёной. Ответ — строка «Prometheus Server is
    # Healthy.», без версий и без данных; auth_basic off здесь ничего не
    # открывает, потому что открывать нечего.
    location = /healthz {
        auth_basic off;
        include /etc/nginx/snippets/samoylove-metrics-headers.conf;
        add_header Cache-Control "no-store" always;

        proxy_pass http://127.0.0.1:9090/prometheus/-/healthy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Prometheus. Контейнер запущен с --web.external-url=.../prometheus/,
    # то есть сам ждёт запросы с этим префиксом — путь не срезаем.
    location /prometheus/ {
        include /etc/nginx/snippets/samoylove-metrics-headers.conf;
        add_header Cache-Control "no-store" always;

        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Grafana Live — websocket. Без Upgrade/Connection соединение обрывается,
    # и панель раз в несколько секунд показывает ошибку подключения.
    location /api/live/ {
        include /etc/nginx/snippets/samoylove-metrics-headers.conf;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        include /etc/nginx/snippets/samoylove-metrics-headers.conf;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
