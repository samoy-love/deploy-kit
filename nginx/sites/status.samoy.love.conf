# status.samoy.love — статус-страница.
#
# Ставится как /etc/nginx/sites-available/status.samoy.love.conf + симлинк.
# Сертификат: certbot --nginx -d status.samoy.love (после того, как A-запись
# домена начнёт указывать на этот сервер).

server {
    listen 80;
    listen [::]:80;
    server_name status.samoy.love;

    location /.well-known/acme-challenge/ { root /var/www/status-acme; }
    location / { return 301 https://status.samoy.love$request_uri; }
}

server {
    # На проде nginx 1.24, где отдельной директивы `http2 on;` ещё нет —
    # она появилась в 1.25.1. Здесь только старая форма в listen.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/status.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.samoy.love/privkey.pem;

    root /var/www/status/current;
    index index.html;

    access_log /var/log/nginx/status_access.log;
    error_log  /var/log/nginx/status_error.log;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    include /etc/nginx/snippets/samoy-security-headers.conf;

    # Данные агента. Кэшировать нельзя: страница опрашивает их раз в минуту,
    # и устаревший ответ сделает статус-страницу бесполезной ровно в тот
    # момент, когда она нужна.
    location /data/ {
        # Данные лежат ВНЕ каталога сайта (/var/www/status/data), поэтому здесь
        # свой root: выкатка страницы делается с --delete и снесла бы историю,
        # если бы данные хранились внутри site/.
        root /var/www/status;
        include /etc/nginx/snippets/samoy-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    location /_astro/ {
        include /etc/nginx/snippets/samoy-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/samoy-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
}
