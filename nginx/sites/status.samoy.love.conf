# status.samoy.love — статус-страница.
#
# Ставится как /etc/nginx/sites-available/status.samoy.love.conf + симлинк.
# Сертификат: certbot --nginx -d status.samoy.love (после того, как A-запись
# домена начнёт указывать на этот сервер).

server {
    listen 80;
    listen [::]:80;
    server_name status.samoy.love;

    location /.well-known/acme-challenge/ { root /var/www/status-acme; }
    location / { return 301 https://status.samoy.love$request_uri; }
}

server {
    # На проде nginx 1.24, где отдельной директивы `http2 on;` ещё нет —
    # она появилась в 1.25.1. Здесь только старая форма в listen.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name status.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/status.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.samoy.love/privkey.pem;

    # Протоколы, шифры и кэш сессий. Без этой строки набор брался из встроенных
    # дефолтов nginx (включая TLS 1.0/1.1) и из репозитория не проверялся.
    include /etc/nginx/snippets/samoylove-tls.conf;

    root /var/www/status/current;
    index index.html;

    access_log /var/log/nginx/status_access.log;
    # Второй журнал — для метрик: без IP и User-Agent, только домен, путь,
    # код, объём и время ответа. Читается экспортёром в стеке мониторинга.
    # Директива наследуется каждым location, но ровно до тех пор, пока в
    # location не появится свой access_log; добавляя новый, дублируйте обе
    # строки, иначе домен молча выпадет из посещаемости.
    access_log /var/log/nginx/samoylove_metrics.log samoylove_metrics;
    error_log  /var/log/nginx/status_error.log;

    # Приёмник событий интерфейса: /e/<имя>. Без cookie, без тела, 204.
    include /etc/nginx/snippets/samoylove-events.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    include /etc/nginx/snippets/samoylove-security-headers.conf;

    # Данные агента. Кэшировать нельзя: страница опрашивает их раз в минуту,
    # и устаревший ответ сделает статус-страницу бесполезной ровно в тот
    # момент, когда она нужна.
    location /data/ {
        # Данные лежат ВНЕ каталога сайта (/var/www/status/data), поэтому здесь
        # свой root: выкатка страницы делается с --delete и снесла бы историю,
        # если бы данные хранились внутри site/.
        root /var/www/status;
        include /etc/nginx/snippets/samoylove-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    location /_astro/ {
        include /etc/nginx/snippets/samoylove-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Мини-приложение для Telegram.
    #
    # Общий сниппет заголовков здесь не подходит по двум причинам, и обе
    # ломают страницу молча — она открывается, просто ведёт себя не так.
    #
    # 1. script-src 'self' блокирует telegram-web-app.js с telegram.org. Без
    #    него нет ни темы клиента, ни кнопки «назад», ни разворота на весь
    #    экран: мини-приложение выглядит чужой веб-страницей внутри чата.
    # 2. frame-ancestors 'none' и X-Frame-Options: DENY запрещают показ в
    #    рамке, а Telegram Web открывает мини-приложения именно так.
    #
    # Заголовки поэтому выписаны целиком, а не поверх сниппета: add_header в
    # nginx не складывается, вложенный набор заменяет родительский, и «убрать
    # X-Frame-Options» можно только не ставя его здесь.
    location /tg/ {
        access_log /var/log/nginx/status_access.log;
        access_log /var/log/nginx/samoylove_metrics.log samoylove_metrics;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # script-src без 'unsafe-inline' — как и в общем сниппете: страница
        # собирается тем же Astro с assetsInlineLimit: 0, инлайн-скриптов в
        # ней нет, и это держит гейт `npm run check:no-inline-scripts`.
        # telegram.org остаётся: SDK мини-приложения — внешний скрипт.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors https://web.telegram.org https://telegram.org; base-uri 'self'; form-action 'none'" always;
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/index.html =404;
    }

    location / {
        include /etc/nginx/snippets/samoylove-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
}
