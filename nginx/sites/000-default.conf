# Catch-all для неизвестных доменов (default_server).
#
# ЗАЧЕМ. Без этого файла nginx назначает default_server'ом ПЕРВЫЙ по алфавиту
# конфиг из sites-enabled — то есть chillhub-launcher.conf. В результате любой
# чужой домен, направленный A-записью на IP этого сервера, а также запросы
# по голому IP отдавали бы сайт ChillHub. Здесь такие запросы обрываются.
#
# У файла НЕТ проекта-владельца, и в этом его отличие от соседей по каталогу:
# у chillhub-launcher.conf, metro.conf, snakes.conf, samoy.love.conf и прочих
# есть репозиторий, чья выкатка их и везёт. Здесь везти некому — этот конфиг
# не про сайт, а про все остальные домены сразу.
#
# КТО ЕГО ВЕЗЁТ. bin/install-server, ровно как сниппеты и conf.d, и по тому же
# критерию: ничейное возит команда, а не пайплайн. Руками в /etc/nginx не
# ходим и здесь. Долгое время файл не возил никто, и расхождение репозитория с
# сервером в самом чувствительном месте конфигурации было невидимым.
#
# ПОЧЕМУ ОН ОСТАЛСЯ В sites, А НЕ ПЕРЕЕХАЛ В conf.d, где ничейное и живёт.
# Вопрос настоящий: conf.d nginx разбирает раньше sites-enabled, а разбор
# решает, кому достаётся неизвестный домен. Ответ получен опытом, а не
# рассуждением: весь набор сайтов поднимали в контейнере с nginx 1.24 обоими
# способами, и поведение совпало — неизвестный домен и голый IP получают обрыв,
# TLS без совпавшего SNI отклоняется. Обе директивы default_server стоят здесь
# ЯВНО, а явный default_server побеждает независимо от порядка файлов; порядок
# решал бы, только если бы его тут не было.
#
# Раз выигрыша нет, остаётся цена: в conf.d файл выпал бы из задачи CI (она
# проверяет настоящим nginx каталог nginx/sites/*.conf) и из правила про
# default_server в ci/nginx-check.sh, которое опознаёт catch-all по имени пути.
# Поэтому он лежит там, где лежал.
#
# Имя начинается с 000-, чтобы файл гарантированно шёл первым при разборе.
# Настоящие сайты по-прежнему матчатся по server_name и сюда не попадают.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 — закрыть соединение без ответа (nginx-специфичный код).
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Отклонить TLS-handshake, если SNI не совпал ни с одним сайтом.
    # Директива доступна с nginx 1.19.4 и снимает требование ssl_certificate.
    ssl_reject_handshake on;
}

# отметка замера пайплайнов 2026-09-04
