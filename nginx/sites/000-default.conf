# Catch-all для неизвестных доменов (default_server).
#
# ЗАЧЕМ. Без этого файла nginx назначает default_server'ом ПЕРВЫЙ по алфавиту
# конфиг из sites-enabled — то есть chillhub-launcher.conf. В результате любой
# чужой домен, направленный A-записью на IP этого сервера, а также запросы
# по голому IP отдавали бы сайт ChillHub. Здесь такие запросы обрываются.
#
# Файл не принадлежит ни одному проектному деплою: chillhub-launcher.conf,
# metro.conf, snakes.conf и samoy.love.conf перезаписываются пайплайнами своих
# репозиториев, а этот — общесерверный, правится вручную.
#
# Имя начинается с 000-, чтобы файл гарантированно шёл первым при разборе.
# Настоящие сайты по-прежнему матчатся по server_name и сюда не попадают.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 — закрыть соединение без ответа (nginx-специфичный код).
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Отклонить TLS-handshake, если SNI не совпал ни с одним сайтом.
    # Директива доступна с nginx 1.19.4 и снимает требование ssl_certificate.
    ssl_reject_handshake on;
}
