# die.samoy.love — игра Double or Die.
#
# Ставится как /etc/nginx/sites-available/die.samoy.love.conf + симлинк.
# Сертификат: certbot certonly --webroot -w /var/www/die-acme -d die.samoy.love

server {
    listen 80;
    listen [::]:80;
    server_name die.samoy.love;

    location /.well-known/acme-challenge/ { root /var/www/die-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # На проде nginx 1.24, где отдельной директивы `http2 on;` ещё нет —
    # она появилась в 1.25.1. Здесь только старая форма в listen.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name die.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/die.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/die.samoy.love/privkey.pem;
    include /etc/nginx/snippets/samoylove-tls.conf;

    root /var/www/die/current;
    index index.html;

    access_log /var/log/nginx/die_access.log;
    access_log /var/log/nginx/samoylove_metrics.log samoylove_metrics;
    error_log  /var/log/nginx/die_error.log;

    # Игра целиком считается в браузере, поэтому сжимать нужно ровно две вещи:
    # бандл и манифест версии.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    include /etc/nginx/snippets/samoylove-security-headers.conf;
    include /etc/nginx/snippets/samoylove-die-headers.conf;

    # Ассеты с хешем в имени. Содержимое такого файла не меняется никогда:
    # либо он тот же самый, либо у него другое имя. Год иммутабельного кэша
    # здесь безопасен и делает повторный заход мгновенным.
    location /assets/ {
        include /etc/nginx/snippets/samoylove-security-headers.conf;
        include /etc/nginx/snippets/samoylove-die-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Манифест версии. По нему клиент узнаёт о новой сборке, а deploy-kit
    # сверяет, что на проде лежит именно то, что собрали. Закэшированный
    # манифест сделал бы обе проверки бессмысленными — и ломалось бы это
    # молча: игра работает, просто вечно старая.
    location = /version.json {
        include /etc/nginx/snippets/samoylove-security-headers.conf;
        include /etc/nginx/snippets/samoylove-die-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Service worker. Кэшировать его нельзя ни в коем случае: он сам
    # управляет кэшем всего остального, и устаревший воркер намертво
    # запирает игрока на старой версии.
    location = /sw.js {
        include /etc/nginx/snippets/samoylove-security-headers.conf;
        include /etc/nginx/snippets/samoylove-die-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/samoylove-security-headers.conf;
        include /etc/nginx/snippets/samoylove-die-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
}
