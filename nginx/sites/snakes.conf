# snakes.samoy.love — system nginx (Ubuntu 24.04, nginx 1.24.0) reverse proxy.
#
# Installed as /etc/nginx/sites-available/snakes.conf with a symlink from
# sites-enabled/. This file describes ONLY the `snakes.samoy.love` server_name.
# Never merge another domain into the server_name lines here: the neighbouring
# projects (launcher.samoy.love, metro.samoy.love) own their own config files
# and must not be touched by a Snakes deploy.
#
# The application is a Go binary managed by systemd (snakes.service). It listens
# on 127.0.0.1:8090 only — ports 3000/3001 on this host are already taken by an
# openspeedtest container — and nginx is the only thing that talks to it.
#
# The certificate is issued with the webroot plugin (not --nginx), so certbot
# never rewrites this file or any neighbouring config:
#   sudo certbot certonly --webroot -w /var/www/snakes-acme -d snakes.samoy.love

upstream snakes_app {
    server 127.0.0.1:8090;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Rate/connection limiting zones.
#
# sites-enabled/*.conf is included from the `http` block, which on this host is
# SHARED with the neighbouring projects (launcher.samoy.love, metro.samoy.love).
# Every zone name here therefore carries the `snakes_` prefix so it can never
# collide with a zone another project might declare later. Verified with
# `nginx -T | grep limit_` that no other zone exists at the time of writing.
#
# Only the zones are declared here (they must live in `http`); the actual
# limit_conn/limit_req usage stays inside the snakes server block, so no
# neighbouring vhost is affected.
#
# 10m of shared memory holds ~160k IPv4 states — far more than this host sees.
# ---------------------------------------------------------------------------

# Concurrent WebSocket sessions per IP. Players legitimately open several tabs
# (and a tab briefly holds both the old and the new socket while reconnecting),
# hence 40 rather than 1-2. The counter is per source address, and a school, an
# office or a mobile carrier all sit behind one NAT/CGNAT address: at 12 a
# single shared exit IP ran out at ~6 concurrent players. 40 leaves headroom
# for ~20 players behind one NAT while still capping a socket flood.
limit_conn_zone $binary_remote_addr zone=snakes_ws_conn:10m;

# New WebSocket handshakes per IP. 2/s sustained with burst 20 absorbs a normal
# reconnect storm (network flap, laptop wake-up, page reloads) while still
# capping a handshake flood: the upgrade itself is what the Go rate limiter
# cannot see, since it only throttles messages *after* the upgrade. Raised from
# 1r/s together with limit_conn for the same shared-NAT reason.
limit_req_zone $binary_remote_addr zone=snakes_ws_req:10m rate=2r/s;

# Ordinary HTTP requests (index, assets falling through to the app).
limit_conn_zone $binary_remote_addr zone=snakes_http_conn:10m;
limit_req_zone  $binary_remote_addr zone=snakes_http_req:10m rate=20r/s;

# ---------------------------------------------------------------------------
# V1: cache policy for versioned static.
#
# index.html references its own static as /client.js?v=__BUILD__ and
# scripts/deploy.sh replaces the literal with the release id in the copy that
# ships. A non-empty `v` that is not the literal means "this URL changes on
# every release", so the answer is safe to cache forever. Everything else -
# bare /client.js, an empty ?v=, or an unstamped __BUILD__ - stays uncacheable,
# otherwise a player would be pinned to a stale bundle.
#
# The same rule lives in server.go (isVersionedAsset). nginx serves js/css
# itself here, so the app's header never reaches the browser, but the two must
# agree or the behaviour would depend on which side answered.
#
# Map names carry the snakes_ prefix: the http block is shared with the
# neighbouring vhosts on this host.
# ---------------------------------------------------------------------------
map $arg_v $snakes_asset_cc {
    default     "public, max-age=31536000, immutable";
    ""          "no-store, no-cache, must-revalidate";
    "__BUILD__" "no-store, no-cache, must-revalidate";
}
map $arg_v $snakes_asset_pragma {
    default     "";
    ""          "no-cache";
    "__BUILD__" "no-cache";
}
map $arg_v $snakes_asset_expires {
    default     "";
    ""          "0";
    "__BUILD__" "0";
}

# ---------------------------------------------------------------------------
# HTTP: ACME challenges are served directly, everything else is redirected.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name snakes.samoy.love;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/snakes-acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name snakes.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/snakes.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snakes.samoy.love/privkey.pem;

    access_log /var/log/nginx/snakes_access.log;
    # Второй журнал — для метрик: без IP и User-Agent, только домен, путь,
    # код, объём и время ответа. Читается экспортёром в стеке мониторинга.
    # Директива наследуется каждым location, но ровно до тех пор, пока в
    # location не появится свой access_log; добавляя новый, дублируйте обе
    # строки, иначе домен молча выпадет из посещаемости.
    access_log /var/log/nginx/samoylove_metrics.log samoylove_metrics;
    error_log  /var/log/nginx/snakes_error.log;

    # Приёмник событий интерфейса: /e/<имя>. Без cookie, без тела, 204.
    include /etc/nginx/snippets/samoylove-events.conf;

    # Control frames only; nothing is uploaded.
    client_max_body_size 1m;

    # Limit rejections: 429 is the honest answer, the nginx default 503 reads as
    # "server broken" to both players and uptime monitors. Scoped to this server
    # block so the neighbouring vhosts keep stock behaviour.
    limit_conn_status 429;
    limit_req_status  429;
    limit_req_log_level warn;

    # Compression for ordinary HTTP responses. `gzip on` is set globally in
    # /etc/nginx/nginx.conf but the stock gzip_types is text/html only, so
    # client.js / style.css went out uncompressed. WebSocket frames are NOT
    # covered by gzip at all — their compression is permessage-deflate,
    # negotiated end-to-end between the browser and the Go server; nginx passes
    # Sec-WebSocket-Extensions through untouched, which is all it can do.
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # HSTS is the one security header the app does not emit itself.
    # securityHeadersMiddleware in server.go already sets X-Content-Type-Options,
    # X-Frame-Options, Referrer-Policy, COOP, CORP, Permissions-Policy and CSP on
    # every response, so those are deliberately NOT repeated here — `add_header`
    # appends rather than replaces and would send each of them twice.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # -----------------------------------------------------------------------
    # WebSocket. Must come before the catch-all `location /`.
    # -----------------------------------------------------------------------
    location = /ws {
        # SECURITY, load-bearing — do not remove.
        #
        # The client passes its identity token in the query string:
        #   GET /ws?t=v1.<pid>.<iat>.<mac>
        # The default `combined` log format writes $request verbatim, so every
        # single connect used to append a full, 90-day-valid bearer token to
        # /var/log/nginx/snakes_access.log. That token is the ONLY proof of
        # identity the game has: anyone who can read the log (operator, backup,
        # log shipper, an LFI bug) permanently owns that player's profile,
        # balance and cosmetics. Logging is therefore off for this location.
        #
        # This is damage control, not the fix. The real fix is on the client and
        # the Go server: move the token out of the URL into the first WebSocket
        # message or into Sec-WebSocket-Protocol. Until that lands, the token
        # still travels in the URL and can resurface in any other component that
        # records request lines (a future debug log format, an error page, a
        # $request in error_log, browser history, Referer).
        access_log off;

        # A WebSocket upgrade is invisible to the application-level rate limiter
        # (it only throttles messages after the handshake), so it is capped here.
        limit_conn snakes_ws_conn 40;
        limit_req  zone=snakes_ws_req burst=20 nodelay;

        # ...but a rejected request is written to error_log as
        #   limiting connections by zone "...", request: "GET /ws?t=v1...."
        # i.e. `access_log off` above would be undone by the limiter itself the
        # moment a real player hits the burst during a reconnect storm — and a
        # real player's request DOES carry a token. `info`/`notice` are below the
        # default error_log severity (`error`), so these lines are not recorded
        # at all. The trade-off is deliberate: token secrecy outranks limiter
        # observability, and 429 counts are still visible in the app's /metrics.
        #
        # NOTE — residual exposure, only the client/server fix removes it:
        # any OTHER error on this location (upstream down -> 502, timeout) is
        # logged at `error` level and still prints $request with the token.
        limit_conn_log_level info;
        limit_req_log_level  info;

        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Game sessions are long-lived and idle between ticks.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Never buffer or cache a socket.
        proxy_buffering off;
        proxy_cache off;
    }

    # -----------------------------------------------------------------------
    # Operational endpoints
    # -----------------------------------------------------------------------

    # /metrics is unauthenticated upstream, so it stays internal.
    location = /metrics {
        deny all;
        access_log off;
    }

    location = /healthz {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Static assets.
    #
    # The Go app already emits Cache-Control for these paths. `add_header` would
    # append a second value rather than replace it, so hide the upstream header
    # first and set exactly one authoritative value here.
    # -----------------------------------------------------------------------

    # Emoji sprites are immutable content.
    location ^~ /emoji-64/ {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML is never cached: it is the only place the current ?v= is written, so
    # a cached index.html would pin the player to an old release forever.
    location ~* \.html$ {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma  "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # V1: js/css with a release id in the query are immutable for a year;
    # without one they stay uncacheable. See the $snakes_asset_* maps above.
    # A stale client.js against a new protocol version breaks the game
    # silently, which is exactly why the cacheable case must be a NEW URL
    # rather than a longer max-age on the old one.
    #
    # The sibling ES modules (client_errors/audio/fx/net.js) are imported from
    # client.js by relative path; a query on the <script src> is NOT inherited
    # by those imports, so they arrive here without `v` and stay uncached. That
    # is deliberate - together they are about 20 KB against 490 KB of client.js.
    location ~* \.(?:css|js|mjs)$ {
        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control $snakes_asset_cc always;
        add_header Pragma  $snakes_asset_pragma always;
        add_header Expires $snakes_asset_expires always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # -----------------------------------------------------------------------
    # Everything else, including "/".
    # -----------------------------------------------------------------------
    location / {
        # Deliberately NOT applied to /emoji-64/ or to the html|js|css location:
        # a cold page load pulls a burst of sprite requests and a per-IP request
        # limit there would break loading for a player behind CGNAT.
        limit_conn snakes_http_conn 48;
        limit_req  zone=snakes_http_req burst=40 nodelay;

        proxy_pass http://snakes_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        # Responses are small (index.html, JSON); one 16k buffer set keeps the
        # upstream connection from being held open while nginx dribbles bytes to
        # a slow client, without reserving memory per connection needlessly.
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         8 16k;
        proxy_busy_buffers_size 32k;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
