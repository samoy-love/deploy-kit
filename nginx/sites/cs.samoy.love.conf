# cs.samoy.love — сервис разбора матчей CS2.
#
# Кладётся в deploy-kit как nginx/sites/cs.samoy.love.conf и едет парой
# NGINX_CONF + NGINX_DEST из .deploy-kit/api.env — как у всех остальных сайтов.
#
# АДРЕСА БЭКЕНДА ЗДЕСЬ НЕТ НАМЕРЕННО. Гейт на утечку топологии ловит адреса
# внутреннего моста в добавленных строках, а deploy-kit публичный. Поэтому
# адрес живёт в /etc/nginx/conf.d/zz-cs2-upstream.conf — файле, которого нет ни
# в одном репозитории и который install-server не возит. Тот же приём, что у
# zz-router-admin.conf: имя вне пространства samoylove-*, чтобы install-server
# не считал файл дрейфом.
#
# ВНИМАНИЕ ПРИ ПЕРВОЙ ВЫКАТКЕ: nginx-apply.sh кладёт файл в sites-available и
# на этом останавливается. Симлинк в sites-enabled создаётся руками один раз,
# иначе healthz отвечает 000 и выкатка честно откатывается.

server {
    listen 80;
    listen [::]:80;
    server_name cs.samoy.love;

    # Сниппета acme-challenge в репозитории нет — он есть только на сервере,
    # поэтому локация объявляется здесь, как у соседних конфигов.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

# Загрузка демок идёт с адреса игрока, и лимит на неё нужен свой: обычные
# запросы к API короткие и частые, загрузка — редкая и длинная.
limit_req_zone $binary_remote_addr zone=cs2_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=cs2_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=cs2_conn:10m;

server {
    # http2 намеренно не объявлен: он задаётся на слушающий сокет один раз, а
    # его уже объявляют соседние vhost-ы. Повтор даёт warn при каждой
    # перезагрузке — таких предупреждений в хозяйстве и так три.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cs.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/cs.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs.samoy.love/privkey.pem;
    include snippets/samoylove-tls.conf;
    include snippets/samoylove-security-headers.conf;

    # Сниппета acme-challenge в репозитории нет — он есть только на сервере,
    # поэтому локация объявляется здесь, как у соседних конфигов.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    access_log /var/log/nginx/samoylove_metrics.log samoylove_metrics;

    limit_conn cs2_conn 32;

    # ЗАГРУЗКА ДЕМКИ — ОТДЕЛЬНОЙ ЛОКАЦИЕЙ, И БУФЕРИЗАЦИЯ ЗДЕСЬ ВЫКЛЮЧЕНА.
    #
    # Демка весит до 200 МБ. С включённой буферизацией nginx сначала целиком
    # положил бы тело во временный файл у себя и только потом отдал приложению —
    # то есть каждая загрузка писалась бы на диск дважды, а память под буферы
    # росла бы с числом одновременных загрузок.
    #
    # Приложение принимает тело потоком и пишет сразу в хранилище.
    location = /api/upload {
        limit_req zone=cs2_upload burst=3 nodelay;

        client_max_body_size 300m;
        client_body_timeout  600s;

        proxy_pass http://cs2_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Реплей ходит по вебсокету за состоянием раунда.
    location /api/replay/ {
        proxy_pass http://cs2_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }

    # Проверку здоровья не лимитируем: её дёргает выкатка, и упереться в
    # limit_req на своём же релизе — верный способ получить ложный откат.
    location = /healthz {
        proxy_pass http://cs2_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        limit_req zone=cs2_api burst=40 nodelay;

        client_max_body_size 1m;

        proxy_pass http://cs2_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
