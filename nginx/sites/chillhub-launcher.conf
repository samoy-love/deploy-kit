# Nginx configuration for launcher.samoy.love (ChillHub launcher + landing).
#
# ---------------------------------------------------------------------------
# DEPLOYMENT LAYOUT — THIS FILE OWNS ONE VHOST AND ONLY ONE
# ---------------------------------------------------------------------------
# On the server this is deployed as its own file:
#
#     /etc/nginx/sites-available/chillhub-launcher.conf   <- copy of this file
#     /etc/nginx/sites-enabled/chillhub-launcher.conf     -> symlink to it
#
# It describes ONLY the `launcher.samoy.love` server_name, including its own
# :80 -> :443 redirect block. Other projects on the same host (e.g.
# metro.samoy.love) live in their OWN files in sites-available and are not
# referenced here. Never merge another domain into the `server_name` lines
# below and never let the deploy overwrite a shared multi-site file: a deploy
# that ships this file must replace exactly chillhub-launcher.conf, so an
# unrelated vhost can never be deleted by a launcher release.
# See deploy/README.md, section "Раскладка конфигов на сервере".
#
# Target nginx version: 1.24.0 (Ubuntu) — see the HTTP/2 note on the 443 block.
#
# ---------------------------------------------------------------------------
# SECURITY HEADERS — why they are repeated in every location block
# ---------------------------------------------------------------------------
# nginx's add_header directives are inherited from the previous configuration
# level ONLY IF the current level defines no add_header of its own. Almost every
# location below sets its own `add_header Cache-Control ...`, which silently
# dropped the server-level security headers — they were effectively applied
# nowhere except the few locations without any add_header.
#
# Two fixes are possible:
#   a) put the headers in an include-snippet and `include` it in every location;
#   b) repeat them explicitly in every location that has its own add_header.
#
# We chose (b) on purpose: this file is deployed standalone (deploy.yml copies
# exactly one file to /etc/nginx/sites-available/launcher.conf), so an external
# snippet would add a second deployment artifact whose absence would break
# `nginx -t` and therefore the whole reload. Explicit duplication keeps the
# config self-contained and greppable at the cost of verbosity.
#
# `always` is added everywhere so the headers are also emitted on error
# responses (401/403/404/5xx), not just on 2xx/3xx.
#
# The canonical base set (keep these five in sync across all blocks):
#     add_header X-Content-Type-Options nosniff always;
#     add_header X-Frame-Options DENY always;
#     add_header X-XSS-Protection "1; mode=block" always;
#     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#     add_header Strict-Transport-Security "max-age=300" always;
#
# X-XSS-Protection is legacy (ignored by modern browsers) but kept with its
# original value so behaviour is not silently changed.
#
# ---------------------------------------------------------------------------
# HSTS — CURRENTLY 7 DAYS (max-age=604800)
#
# СОСТОЯНИЕ НА 2026-08-01: автопродление проверено на этом хосте —
# certbot.timer enabled+active, `certbot renew --dry-run` прошёл успешно для
# всех трёх сертификатов (launcher, metro, snakes), сроки 76-89 дней.
# Поэтому срок поднят с 300 секунд до 7 суток.
#
# СЛЕДУЮЩИЙ ШАГ: до года (max-age=31536000) — только после того, как увидите
# ХОТЯ БЫ ОДНО реальное автопродление (не dry-run). Сертификат launcher
# истекает 2026-10-16, значит продление ожидается около 2026-09-16: проверьте
# после этой даты, что срок сертификата уехал вперёд, и тогда поднимайте.
# `includeSubDomains` по-прежнему НЕ добавляем: на этом же домене живут чужие
# проекты (metro, snakes), и правило распространилось бы на них.
#
# Ниже — исходное обоснование, почему начинали с 5 минут.
# ---------------------------------------------------------------------------
# HSTS is a one-way door: once a browser has seen the header it will REFUSE to
# talk to launcher.samoy.love over plain HTTP, and it will refuse to let the
# user click through a certificate error, for the whole max-age window. There
# is no way to shorten that window for a browser that has already cached it
# except to serve a smaller max-age and wait for that client to come back.
#
# So if the Let's Encrypt certificate ever expires without being renewed, a
# max-age=31536000 (one year) header turns "the site is down until I fix the
# cert" into "the site is unreachable for every returning visitor for up to a
# year, with no override button". Automatic renewal has NOT been confirmed on
# this host yet, so we start at max-age=300 (5 minutes) — enough to be a real
# HSTS deployment, short enough that a mistake self-heals almost immediately.
# `includeSubDomains` is also omitted for now: it would extend the same one-way
# rule to every current and future *.samoy.love host, including ones this
# config knows nothing about.
#
# HOW TO CONFIRM AUTOMATIC RENEWAL WORKS (do all four on the server):
#   1. The timer exists and is active:
#        systemctl list-timers 'certbot*' --all
#        systemctl status certbot.timer
#      Expect an active timer with a NEXT run in the future. (On some installs
#      the job lives in /etc/cron.d/certbot instead — that is fine too.)
#   2. A renewal actually succeeds end to end, without touching the real cert:
#        sudo certbot renew --dry-run
#      Expect "Congratulations, all simulated renewals succeeded".
#   3. The deploy hook really reloads nginx, otherwise nginx keeps serving the
#      old certificate from memory after a successful renewal:
#        grep -r renew_hook /etc/letsencrypt/renewal/launcher.samoy.love.conf
#      It should run something like `systemctl reload nginx`.
#   4. Watch one real renewal happen. Certbot renews at ~30 days remaining, so
#      check the expiry date and come back after it has rolled over:
#        openssl s_client -connect launcher.samoy.love:443 -servername \
#          launcher.samoy.love </dev/null 2>/dev/null \
#          | openssl x509 -noout -dates
#
# HOW TO RAMP UP AFTERWARDS (edit every Strict-Transport-Security line in this
# file — they are intentionally duplicated per location, so change them all;
# `grep -c Strict-Transport-Security deploy/launcher.conf` tells you how many
# there should be). Wait at least the previous max-age between steps, and check
# the header with `curl -sI https://launcher.samoy.love | grep -i strict`:
#   step 1  max-age=300                              <- WE ARE HERE
#   step 2  max-age=86400                            (1 day, after step 2 above)
#   step 3  max-age=604800                           (1 week, after one real
#                                                     automatic renewal)
#   step 4  max-age=2592000                          (30 days)
#   step 5  max-age=31536000                         (1 year)
#   step 6  max-age=31536000; includeSubDomains      only once you are sure
#           EVERY *.samoy.love host has a valid certificate and always will
#   step 7  ...; includeSubDomains; preload          only if you actually want
#           to submit to hstspreload.org — removal from the preload list takes
#           months and is effectively irreversible. Not recommended here.
#
# Do NOT jump straight back to a year "because it worked for a week". The whole
# point of the ladder is that each step limits the blast radius of the next.
#
# ---------------------------------------------------------------------------
# CONTENT SECURITY POLICY
# ---------------------------------------------------------------------------
# CSP is only attached to HTML-serving locations (there is no point in sending
# it with images or JSON API responses).
#
# Landing (/, /index.html, *.html under /var/www/site) — ENFORCED.
#   Audited against landing/index.html + landing/scripts/main.js:
#     - inline <style> block with critical CSS      -> style-src 'unsafe-inline'
#     - Google Fonts CSS / font files               -> fonts.googleapis.com, fonts.gstatic.com
#     - <img> fallbacks to placehold.co             -> img-src https://placehold.co
#     - canvas 2d animation, no fetch/XHR/iframes   -> connect-src 'self', frame-ancestors 'none'
#
#   script-src is 'self' ONLY — no 'unsafe-inline'. The five inline
#   onerror="…" attributes that used to require it were replaced by a
#   declarative data-fallback="…" attribute plus a setupImageFallbacks()
#   binder in landing/scripts/main.js. index.html now contains exactly one
#   <script>, and it has a src=; there are no inline handlers, no eval, no
#   javascript: URLs and no fetch/XHR anywhere on the landing page.
#
#   style-src KEEPS 'unsafe-inline' and that is expected: index.html carries a
#   real inline <style> block of critical CSS. Removing it is a separate,
#   larger change and is not required for the script-src hardening above.
#
#   NOTE(owner): if you add an inline onclick=/onerror= to index.html again,
#   it will now silently do nothing (the browser blocks it and logs a CSP
#   violation). Bind handlers in scripts/main.js instead.
#
# Admin UI (/admin/, /admin/ui/*.html) — ENFORCED.
#   Derived from a full static audit of server/admin_ui/{admin,login}.html,
#   admin.js (~158 KB), login.js and admin.css. Findings, directive by directive:
#
#   script-src 'self' https://cdn.jsdelivr.net https://unpkg.com
#       Exactly five <script> tags exist across both HTML files and every one of
#       them has a src=: bootstrap@5.3.3 bundle (jsdelivr), uplot@1.6.30 iife
#       (unpkg), /admin/ui/admin.js, /admin/ui/login.js. There is NOT a single
#       inline <script> block, so no 'unsafe-inline' and no hashes are needed.
#       There are also NO inline event-handler attributes (onclick=/onerror=/…)
#       anywhere in the admin UI — every handler is bound with addEventListener.
#       (The one `onChange` hit in admin.js is a local variable name, not an
#       attribute.) No eval(), no new Function(), no setTimeout("string"),
#       no import(), no javascript: URLs, no document.write, no dynamically
#       created <script> elements — hence no 'unsafe-eval'. Bootstrap 5 and
#       uPlot do not need 'unsafe-eval' either.
#
#   style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com
#       'unsafe-inline' is genuinely required: admin.js builds markup through
#       .innerHTML (69 sites) containing many style="…" attributes, e.g.
#       `<select … style="max-width:200px">` in the paste-upload modal, and
#       admin.html has inline style= attributes too. The two CDNs serve
#       bootstrap.min.css and uPlot.min.css. There are no <style> blocks and no
#       @import in admin.css.
#
#   img-src 'self' data: blob: https:
#       blob: — URL.createObjectURL() previews for a picked/pasted image
#       (admin.js openPasteUploadDialog and the icon picker) are assigned to
#       img.src. https: (any host) — news covers come from
#       extractCoverFromMarkdown(): operator-authored markdown may reference an
#       image on any external host and the editor renders that preview
#       (admin.js:2258 `img.src = it.coverUrl`). data: — base64 images embedded
#       in the same operator-authored markdown. Images are an inert sink, so a
#       wide img-src is a deliberate, low-risk trade for a working editor.
#
#   connect-src 'self'
#       Every fetch()/XMLHttpRequest target is a same-origin relative path
#       (verified: no fetch("http…"), no protocol-relative URLs, the single XHR
#       is xhr.open('POST','/admin/uploadStream')). No WebSocket, no
#       EventSource, no sendBeacon.
#
#   font-src 'self'
#       admin.css contains no url()/@font-face; Bootstrap 5.3 ships a
#       system-font stack and no font files; uPlot ships none. Nothing should
#       ever request a font here. Worst case if this is wrong: a fallback font,
#       not a broken panel.
#
#   frame-src / child-src / worker-src 'none'
#       No <iframe>, no srcdoc, no <embed>/<object>, no Worker/SharedWorker and
#       no serviceWorker registration exist in the admin UI.
#
#   form-action 'self'
#       The only <form> is #loginForm in login.html; it has no action= and is
#       submitted from login.js via fetch to a same-origin path.
#
#   NOTE(owner): if you ever add an inline <script>, an onclick= attribute or a
#   third-party host to the admin UI, this header must be updated in the same
#   commit or the panel will break. If something does break, the browser console
#   names the exact directive; temporarily rename the header back to
#   Content-Security-Policy-Report-Only to unblock yourself.
#
# ---------------------------------------------------------------------------
# COMPRESSION — ON FOR TEXT, EXPLICITLY OFF FOR /content/
# ---------------------------------------------------------------------------
# gzip is enabled at the server level (so it is inherited by every location)
# and then explicitly DISABLED inside `location ^~ /content/`. Rationale, with
# numbers measured on this repository's own data — see deploy/README.md,
# section "Сжатие при раздаче (gzip)", for the full table:
#
#   * /manifests/*.json is the win. A real build manifest
#     (content/manifests/drive-beyond-horizons/1.0.2.json, 2809 file entries)
#     is 905 549 B raw and 272 404 B at gzip level 5 — 3.32x, i.e. ~618 KiB
#     saved on EVERY update check, per game, per client. The payload is a list
#     of {path, size, blake3, sha256} records: hex hashes and repeated path
#     prefixes are about as compressible as text gets.
#
#   * /content/ is not. 74% of the bytes of that same build are Unity
#     .lethalbundle/.assetbundle archives (already LZ4/LZMA-compressed
#     internally), plus .ress/.ogg/.mp4/.png — all pre-compressed formats where
#     gzip returns ~0% and costs real CPU on multi-GiB transfers. Worse, gzip
#     is not merely useless there, it is actively harmful:
#       - it disables sendfile()/directio (nginx has to copy through userspace),
#       - and it kills byte-range resume. The launcher resumes interrupted
#         downloads with a Range header (SimpleSyncService.cs sets
#         req.Headers.Range for partially downloaded files); nginx cannot serve
#         a range out of an on-the-fly gzip stream, so every resume would turn
#         into a full re-download of a multi-GiB file.
#     Hence `gzip off;` in that location — treat it as load-bearing, not tidy-up.
#
#   * /api/* and /news/* are JSON too and ride along for free via inheritance.
#     Compression for them is done HERE, in nginx, and deliberately NOT in the
#     Go backends: Go would have to compress on every request with no shared
#     config, no `Vary` bookkeeping and no way to be bypassed for /content/,
#     while nginx already terminates TLS and knows the MIME type.
#
# gzip_comp_level 5 is the knee of the curve for this data: level 1 gives
# 290 999 B, level 5 gives 272 404 B (-6.4%), level 9 only 268 824 B (a further
# -1.3% for ~35% more CPU). gzip_min_length 1024 keeps tiny replies
# (_registry/games.json is 542 B) uncompressed — below ~1 KB the framing
# overhead and the CPU are not worth it.
#
# The launcher supports exactly gzip and deflate: HttpClientProvider.cs sets
# AutomaticDecompression = GZip | Deflate and sends `Accept-Encoding: gzip,
# deflate`. It does NOT advertise br or zstd, so brotli/zstd modules would do
# nothing for the launcher today — see deploy/README.md before adding either.

# HTTP → HTTPS redirect.
#
# server_name lists launcher.samoy.love ONLY. Other domains on this host get
# their own :80 block in their own file; adding them here would make a launcher
# deploy responsible for their availability.
server {
    listen 80;
    listen [::]:80;
    server_name launcher.samoy.love;

    # И22: не сообщать точную версию nginx.
    #
    # По умолчанию nginx пишет «nginx/1.24.0» в заголовок Server и в тело
    # собственных страниц 404/502. Это готовый ответ на вопрос «какие
    # published CVE применимы к этому хосту» — вместе с тем, что здесь же
    # живут ещё три сайта.
    # Директива задана в обоих server-блоках, а не на уровне http: этот файл —
    # фрагмент для sites-available, http-уровень ему не принадлежит, и
    # трогать его значило бы менять поведение чужих сайтов.
    server_tokens off;

    # No Strict-Transport-Security here: HSTS delivered over plain HTTP is
    # ignored by browsers per RFC 6797.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME HTTP-01 (И20) — ОБЯЗАН СТОЯТЬ ДО `return 301` НИЖЕ.
    #
    # `return 301` на уровне server отправляет в HTTPS ВСЁ, включая проверку
    # Let's Encrypt. Пока сертификат жив, этого не видно; сломается ровно в тот
    # момент, когда он понадобится — при продлении. А дальше цепочка:
    # просроченный сертификат + HSTS (max-age=604800) = сайт недоступен, и
    # посетитель не может «кликнуть сквозь» предупреждение целую неделю.
    # То есть цена незамеченного отказа продления — не «предупреждение в
    # браузере», а недельная недоступность.
    #
    # ^~ гарантирует, что ни одна регулярка не перехватит этот префикс.
    # Каталог тот же, что передаётся certbot-у: `-w /var/www/site`
    # (см. заметку о webroot в TLS-блоке 443 — они существуют парой).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/site;
        default_type "text/plain";
        # Проверочный токен одноразовый; кэшировать его нечего и незачем.
        add_header Cache-Control "no-store" always;
        # Никаких try_files с фолбэком на редирект: если файла нет, честный
        # 404 — это диагностируемый ответ, а редирект превратился бы в
        # невнятную ошибку валидации на стороне Let's Encrypt.
        try_files $uri =404;
        access_log /var/log/nginx/launcher_acme_access.log;
    }

    # Serve robots.txt and sitemap.xml over HTTP without redirect (for crawlers)
    location = /robots.txt {
        root /var/www/site/current;
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /sitemap.xml {
        root /var/www/site/current;
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    return 301 https://$host$request_uri;
}

#
# Main site: launcher.samoy.love
server {
    # HTTP/2 IS ENABLED THE OLD WAY ON PURPOSE — DO NOT "MODERNISE" THIS LINE.
    #
    # Production runs nginx 1.24.0 (Ubuntu). The standalone `http2 on;`
    # directive only exists from 1.25: on 1.24 it is an unknown directive,
    # `nginx -t` fails, and `systemctl reload nginx` therefore refuses to apply
    # ANY of this file — the site keeps serving the previous config at best and
    # a failed deploy at worst. The `listen ... http2` form still works on
    # 1.25+, it is merely deprecated (it logs one warning), so this spelling is
    # the only one valid on both sides of the upgrade.
    #
    # Switch to the pair
    #     listen 443 ssl;
    #     http2 on;
    # ONLY after the production nginx is actually >= 1.25 (`nginx -v` on the
    # host), and re-run `sh deploy/nginx-check.sh` pinned to that version first.
    listen 443 ssl http2;
    server_name launcher.samoy.love;

    server_tokens off;   # И22 — см. пояснение в :80-блоке выше

    ssl_certificate     /etc/letsencrypt/live/launcher.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.samoy.love/privkey.pem;

    # =======================================================================
    # TLS-ПАРАМЕТРЫ (И4) — ЗАДАНЫ ЗДЕСЬ, А НЕ CERTBOT-ОМ. ЭТО НАМЕРЕННО.
    # =======================================================================
    # Раньше в блоке были только сертификат и ключ, всё остальное бралось из
    # дефолтов nginx 1.24. Конкретно это означало:
    #   * ssl_protocols по умолчанию включает TLS 1.0 и 1.1 — протоколы,
    #     отозванные RFC 8996; их наличие само по себе валит любой внешний
    #     аудит и даёт даунгрейд-поверхность;
    #   * ssl_session_cache по умолчанию `none` — ПОЛНОЕ рукопожатие на каждое
    #     соединение. Лаунчер качает контент многими параллельными
    #     соединениями с докачкой по Range, то есть платит за это постоянно,
    #     и платит CPU того же хоста, где живут ещё три сайта;
    #   * OCSP stapling выключен — каждый клиент ходит к OCSP-респондеру сам.
    #
    # ПОЧЕМУ ЭТО НЕ ОТДАНО CERTBOT-У. `certbot --nginx` дописывает в vhost
    # свои строки (include options-ssl-nginx.conf, ssl_dhparam). Но деплой
    # раскладывает этот файл ЦЕЛИКОМ, поверх — значит любые правки certbot
    # стираются следующей же выкаткой, и TLS-настройки тихо откатываются к
    # дефолтам. Поэтому:
    #
    #   ВЫПУСКАТЬ И ПРОДЛЕВАТЬ СЕРТИФИКАТ ТОЛЬКО РЕЖИМОМ webroot:
    #       certbot certonly --webroot -w /var/www/site -d launcher.samoy.love
    #   НЕ используйте `certbot --nginx`: он попытается редактировать этот
    #   файл, и его правки исчезнут при следующем деплое.
    #
    # Webroot-режим опирается на location /.well-known/acme-challenge/ в
    # :80-блоке выше — они существуют парой, не удаляйте одно без другого.

    # TLS 1.2 — минимум. 1.3 предпочтителен. 1.0/1.1 отключены.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Набор Mozilla Intermediate: только AEAD-шифры с прямой секретностью.
    # Все ECDHE — DHE-шифров нет намеренно, поэтому ssl_dhparam не нужен.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # off — рекомендация Mozilla для intermediate: у современных клиентов
    # порядок предпочтений лучше нашего (например, CHACHA20 на мобильных без
    # аппаратного AES).
    ssl_prefer_server_ciphers off;

    # Кэш сессий. Имя зоны с префиксом проекта: пространство имён общее на весь
    # nginx, а на хосте четыре сайта — совпадение имён было бы конфликтом.
    # 10m ≈ 40 000 сессий; для лаунчера с его параллельными загрузками это
    # разница между полным рукопожатием на каждое соединение и возобновлением.
    ssl_session_cache shared:chillhub_launcher_ssl:10m;
    ssl_session_timeout 1d;
    # Тикеты выключены: без регулярной ротации ключа они ломают прямую
    # секретность, а ротацию здесь никто не настраивает.
    ssl_session_tickets off;

    # OCSP stapling: статус сертификата приносит сервер, клиенту не нужно
    # ходить к респондеру Let's Encrypt (это ещё и утечка того, кто что
    # открывает).
    ssl_stapling on;
    ssl_stapling_verify on;
    # Нужен для проверки ответа OCSP. chain.pem кладёт сам certbot рядом с
    # fullchain.pem.
    ssl_trusted_certificate /etc/letsencrypt/live/launcher.samoy.love/chain.pem;
    # Резолвер нужен, чтобы nginx смог разрешить имя OCSP-респондера.
    # systemd-resolved на Ubuntu слушает 127.0.0.53. Если stapling не
    # заработает — проверьте `ss -lnup | grep 53`; отказ здесь мягкий, TLS
    # продолжает работать без сшивки.
    resolver 127.0.0.53 valid=300s;
    resolver_timeout 5s;

    # Base security headers (see header comment). Inherited only by locations
    # that declare no add_header of their own; every other location repeats them.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке

    # Enable strong cache validation
    etag on;

    # ---- Compression (see the COMPRESSION note at the top of this file) ----
    # Enabled here so every location inherits it; `location ^~ /content/`
    # turns it back off, which is the whole point of the arrangement.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # Vary: Accept-Encoding — required so caches/proxies never hand a gzipped
    # body to a client that did not ask for one.
    gzip_vary on;
    # Compress even when the request arrived through another proxy/CDN (with a
    # Via header). Without this, a future CDN in front would silently disable
    # compression for everything.
    gzip_proxied any;
    # text/html is ALWAYS compressed by nginx and must not be listed here
    # (listing it is a config error in some nginx versions).
    gzip_types
        application/json
        application/manifest+json
        application/javascript
        text/javascript
        application/x-javascript
        text/css
        text/plain
        text/xml
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/markdown
        application/wasm;
    gzip_disable "msie6";

    # ---- Лимиты тела запроса (И7) ----
    #
    # Здесь стояли client_max_body_size 30g и client_body_timeout 6h. На уровне
    # server они наследуются КАЖДЫМ location, включая анонимные: /api/,
    # /admin/api/auth/login, статику. То есть любой желающий мог держать
    # открытые соединения по шесть часов, отправляя байт в минуту, и заявлять
    # тело в 30 ГиБ — без авторизации.
    #
    # worker_connections — общий ресурс nginx для ВСЕХ ЧЕТЫРЁХ САЙТОВ этого
    # хоста (launcher, metro, snakes, samoy.love). Исчерпание пула медленными
    # соединениями к лаунчеру кладёт заодно и соседей, которые к этому конфигу
    # отношения не имеют.
    #
    # Теперь на уровне server — нормальные значения для JSON-API и статики, а
    # 30g/6h заданы ЛОКАЛЬНО в трёх загрузочных location (/admin/api/upload/,
    # /admin/api/uploadStream, /admin/api/) и в их alias-зеркалах. Прежний
    # довод «лимит должен примениться до auth_request» не работает: /_auth
    # объявлен с proxy_pass_request_body off, тело запроса он не читает, а
    # client_max_body_size в самом location применяется штатно.
    #
    # Публичный /api/ — только GET (server/cmd/api: games, maintenance, news),
    # поэтому 1m ему с запасом.
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Use default log format in server context; custom log_format must be defined at http-level
    access_log /var/log/nginx/launcher_access.log;
    error_log  /var/log/nginx/launcher_error.log;

    # Landing site static (from repository /landing)
    root /var/www/site/current;
    index index.html;

    # Установщик раздаётся из каталога ВНЕ релизов: 253 МБ незачем копировать
    # в каждую выкатку, а подмена сайта не должна его сносить. Публикуется
    # отдельной целью пайплайна.
    location /downloads/ {
        alias /var/www/site-downloads/;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }


    # Unified /assets with fallback to news assets using internal prefix + root
    # 1) Try landing: /var/www/site/assets/<tail>
    # 2) Fallback (internal): /var/www/launcher/news/assets/<tail>
    #
    # WHY THE CACHE RULES ARE DUPLICATED HERE INSTEAD OF LIVING ONLY BELOW
    # -------------------------------------------------------------------
    # nginx tries regex locations in the order they appear in the file and stops
    # at the first match. This block has to come BEFORE the landing cache blocks
    # further down, because those end in `try_files $uri =404` — if they matched
    # /assets/... first the news-assets fallback would be replaced by a 404 and
    # every image in an operator-authored article would break.
    #
    # The consequence used to be that ONE single `location ~ ^/assets/(.*)$`
    # swallowed the whole prefix and set no Cache-Control at all, so nothing
    # under /assets/ was cacheable — including hashed assets that are entitled
    # to the year-long immutable cache. The fix keeps the priority and splits
    # the block in two, mirroring the landing rules below: hashed first,
    # everything else second. Both keep the fallback.
    #
    # `always` on every add_header so the headers survive error responses too.
    # Verified against a real nginx 1.24 with live requests, not just `nginx -t`.
    #
    # 1) Hashed assets under /assets/: immutable for a year.
    #    DOUBLE-QUOTED for the {8,} quantifier — see the long note on the
    #    landing equivalent below before touching this regex.
    location ~* "^/assets/(.+\.[a-f0-9]{8,}\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot))$" {
        set $asset_tail $1;
        root /var/www/site/current;
        try_files /assets/$asset_tail @news_assets_fallback;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    # И24: запрос ровно `/assets/` — это запрос каталога, а не файла.
    #
    # Он попадал в блок ниже с пустым $1, try_files превращался в
    # `try_files /assets/ ...`, nginx упирался в каталог с выключенным
    # autoindex и отвечал 403. 403 означает «есть, но нельзя» и провоцирует
    # искать обход; правильный ответ — 404 «нет такого ресурса».
    # Точное совпадение побеждает регулярку, поэтому блок ниже не трогаем.
    location = /assets/ {
        return 404;
    }
    # 2) Everything else under /assets/ (news assets included): revalidate.
    location ~ ^/assets/(.*)$ {
        set $asset_tail $1;
        root /var/www/site/current;
        try_files /assets/$asset_tail @news_assets_fallback;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    # Public feedback submit (no auth, proxied to admin backend)
    # Must appear BEFORE the protected /admin/api/ location
    location = /feedback/submit {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
        # Должно быть БОЛЬШЕ серверного MaxBodyBytes (feedback.go), иначе nginx
        # отвергнет запрос раньше бэкенда — голым 413 вместо внятного JSON-ответа.
        # Сейчас там 2*MaxLogBytes + 128 КиБ = 2 МиБ + 128 КиБ при бандле в 1 МиБ,
        # поэтому 2m было бы впритык и срезало бы законные отчёты.
        client_max_body_size 3m;
        # И25: `always` обязателен. Без него add_header применяется только к
        # ответам 20x/30x/304, то есть ровно на 4xx и 5xx — там, где ответ чаще
        # всего содержит текст ошибки бэкенда, — заголовок не выставлялся.
        # Так `no-store` пропадал именно на тех ответах, которые кэшировать
        # особенно не следует. Проверено по всему файлу: `always` теперь стоит
        # на КАЖДОМ add_header.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    # Public launcher metrics ingest (no auth, proxied to the admin backend —
    # that process is the single writer of the events file). Same shape as
    # /feedback/submit above; must appear BEFORE the protected /admin/api/
    # location. Events are a few hundred bytes, hence the tiny body limit.
    location = /metrics/report {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
        client_max_body_size 32k;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    location @news_assets_fallback {
        internal;
        # Re-map to news assets root, stripping '/assets/' prefix
        root /var/www/launcher/news/assets;
        # After root above, '/<tail>' resolves to /var/www/launcher/news/assets/<tail>
        try_files /$asset_tail =404;
        # A named location is its own configuration level: the add_header set of
        # the /assets/ block that jumped here does NOT carry over, so without
        # these the fallback would answer with no Cache-Control and no security
        # headers at all. News assets are operator uploads under stable names —
        # revalidate rather than cache long.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    # Public API (Go, :55700)
    location /api/ {
        proxy_pass http://127.0.0.1:55700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        access_log /var/log/nginx/launcher_api_access.log;
        error_log  /var/log/nginx/launcher_api_error.log;
    }

    # Internal auth gate for admin (uses backend verify endpoint)
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:55777/admin/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Admin API (Go, :55777)
    # Allow auth endpoints without auth_request
    location ^~ /admin/api/auth/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
    }

    # Unauthenticated health endpoint for liveness probes
    # Must appear BEFORE the protected /admin/api/ location
    location = /admin/api/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
        # do not cache health responses
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    # Chunked upload endpoints: bypass auth_request and disable buffering
    location ^~ /admin/api/upload/ {
        client_max_body_size 30g;
        # И7: длинный таймаут задан ЗДЕСЬ, а не на уровне server — иначе его
        # наследовали бы и анонимные location.
        client_body_timeout 6h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_pass http://127.0.0.1:55777;
    }

    # High-throughput upload endpoint: bypass auth_request to avoid nginx buffering of request body
    # Auth is enforced inside the Go handler (handleUploadStream)
    location = /admin/api/uploadStream {
        client_max_body_size 30g;
        client_body_timeout 6h;   # И7: локально, не на уровне server
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_pass http://127.0.0.1:55777;
    }

    # Protected admin API
    location /admin/api/ {
        client_max_body_size 30g;
        client_body_timeout 6h;   # И7: локально, не на уровне server
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        auth_request /_auth;

        proxy_pass http://127.0.0.1:55777;
    }

    # =======================================================================
    # ALIAS-МАРШРУТЫ /admin/... БЕЗ /api/ (Б7)
    # =======================================================================
    # Go-бэкенд регистрирует КАЖДЫЙ эндпоинт под двумя путями: канонический
    # /admin/api/<name> и производный алиас /admin/<name> (см.
    # server/cmd/admin/routes.go, функция aliasOf + register). В nginx же был
    # описан только /admin/api/..., а `location /` в этом файле отсутствует —
    # поэтому запрос на алиас не проваливался в бэкенд, а уходил в статику из
    # server-level `root /var/www/site` и отвечал 404.
    #
    # Ровно так сломалась загрузка сборки лаунчера: форма админки слала
    # POST /admin/uploadStream, конфиг знал только = /admin/api/uploadStream,
    # и админка получала 404 (проверено на проде). Путь в JS чинится отдельно
    # (другой агент); эти блоки — защита от повторения: любой клиент, который
    # обратится к алиасу, попадёт в бэкенд, а не в статику.
    #
    # Перечень ниже сверен с routes.go построчно. Не покрываются намеренно:
    #   * /admin/api/auth/*          — noAlias, у алиаса нет контракта;
    #   * /admin/api/upload/*        — noAlias, chunked-загрузка всегда идёт
    #                                  по каноническому пути;
    #   * /admin, /admin/, /admin/ui/* — это UI, у них свои location выше.
    # Добавляя маршрут в routes.go без noAlias, добавьте его и сюда.
    #
    # Приоритеты nginx соблюдены: точные (`=`) совпадения побеждают любые
    # регулярки, поэтому блоки ниже не конкурируют с = /admin/ и = /admin;
    # регулярка перечисляет имена явно и заведомо не задевает /admin/ui/.

    # Публичный health — зеркало = /admin/api/health (в бэкенде он в allowlist
    # авторизации, значит и алиас обязан быть без auth_request).
    location = /admin/health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://127.0.0.1:55777;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    # Зеркало = /admin/api/uploadStream, ОДИН В ОДИН по лимитам и таймаутам.
    # Как и канонический путь, идёт без auth_request: авторизацию проверяет
    # сам Go-обработчик (handleUploadStream), а auth_request заставил бы nginx
    # буферизовать тело многогигабайтной загрузки.
    location = /admin/uploadStream {
        client_max_body_size 30g;
        client_body_timeout 6h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_pass http://127.0.0.1:55777;
    }

    # Остальные алиасы — зеркало защищённого `location /admin/api/`.
    # /admin/upload здесь же: это тоже загрузка сборки (b.Upload), ей нужны те
    # же 30g и длинные таймауты.
    location ~ ^/admin/(?:list|activate|deleteVersion|upload|system/free|feedback/(?:list|get|delete|toggleImportant|markRead|markUnread|clear)|maintenance/(?:get|set|clear)|metrics/(?:summary|clear)|news/(?:list|get|save|delete|rebuild|publish|preview|uploadCover|assets)|news/assets/(?:mkdir|upload|uploadByUrl|delete|rename)|games|games/(?:save|scan)|games/icon/upload)$ {
        client_max_body_size 30g;
        client_body_timeout 6h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 6h;
        proxy_send_timeout 6h;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        auth_request /_auth;

        proxy_pass http://127.0.0.1:55777;
    }

    # -----------------------------------------------------------------------
    # ADMIN UI — THE WHOLE SHELL IS BEHIND auth_request, NOT JUST /admin/
    # -----------------------------------------------------------------------
    # Historically only `location = /admin/` was gated. Everything else under
    # /admin/ui/ was matched by the three regex blocks further down, which had
    # no auth_request at all, so an anonymous client could simply fetch
    # /admin/ui/admin.html and /admin/ui/admin.js (188 KB) and read the entire
    # endpoint map, parameter names and role checks of the panel. The data
    # behind /admin/api/ was still protected, but the reconnaissance was free.
    #
    # Now every /admin/ui/ location carries `auth_request /_auth;`. The four
    # files the login page itself needs are pinned to EXACT (`location = `)
    # matches and stay public — nginx always prefers an exact match over any
    # regex, so these four win no matter where the regex blocks sit:
    #
    #     /admin/ui/login.html   the page itself (the 401 redirect target)
    #     /admin/ui/login.js     its only script
    #     /admin/ui/admin.css    the stylesheet it shares with admin.html (3 KB)
    #     /admin/ui/app.ico      favicon + the logo inside the login card
    #
    # If you add a file that login.html references, add an exact location for
    # it here too, otherwise the login page will render broken for logged-out
    # users (and only for them — an authorised operator will not notice).
    #
    # HTML gets `error_page 401 =302 /admin/ui/login.html` so a human landing on
    # a shell URL is bounced to the form, exactly like /admin/ already did.
    # Assets deliberately do NOT redirect: a 401 on a .js is the correct answer
    # for fetch()/<script>, and redirecting them to an HTML page would only make
    # the browser console lie about the cause.
    # -----------------------------------------------------------------------
    location = /admin/ui/login.html {
        root /var/www/launcher/admin_ui;
        try_files /login.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        # Enforcing — see the CONTENT SECURITY POLICY comment at the top of this
        # file for the per-directive justification (static audit of admin_ui).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'" always;
    }
    location = /admin/ui/login.js {
        root /var/www/launcher/admin_ui;
        try_files /login.js =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    location = /admin/ui/admin.css {
        root /var/www/launcher/admin_ui;
        try_files /admin.css =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    location = /admin/ui/app.ico {
        root /var/www/launcher/admin_ui;
        try_files /app.ico =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    # Admin UI (static). Serve via nginx from /var/www/launcher/admin_ui
    # Use simple prefix location (no ^~) so regex cache rules below can match.
    # Catches whatever the regex blocks below do not (extensionless files,
    # directory requests); gated like everything else under /admin/ui/.
    location /admin/ui/ {
        auth_request /_auth;
        error_page 401 =302 /admin/ui/login.html;
        alias /var/www/launcher/admin_ui/;
    }
    location = /admin {
        return 302 /admin/;
    }
    # Serve only the root /admin/ (admin.html) via try_files rooted at admin_ui
    # This works well for both GET and HEAD and avoids proxying
    # Protect admin UI entrypoint with auth_request; login page is under /admin/ui/login.html (not protected)
    location = /admin/ {
        auth_request /_auth;
        error_page 401 =302 /admin/ui/login.html;
        root /var/www/launcher/admin_ui;
        try_files /admin.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        # Enforcing — see the CONTENT SECURITY POLICY comment at the top of this
        # file for the per-directive justification (static audit of admin_ui).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'" always;
    }

    # Landing HTML should never be cached by browsers
    location = / {
        root /var/www/site/current;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://placehold.co; connect-src 'self'" always;
    }
    location = /index.html {
        root /var/www/site/current;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://placehold.co; connect-src 'self'" always;
    }
    # Admin UI assets and HTML (placed BEFORE generic static to ensure correct alias handling)
    # Use capture + alias to map /admin/ui/<path> to /var/www/launcher/admin_ui/<path>
    # 1) Hashed assets (long cache)
    # The regex is DOUBLE-QUOTED so the {8,} quantifier survives nginx's config
    # parser. Do not "escape" the braces instead — see the note on the landing
    # equivalent below; \{8,\} is a literal brace sequence in PCRE and the
    # location silently never matches.
    location ~* "^/admin/ui/(.+\.[a-f0-9]{8,}\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot))$" {
        # Gated: see the "ADMIN UI — THE WHOLE SHELL IS BEHIND auth_request"
        # note above. No 401->302 here: these are assets, not navigations.
        auth_request /_auth;
        alias /var/www/launcher/admin_ui/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    # 2) Other static assets (revalidate)
    location ~* ^/admin/ui/(.+\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot))$ {
        # Gated. admin.js alone is 188 KB of endpoint map — this is the block
        # that used to hand it to anonymous clients.
        auth_request /_auth;
        alias /var/www/launcher/admin_ui/$1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    # 3) Admin UI HTML (no-cache)
    location ~* ^/admin/ui/(.+\.html)$ {
        # Gated. login.html is NOT matched here — it has its own exact location
        # above, and an exact match always beats a regex, so there is no
        # redirect loop between this block and the login page.
        auth_request /_auth;
        error_page 401 =302 /admin/ui/login.html;
        alias /var/www/launcher/admin_ui/$1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        # Enforcing — see the CONTENT SECURITY POLICY comment at the top of this
        # file for the per-directive justification (static audit of admin_ui).
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'" always;
    }

    # Static assets caching for landing site (placed AFTER admin UI blocks)
    # 1) Files with content hashes in name: long-lived immutable cache
    #
    # The `{8,}` quantifier collides with nginx's block delimiters, so the regex
    # must be DOUBLE-QUOTED. It used to be written as `\{8,\}` instead — that
    # passes `nginx -t`, but PCRE reads `\{` as a *literal* brace, so the pattern
    # demanded a filename containing the four characters `{8,}`. Both hashed-asset
    # locations therefore never matched anything and every hashed asset fell
    # through to the `must-revalidate` block below, losing the immutable
    # year-long cache. Verified with a real nginx (see deploy/nginx-check.sh):
    # /assets/app.a1b2c3d4.css hits this block with quotes and misses it with
    # backslashes.
    location ~* "^/.+\.[a-f0-9]{8,}\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$" {
        root /var/www/site/current;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    # 2) Other static files (no hash): короткий срок жизни + ревалидация
    #
    # Л1: здесь стояло max-age=0, must-revalidate. Формально это «кэшируется, но
    # всегда перепроверяй», а фактически — круговой запрос на КАЖДЫЙ файл при
    # КАЖДОМ заходе. Проверено на проде для /styles.css, /scripts/main.js,
    # /favicon.ico: браузер ходил за 304 по каждому, даже переходя между
    # страницами внутри одной сессии.
    #
    # max-age=300 убирает этот трафик внутри сессии, не превращая выкатку в
    # лотерею: имена файлов лендинга не версионированы, поэтому потолок
    # «устаревания» после деплоя — пять минут, и он осознанный. Для файлов с
    # хешем в имени есть блок выше с immutable на год — вот там кэш длинный
    # и безопасный.
    #
    # must-revalidate оставлен намеренно: он запрещает отдавать ПРОСРОЧЕННУЮ
    # копию (например, когда браузер офлайн), то есть после истечения пяти
    # минут ревалидация обязательна.
    location ~* ^/.+\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$ {
        root /var/www/site/current;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }
    # HTML remains non-cacheable
    location ~* ^/.+\.(?:html)$ {
        root /var/www/site/current;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://placehold.co; connect-src 'self'" always;
    }
    # No generic /admin/ proxy; API is under /admin/api/ only

    # Content storage (large files) — use ^~ to prevent regex locations from taking over
    location ^~ /content/ {
        alias /var/www/launcher/content/;
        # И23: раньше здесь было max-age=0, must-revalidate.
        #
        # Пути под /content/ версионированы и неизменяемы: файл живёт по адресу
        # с версией сборки, и содержимое по этому адресу не меняется НИКОГДА —
        # новая версия публикуется по новому пути. Ревалидация на каждый запрос
        # к неизменяемому адресу — это условный запрос перед каждым куском
        # многогигабайтной загрузки, причём лаунчер качает много кусков
        # параллельно и возобновляет докачку по Range.
        #
        # immutable на год говорит браузеру не ревалидировать вовсе. Целостность
        # от этого не страдает: она обеспечивается не заголовком, а хешами из
        # манифеста, которые лаунчер сверяет после загрузки.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        # Compression MUST stay off here. Game payloads are already-compressed
        # archives (gzip gains ~0%), gzip would disable the sendfile/directio
        # fast path below, and — the hard blocker — it would break the
        # launcher's Range-based resume of interrupted multi-GiB downloads.
        # See the COMPRESSION note at the top of this file.
        gzip off;
        sendfile on;
        tcp_nopush on;
        directio 8m;
        # И21: open_file_cache без спутников — наполовину выключённый кэш.
        #
        # Без open_file_cache_valid nginx использует значение по умолчанию 60s,
        # но полагаться на неявный дефолт в кэше метаданных файлов, которые
        # админка перезаписывает при публикации, — плохая идея: непонятно, как
        # долго может жить устаревший дескриптор.
        # Без open_file_cache_errors (по умолчанию off) НЕ кэшируются
        # результаты «файла нет» — а именно они и сыплются чаще всего, когда
        # клиент запрашивает удалённую версию: каждый такой запрос идёт до
        # диска. Это и есть дешёвая часть кэша, которая не работала.
        # min_uses=2 не даёт единичному обращению занимать слот.
        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
        access_log /var/log/nginx/launcher_content_access.log;
        error_log  /var/log/nginx/launcher_content_error.log;
    }

    # П4: latest.json — указатель «какая версия сейчас актуальна».
    #
    # Он попадал под общий /manifests/ с `max-age=600`, то есть свежая сборка
    # была невидима клиентам до десяти минут после публикации. Ровно этот файл
    # лаунчер опрашивает, чтобы решить, надо ли обновляться, — кэшировать
    # указатель на десять минут значит откладывать выкатку на десять минут,
    # включая срочную (откат сломанной версии).
    #
    # no-cache — это НЕ «не кэшировать»: копия сохраняется, но перед каждым
    # использованием обязана быть подтверждена. Вместе с `etag on` на уровне
    # server это стоит одного условного запроса с ответом 304 без тела —
    # файл в единицы килобайт, цена ничтожна, а свежесть точная.
    #
    # Точное (`=`) совпадение побеждает `^~ /manifests/` ниже независимо от
    # порядка в файле; сами версионные манифесты <version>.json неизменяемы и
    # остаются на общем правиле.
    location = /manifests/launcher/latest.json {
        alias /var/www/launcher/manifests/launcher/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    # Manifests (JSON, icons) — high priority and fast local file delivery
    location ^~ /manifests/ {
        alias /var/www/launcher/manifests/;
        # Use short caching with revalidation to avoid repeated full fetches while keeping updates responsive
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
        # gzip is inherited from the server level and is the main reason this
        # location exists in the compression story: a real manifest shrinks
        # 905 549 B -> 272 404 B (3.32x). nginx will not use sendfile() for the
        # compressed .json responses (it has to run them through the gzip
        # filter), which is fine — manifests are ~1 MB, not gigabytes. sendfile
        # still applies to the icons served from the same tree.
        #
        # NOTE(owner): the CPU cost is paid on every manifest request. If that
        # ever shows up in `top`, the zero-CPU alternative is to precompress
        # manifests at publish time and add `gzip_static on;` here — nginx then
        # serves <name>.json.gz verbatim. Not enabled by default because it
        # requires ngx_http_gzip_static_module (check with
        # `nginx -V 2>&1 | tr ' ' '\n' | grep gzip_static`) AND a publisher-side
        # change to write the .gz files. See deploy/README.md.
        #
        # Cache-Control above is unaffected: gzip_vary adds `Vary:
        # Accept-Encoding`, so revalidation with ETag keeps working per-encoding.
        # Fast local file serving and metadata caching
        sendfile on;
        tcp_nopush on;
        # И21: см. пояснение в блоке /content/ выше. Здесь срок жизни короче:
        # latest.json и манифесты перезаписываются публикацией, и метаданные
        # не должны переживать её надолго.
        open_file_cache max=10000 inactive=30s;
        open_file_cache_valid 10s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
    }

    # News (markdown, json) — protect from regex static handlers with ^~
    location ^~ /news/ {
        alias /var/www/launcher/news/;
        # gzip inherited from the server level: index.json and any *.json here
        # are compressed. Article bodies are *.md, for which stock nginx has no
        # mime.types entry, so they are served as application/octet-stream and
        # therefore NOT compressed. That is deliberate — they are a few KB each,
        # and overriding `types` inside this location would replace (not extend)
        # the MIME map for everything else served from the same tree.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=604800" always;  # 7 дней — см. заметку о разгоне HSTS в шапке
    }

    # (Optional) explicit news assets path still works via fallback; dedicated block not required
}
