# Параметры TLS для всех сайтов samoy.love.
# Ставится как /etc/nginx/snippets/samoylove-tls.conf и подключается в КАЖДЫЙ
# server-блок с `listen 443 ssl` сразу после ssl_certificate/ssl_certificate_key.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ. До него набор протоколов и шифров был задан ровно у одного
# сайта из шести (launcher), ещё один брал его из certbot'овского
# options-ssl-nginx.conf, а у остальных четырёх в конфиге стояли только пути к
# сертификатам. Фактический TLS определялся состоянием сервера и из репозитория
# не проверялся: `nginx -t` в CI проходил одинаково и с TLS 1.0, и без него.
# Это была дыра не в шифровании, а в воспроизводимости — самая незаметная.
#
# ПОЧЕМУ НЕ CERTBOT. `certbot --nginx` дописывает свои строки прямо в vhost, а
# vhost'ы здесь раскладываются выкаткой ЦЕЛИКОМ, поверх — значит правки certbot
# стираются следующим же деплоем и TLS тихо откатывается к дефолтам nginx.
# Сертификаты выпускаются и продлеваются ТОЛЬКО режимом webroot:
#     certbot certonly --webroot -w /var/www/<site> -d <domain>
#
# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. OCSP stapling (ssl_stapling, ssl_stapling_verify,
# ssl_trusted_certificate, resolver) остаётся в конфигах сайтов: он требует
# chain.pem конкретного домена, а имя файла общим сниппетом не выражается.

# TLS 1.2 — минимум, 1.3 предпочтителен. 1.0 и 1.1 отозваны RFC 8996, но
# остаются во ВСТРОЕННОМ дефолте nginx — то есть молчание в конфиге означает
# именно их включение.
ssl_protocols TLSv1.2 TLSv1.3;

# Набор Mozilla Intermediate: только AEAD-шифры с прямой секретностью.
# Все ECDHE — DHE-шифров нет намеренно, поэтому ssl_dhparam не нужен ни одному
# сайту (файл ssl-dhparams.pem от certbot можно не подключать).
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# off — рекомендация Mozilla для intermediate: у современных клиентов порядок
# предпочтений лучше нашего (например, CHACHA20 на мобильных без аппаратного AES).
ssl_prefer_server_ciphers off;

# Кэш сессий общий на все сайты хоста: пространство имён зон в nginx одно, и
# одна зона на 10m (≈40 000 сессий) дешевле шести по 10m. Дефолт — `none`, то
# есть полное рукопожатие на каждое соединение.
#
# ВАЖНО: одноимённая зона должна объявляться с ОДНИМ И ТЕМ ЖЕ размером во всех
# server-блоках, иначе nginx откажется стартовать. Именно поэтому объявление
# живёт здесь, а не копиями в сайтах.
ssl_session_cache shared:samoylove_ssl:10m;
ssl_session_timeout 1d;

# Тикеты выключены: без регулярной ротации ключа они ломают прямую секретность,
# а ротацию здесь никто не настраивает.
ssl_session_tickets off;
