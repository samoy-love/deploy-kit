# Приёмник событий интерфейса. Ставится как
# /etc/nginx/snippets/samoylove-events.conf и подключается в server-блок
# каждого сайта.
#
# ---------------------------------------------------------------------------
# ЗАЧЕМ ОН ВООБЩЕ ЕСТЬ
# ---------------------------------------------------------------------------
# Серверные метрики видят только то, что дошло до сервера. У лаунчера и snakes
# этого хватает: установка и убийство — события сервера. А метро считает
# маршруты на клиенте и офлайн; сколько людей построило маршрут, из журнала
# nginx узнать нельзя в принципе, потому что запроса не было.
#
# ---------------------------------------------------------------------------
# ЧТО ЭТО НЕ ТРЕКЕР В ОБЫЧНОМ СМЫСЛЕ
# ---------------------------------------------------------------------------
# Он считает, ЧТО произошло, и не пытается узнать, КТО это сделал:
#
#   нет cookie — ни одной, ни на чтение, ни на запись;
#   нет идентификатора сессии или посетителя, ни в запросе, ни на клиенте;
#   нет тела запроса — событие целиком помещается в путь;
#   нет $args — параметры не пишутся никуда, см. log_format;
#   нет IP и User-Agent — их физически нет в формате журнала;
#   нет ответа с содержимым — 204, чтобы нечего было кэшировать и подменять.
#
# Из этого нельзя восстановить ни путь одного человека по сайту, ни двух
# событий одного посетителя: в журнале лежат только домен, имя события,
# код и ноль байт. Пересечь их между собой не по чему.
#
# Обещание в README при этом всё равно пришлось переписать: «ноль трекеров»
# перестало быть правдой буквально, и делать вид, что запрос от браузера —
# не запрос от браузера, нечестно. Теперь там сказано, чего именно нет.
#
# ---------------------------------------------------------------------------
# ПОЧЕМУ БЕЗ ОТДЕЛЬНОЙ СЛУЖБЫ
# ---------------------------------------------------------------------------
# Событие — это факт «случилось один раз». Ровно это умеет access_log: строка
# на запрос. Отдельный сервис-приёмник добавил бы процесс, порт, выкатку и
# место, где теряются данные, ради счётчика, который nginx уже ведёт. Журнал
# читает тот же экспортёр, что и посещаемость, отдельным namespace.
#
# ---------------------------------------------------------------------------
# КАРДИНАЛЬНОСТЬ
# ---------------------------------------------------------------------------
# Имя события приходит из интернета, то есть кто угодно может позвать
# /e/чтоугодно. Ограничение стоит в экспортёре: список имён закрыт, всё
# незнакомое сворачивается в один ряд "other". Здесь же ограничена длина и
# алфавит — чтобы в журнал не попадала произвольная строка на килобайт.

location ^~ /e/ {
    # Только короткие имена из букв и подчёркиваний. Всё остальное — 404, и
    # в журнал событий не попадает вовсе.
    location ~ "^/e/[a-z][a-z0-9_]{2,39}$" {
        # Событие пишется ТОЛЬКО в свой журнал. В samoylove_metrics.log ему
        # нельзя: там считаются просмотры страниц, и клики раздули бы
        # посещаемость втрое, оставшись неотличимыми от неё.
        access_log /var/log/nginx/samoylove_events.log samoylove_metrics;
        error_log  /var/log/nginx/samoylove_events_error.log;

        # 204 без тела: ответ нечего кэшировать, нечего подменять и нечего
        # разбирать на клиенте. sendBeacon именно этого и ждёт.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 204;
    }

    access_log off;
    return 404;
}
