# Заголовки безопасности для metrics.samoy.love.
# Ставится как /etc/nginx/snippets/samoy-metrics-headers.conf
#
# Почему отдельный сниппет, а не общий samoy-security-headers.conf.
# Общий написан под статические сайты на Astro. Его CSP запрещает eval,
# blob-воркеры и form-action — Grafana же собирает часть панелей через
# eval, рисует экспорт картинок в blob и логинится обычной формой. Под общим
# сниппетом интерфейс открывается пустым белым экраном, а в консоли —
# отказы CSP. Дописать разрешения вторым add_header нельзя: два заголовка
# Content-Security-Policy браузер пересекает, то есть более строгий всё
# равно победит. Поэтому — свой набор целиком.
#
# ВАЖНО: этот сниппет подключается и в server-блоке, и в КАЖДОМ location.
# В nginx add_header не складывается: как только во вложенном блоке появился
# свой add_header, весь родительский набор в нём перестаёт отдаваться.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Панель мониторинга не должна попадать в поисковую выдачу. Basic-auth её и
# так не пустит, но лишний повод объяснять, что за домен, ни к чему.
add_header X-Robots-Tag "noindex, nofollow" always;
