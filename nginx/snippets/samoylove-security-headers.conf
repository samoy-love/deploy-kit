# Заголовки безопасности для samoy.love.
# Ставится как /etc/nginx/snippets/samoylove-security-headers.conf
#
# ВАЖНО: этот сниппет подключается и в server-блоке, и в КАЖДОМ location,
# где есть свой add_header. В nginx add_header не складывается: директивы
# вложенного уровня полностью заменяют набор родительского. Без повторного
# include HTML-ответы уходили бы вообще без CSP, HSTS и X-Frame-Options —
# ровно так и было, пока заголовки стояли только в server.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP.
#
# script-src — БЕЗ 'unsafe-inline'. Раньше он там был, потому что Astro
# вклеивает мелкие собранные модули прямо в HTML; это означало, что политика
# не отличала наши скрипты от чужого, вставленного через XSS, — то есть не
# закрывала ровно ту дыру, ради которой существует.
#
# Инлайн-скриптов в сборках больше нет: и samoy.love, и status.samoy.love
# собираются с vite.build.assetsInlineLimit: 0, всё уезжает в /_astro/*.js.
# Оба репозитория держат это гейтом `npm run check:no-inline-scripts` — в CI
# и в гейтах выкатки, — поэтому вернуть инлайн незаметно нельзя: упадёт
# сборка. Тот же приём давно применён у metro (nginx/sites/metro.conf).
#
# ДОБАВЛЯЯ СЮДА ТРЕТИЙ САЙТ, сначала убедитесь, что у него та же проверка.
# Иначе его скрипты молча перестанут выполняться уже на проде.
#
# <script type="application/ld+json"> (разметка Schema.org) остаётся инлайном
# и это нормально: браузер его не исполняет, script-src на него не действует.
#
# style-src 'unsafe-inline' остаётся: Astro инлайнит scoped-стили и служебные
# правила view transitions, и хешами это не закрывается (см. ниже). Инъекция
# стиля несравнимо менее опасна, чем инъекция скрипта, — размен осознанный.
#
# Всё остальное закрыто: сторонние скрипты, фреймы и отправка данных
# куда-либо невозможны.
#
# ПОЧЕМУ НЕ ХЕШИ ДЛЯ СТИЛЕЙ (2026-08-02, samoy.love, Astro 7.1.6). Включение
# `security: { csp: true }` действительно кладёт на каждую страницу
# <meta http-equiv="content-security-policy"> с хешами — и ломает оформление:
# по CSP3 наличие хешей ОТМЕНЯЕТ 'unsafe-inline' в той же директиве, а Astro
# хеширует не всё, что сам же инлайнит. Проверено в браузере: три служебных
# <style> механизма view transitions и любой <style set:html> приходят с
# `sheet: false`, то есть отброшены. Плюс атрибуты style="..." хешем не
# закрываются в принципе — хеш описывает содержимое тега, а не атрибута.
#
# Ломается это МОЛЧА: страница отдаётся, скрипты работают, просто часть стилей
# не применяется. Поэтому здесь по-прежнему 'unsafe-inline', а не половинчатый
# переход. Возвращаться к этому имеет смысл, когда Astro начнёт хешировать
# собственные динамические стили; проверять — тем же способом, сравнив
# document.querySelectorAll('style') по полю .sheet.
#
# data: в font-src обязателен: сборщик инлайнит woff2 прямо в CSS,
# и без него браузер молча блокирует шрифт — страница выглядит
# рабочей, но набрана запасной гарнитурой.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
