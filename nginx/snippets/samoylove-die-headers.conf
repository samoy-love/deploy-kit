# Заголовки, специфичные для игры die.samoy.love.
# Ставится как /etc/nginx/snippets/samoylove-die-headers.conf
#
# Подключается ПОСЛЕ samoylove-security-headers.conf и в server-блоке, и в
# каждом location: в nginx add_header не складывается, вложенный набор
# полностью заменяет родительский.
#
# Зачем отдельный сниппет, а не правка общего. Игре нужны две вещи, которых
# нет и не должно быть у страниц: собственный CSP с worker-src и заголовки
# изоляции для будущих замеров производительности. Дописывать это в общий
# сниппет значит менять политику трёх чужих сайтов ради одного.

# CSP игры.
#
# Отличий от общего сниппета два, и оба обязательны:
#
# 1. worker-src 'self' — без него браузер блокирует регистрацию service
#    worker, и игра теряет офлайн вместе с проверкой обновлений. Ломается
#    молча: страница открывается, просто обновления не приходят никогда.
# 2. script-src БЕЗ 'unsafe-inline' — как и у соседей. Инлайн-скриптов в
#    сборке нет: весь код уезжает в /assets/*.js, а держит это гейт
#    `npm run check:no-debug-api` вместе со сборкой Vite.
#
# style-src 'unsafe-inline' не нужен вовсе: интерфейс игры рисуется внутри
# canvas, а не в DOM, и единственный стиль — статический файл.
#
# connect-src 'self' достаточно: телеметрия и лидерборды появятся в 0.11.0 и
# будут ходить на этот же домен.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

# Изоляция источника.
#
# Нужна не сейчас, а начиная с 0.9.0: точные замеры кадра и SharedArrayBuffer
# для симуляции в Web Worker требуют cross-origin isolation. Заголовки
# безобидны для игры, у которой нет ни одного стороннего ресурса, — а
# добавлять их задним числом означает ловить непонятные отказы уже на проде.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
