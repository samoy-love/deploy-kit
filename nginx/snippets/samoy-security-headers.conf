# Заголовки безопасности для samoy.love.
# Ставится как /etc/nginx/snippets/samoy-security-headers.conf
#
# ВАЖНО: этот сниппет подключается и в server-блоке, и в КАЖДОМ location,
# где есть свой add_header. В nginx add_header не складывается: директивы
# вложенного уровня полностью заменяют набор родительского. Без повторного
# include HTML-ответы уходили бы вообще без CSP, HSTS и X-Frame-Options —
# ровно так и было, пока заголовки стояли только в server.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP. 'unsafe-inline' для script/style обязателен: Astro инлайнит островки
# и scoped-стили прямо в HTML. Всё остальное закрыто: сторонние скрипты,
# фреймы и отправка данных куда-либо невозможны.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
