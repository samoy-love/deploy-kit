<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Вывод команды dk list: таблица из одиннадцати целей выкатки с проектом и файлом описания">
  <title>dk list — цели выкатки</title>
  <desc>Снимок вывода команды dk list: одиннадцать целей выкатки одиннадцати проектов samoy.love, для каждой указан проект и файл описания в .deploy-kit.</desc>

  <rect width="760" height="420" rx="10" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="759" height="419" rx="9.5" fill="none" stroke="#30363d"/>

  <!-- полоса окна терминала -->
  <path d="M0 10a10 10 0 0 1 10-10h740a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="18" r="5" fill="#febc2e"/>
  <circle cx="56" cy="18" r="5" fill="#28c840"/>
  <text x="380" y="22" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">deploy-kit — dk</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <text x="20" y="66"><tspan fill="#3fb950">$</tspan> <tspan fill="#e6edf3">dk list</tspan></text>

    <text x="20" y="96" fill="#58a6ff" font-weight="bold">▸ Цели выкатки</text>

    <text x="20" y="122" fill="#7d8590">  ЦЕЛЬ               ПРОЕКТ                   ОПИСАНИЕ</text>

    <g fill="#e6edf3">
      <text x="20" y="142">  chillhub-admin-ui   chillhub                 .deploy-kit/admin-ui.env</text>
      <text x="20" y="162">  chillhub-admin      chillhub                 .deploy-kit/admin.env</text>
      <text x="20" y="182">  chillhub-api        chillhub                 .deploy-kit/api.env</text>
      <text x="20" y="202">  chillhub-site       chillhub                 .deploy-kit/site.env</text>
      <text x="20" y="222">  metro               metro-map                .deploy-kit/prod.env</text>
      <text x="20" y="242">  samoylove           samoy.love               .deploy-kit/prod.env</text>
      <text x="20" y="262">  snakes              snakes                   .deploy-kit/prod.env</text>
      <text x="20" y="282">  metrics             metrics.samoy.love       .deploy-kit/prod.env</text>
      <text x="20" y="302">  status-agent        status.samoy.love        .deploy-kit/agent.env</text>
      <text x="20" y="322">  samoylove-bot       status.samoy.love        .deploy-kit/bot.env</text>
      <text x="20" y="342">  status-site         status.samoy.love        .deploy-kit/site.env</text>
    </g>

    <text x="20" y="372" fill="#7d8590">Стрелка — цели проекта, в котором вы сейчас.</text>

    <text x="20" y="398"><tspan fill="#3fb950">$</tspan> <tspan fill="#e6edf3">_</tspan></text>
  </g>
</svg>
