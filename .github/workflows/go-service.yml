name: go-service

# Переиспользуемый пайплайн для Go-сервисов с systemd.
#
# Отличия от static-site: кросс-сборка под архитектуру сервера, перезапуск
# юнита вместо reload nginx и версия, вшитая в бинарь через -ldflags.
#
#   jobs:
#     deploy:
#       uses: tr0llex/deploy-kit/.github/workflows/go-service.yml@main
#       with:
#         config: .deploy-kit/prod.env
#         gates: go vet ./... && go test -race ./...
#       secrets: inherit

on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string
      gates:
        description: 'Полный регресс. Красный = выкатки нет'
        required: true
        type: string
      go-version-file:
        required: false
        type: string
        default: go.mod
      workdir:
        description: 'Каталог модуля Go, если он не в корне'
        required: false
        type: string
        default: '.'
      nginx-conf:
        description: 'Конфиг nginx проекта, если его надо обновлять'
        required: false
        type: string
        default: ''
      dry-run:
        required: false
        type: boolean
        default: false
      allow-same-version:
        description: 'Разрешить версию, которая уже на проде (перевыкатка после ручной порчи каталога)'
        required: false
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Саму выкатку пайплайн делает по SSH
# секретами, а не токеном; токену остаются checkout и ОДНА вещь сверх того —
# запись о выкатке (Deployment) против вызвавшего коммита, отсюда
# deployments: write. Блок задан здесь, а не оставлен на настройки
# репозитория-вызывателя: переиспользуемый workflow катит прод во всех проектах
# сразу, и его права не должны зависеть от того, кто именно его позвал.
#
# У этого рассуждения есть честная граница, и проходит она ровно здесь:
# объявленное тут — ПОТОЛОК, а не выдача. Переиспользуемый workflow не может
# держать прав больше, чем дал вызывающий: токен выдаёт вызывающий прогон, и
# этот блок с его блоком пересекается, а не складывается. Значит
# `deployments: write` обязаны объявить ОБЕ стороны — здесь и в каждом
# вызывающем workflow рядом с contents: read, — иначе API отвечает 403.
# Половины приезжают в разном порядке и в разные дни, поэтому шаги записи о
# выкатке 403 переживают и катят дальше: запись — украшение, выкатка — нет.
permissions:
  contents: read
  deployments: write

concurrency:
  # Ключ включает ЦЕЛЬ, а не только репозиторий.
  #
  # При `target=all` четыре задачи одного репозитория попадали в одну группу,
  # а GitHub держит в очереди лишь одну ожидающую — остальные вытесняли друг
  # друга и отменялись. Выкатить всё за один запуск было невозможно: две цели
  # проходили, две гибли. Четыре разные цели — это не гонка двух выкаток, а
  # одна выкатка четырёх вещей.
  #
  # Очерёдность на самом хосте держит flock в release.sh, поэтому параллельные
  # цели одного репозитория безопасны.
  group: deploy-${{ github.repository }}-${{ inputs.config }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Список изменений собирается ОДИН раз и лежит здесь до конца job'а: его
      # пишет шаг «Собрать список изменений», а читает «Отметить версию»
      # (кладёт в version.json). Путь общий, чтобы эти двое не разъехались по
      # опечатке в литерале.
      CHANGELOG_FILE: /tmp/changelog.txt
    steps:
      # Глубина нужна списку изменений в уведомлении: при depth 1 в клоне
      # ровно один коммит, и рассказывать в чате не о чем. 50 — запас на
      # серию пушей между выкатками; история дальше никому здесь не нужна.
      #
      # Теги ТЕПЕРЬ КАЧАЕМ — раньше здесь стояло fetch-tags: false, и это
      # был компромисс не в ту сторону.
      #
      # Причина отказа была настоящей: теги видел шаг «Версия релиза»
      # (git describe --tags --exact-match), и на отмеченном тегом коммите
      # версия получалась вида v1.2.3 вместо release-…. Дальше срабатывала
      # арифметика шлюза: compare_versions в server/lib.sh сравнивает
      # ТОЛЬКО схему со схемой — у v1.2.3 нет даты, у release-2026… нет
      # номера, — отвечает incomparable, и release.sh выходит с GATE_REJECT
      # (код 3). То есть тег ломал выкатку.
      #
      # Но платил за это генератор changelog: без тегов у него навсегда
      # отваливался диапазон «от последнего тега», и Go-сервисы всегда
      # получали запасной вариант «последние 8 коммитов» — то есть «что тут
      # недавно делали» вместо «что вошло в релиз». А static-site при этом
      # качал теги и жил с тем самым кодом 3 как с миной.
      #
      # Развязали причину и следствие: теги нужны ИСТОРИИ, а не ВЕРСИИ.
      # Теги приезжают сюда, а шаг «Версия релиза» их больше не смотрит и
      # всегда выдаёт release-<дата>-<sha> (см. комментарий там). Оба
      # пайплайна теперь настроены одинаково, и разошедшееся поведение
      # двух половин одного deploy-kit закончилось.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
          fetch-tags: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.workdir }}/${{ inputs.go-version-file }}
          cache-dependency-path: ${{ inputs.workdir }}/go.sum

      # Входы приходят в шаг ПЕРЕМЕННЫМИ ОКРУЖЕНИЯ, а не подстановкой ${{ }}
      # в тело скрипта. Разница не косметическая: при подстановке значение
      # становится ЧАСТЬЮ ТЕКСТА скрипта, и строка вида `x"; curl ...; #`
      # выполняется как отдельная команда до всего остального — со всеми
      # секретами job'а под рукой. Через env значение остаётся данными.
      #
      # Сейчас это защита в глубину, а не закрытая дыра: триггеры у вызывающих
      # доверенные (push/теги/dispatch, pull_request_target нигде нет), то есть
      # содержимое входов пишет тот же, кто и так может править этот пайплайн.
      # Но глубина здесь стоит трёх строк.
      - name: Прочитать описание цели
        id: cfg
        env:
          CONFIG: ${{ inputs.config }}
          # Второй, необязательный источник конфига nginx — вход nginx-conf.
          # Нужен ниже проверке пары: с ним NGINX_DEST без NGINX_CONF законен.
          REPO_CONF: ${{ inputs.nginx-conf }}
        run: |
          # Путь обязан быть относительным и не выходить из репозитория:
          # описание цели — файл проекта, а не произвольная точка ФС раннера.
          case "$CONFIG" in
            /*|*..*) echo "::error::config должен быть относительным путём внутри репозитория, получено: $CONFIG"; exit 1 ;;
          esac
          [ -f "$CONFIG" ] || { echo "::error::нет файла $CONFIG"; exit 1; }
          # Значение входа снимается ДО чтения описания. Описание цели — обычный
          # shell-файл проекта: строка REPO_CONF=… в нём переписала бы вход и
          # тихо отключила проверку пары ниже.
          INPUT_NGINX_CONF="$REPO_CONF"
          set -a
          # Путь к описанию цели приходит параметром workflow — проследить его
          # статически нельзя, и это осознанно: файл принадлежит проекту.
          # shellcheck disable=SC1090
          . "./$CONFIG"
          set +a
          for v in APP ARTIFACT_DIR ROOT; do
            [ -n "${!v}" ] || { echo "::error::в описании не задано $v"; exit 1; }
          done
          # Конфиг nginx описывается парой: что ставить и куда. Одна половина
          # без другой — это не «частично настроено», а молча пропущенный шаг:
          # ровно так NGINX_DEST у целей и простоял, ничего не применяя.
          if [ -n "${NGINX_CONF:-}" ]; then
            case "$NGINX_CONF" in
              /*|*..*) echo "::error::NGINX_CONF должен быть относительным путём внутри deploy-kit, получено: $NGINX_CONF"; exit 1 ;;
            esac
            [ -n "${NGINX_DEST:-}" ] || { echo "::error::задан NGINX_CONF, но нет NGINX_DEST — некуда ставить конфиг"; exit 1; }
          fi
          # Обратная половина той же пары — и она важнее прямой. NGINX_CONF без
          # NGINX_DEST падал здесь всегда, а NGINX_DEST без NGINX_CONF пайплайн
          # принимал МОЛЧА: шаги «Взять конфиг nginx», «Проверить конфиг nginx»
          # и «Обновить конфиг nginx» просто не выполнялись, и прогон
          # заканчивался зелёным. Ровно так шесть конфигов из nginx/sites/
          # годами лежали невыложенными: правку вносили, прогон был зелёный, на
          # сервере не менялось ничего — и заметить это было неоткуда.
          # Односторонняя проверка сама прятала тот дефект, который была
          # обязана называть.
          #
          # Сообщение называет ПОСЛЕДСТВИЕ, а не отсутствующую переменную:
          # «нет NGINX_CONF» читается как «чего-то недонастроили», а вся цена
          # ошибки в том, что выкатка выглядит удачной. Смысл проверки —
          # прекратить молчаливый пропуск, значит и говорить она должна о нём.
          #
          # Вход nginx-conf — законное исключение: конфиг тогда лежит в
          # репозитории проекта, NGINX_CONF пуст, а шаги отрабатывают. Ошибка
          # только там, где везти нечего НИ ОДНИМ из двух путей.
          #
          # Проверка дословно та же, что в static-site.yml, и правится вместе
          # с ней: у Go-сервиса своя половина шагов nginx появилась позже, и
          # разошедшиеся проверки одной пары — это снова разное поведение двух
          # половин одного deploy-kit.
          if [ -n "${NGINX_DEST:-}" ] && [ -z "${NGINX_CONF:-}" ] && [ -z "$INPUT_NGINX_CONF" ]; then
            echo "::error::задан NGINX_DEST, но нет NGINX_CONF — везти нечего, все шаги nginx будут пропущены: выкатка будет зелёной, а конфиг не поедет. Задайте NGINX_CONF (путь внутри deploy-kit) либо уберите NGINX_DEST"
            exit 1
          fi
          {
            echo "app=$APP"
            echo "artifact_dir=$ARTIFACT_DIR"
            echo "root=$ROOT"
            echo "owner=${OWNER:-}"
            echo "unit=${UNIT:-}"
            echo "health=${HEALTH:-}"
            echo "notify=${NOTIFY:-all}"
            echo "version_url=${VERSION_URL:-}"
            echo "changelog_paths=${CHANGELOG_PATHS:-}"
            echo "neighbours=${NEIGHBOURS:-}"
            echo "goarch=${GOARCH:-arm64}"
            echo "nginx_conf=${NGINX_CONF:-}"
            echo "nginx_dest=${NGINX_DEST:-}"
            # NGINX_RELOAD, в отличие от static-site, отсюда не уезжает: там он
            # просит release.sh перезагрузить nginx после переключения симлинка,
            # потому что раздаёт каталог сам nginx. Здесь после переключения
            # перезапускается юнит, а nginx свой reload получает раньше и от
            # другого — от nginx-apply.sh, вместе с проверкой и откатом.
            echo "write_version_file=${WRITE_VERSION_FILE:-1}"
          } >> "$GITHUB_OUTPUT"
          # BUILD_CMD через outputs НЕ передаём: внутри него есть свои кавычки
          # (-ldflags "-s -w -X ..."), и любая повторная подстановка рвёт
          # строку. Шаг сборки читает описание сам.

      - name: Версия релиза
        id: ver
        run: |
          # Префикс release- отличает выкатку из пайплайна от ручной (manual-).
          #
          # Тег здесь БОЛЬШЕ НЕ СПРАШИВАЕМ, хотя теги в клоне теперь есть.
          # Раньше стояло `git describe --tags --exact-match`, и на коммите
          # с тегом версия становилась v1.2.3. Прод при этом живёт в схеме
          # release-<дата>-<sha>, а compare_versions сравнивает схему только
          # сама с собой: смесь даёт incomparable, шлюз отвечает кодом 3 и
          # выкатки нет. Тег на коммите — обычное дело, ронять из-за него
          # прод нельзя, а никакой информации версия из тега не добавляет:
          # сам тег достаётся из commit, который лежит рядом в version.json.
          #
          # Теги остаются в клоне ради генератора списка изменений — ему
          # они дают диапазон «от последнего тега» вместо «последние
          # 8 коммитов». Цена решения честная: имя релиза на сервере теперь
          # никогда не совпадает с именем тега, зато схема версий на проде
          # ровно одна и монотонна по времени.
          V="release-$(TZ=Europe/Moscow date '+%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

      # Запись о выкатке средствами самого GitHub: Deployment против ТОГО
      # коммита, который выкатку вызвал. Связь «коммит → выкатка» до сих пор
      # существовала только внутри релиза — в имени release-<дата>-<sha> и в
      # поле commit файла version.json, — то есть чтобы её увидеть, надо было
      # заранее знать, куда смотреть. Deployment виден там, куда смотрят и
      # так: строкой на самом коммите и в панели Environments репозитория.
      #
      # ОКРУЖЕНИЕ — ЭТО ЦЕЛЬ, А НЕ РЕПОЗИТОРИЙ: берём APP из описания цели.
      # В хозяйстве есть репозиторий с четырьмя целями; назови окружение
      # именем репозитория — и в панели окажется одно окружение, в которое по
      # очереди «выкатываются» четыре разных вещи, и история каждой затирает
      # остальные три. APP — то же имя, под которым цель живёт на сервере, в
      # юните и в сообщении о релизе, и связь читается без словаря.
      #
      # Шаг стоит не первым в job'е, а сразу за чтением описания и версией:
      # раньше просто неоткуда взять ни имя окружения, ни описание записи.
      # Зато ДО регресса — красный гейт это тоже исход выкатки, и запись
      # обязана о нём рассказать, а не появиться только у удачных прогонов.
      #
      # При dry-run записи нет вовсе: прод не тронут, а «выкачено» на коммите
      # и в панели Environments после проверочного прогона — прямая ложь.
      #
      # ЗАПИСЬ — УКРАШЕНИЕ ПОВЕРХ ВЫКАТКИ, ровно как список изменений, и
      # правило у неё то же: ни один её отказ не имеет права ни уронить job,
      # ни остановить выкатку. Отсюда continue-on-error, exit 0 на всех путях
      # и ::warning:: вместо ::error::. Отдельной веткой разобран 403: право
      # deployments: write обязаны дать обе стороны (см. комментарий у
      # permissions), а вызывающие обновляются не одним коммитом с этим
      # файлом. Пропавшая запись — потеря косметическая, упавшая выкатка нет.
      - name: Завести запись о выкатке
        id: deployment
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/deployments
          ENVIRONMENT: ${{ steps.cfg.outputs.app }}
          VERSION: ${{ steps.ver.outputs.version }}
          # Коммит вызывающего: в переиспользуемом workflow github.sha — это
          # ревизия того репозитория, который его позвал, и ровно её же выше
          # выложил checkout. Записывать надо её, а не HEAD deploy-kit.
          SHA: ${{ github.sha }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::нет jq — запись о выкатке не заводится, выкатка идёт дальше"
            exit 0
          fi
          # required_contexts: [] обязательно. По умолчанию GitHub ждёт на
          # коммите зелёных commit statuses и на их отсутствие отвечает 409 —
          # запись не появилась бы никогда. Проверка здесь одна и она ниже:
          # шаг «Полный регресс», а не статусы на коммите.
          #
          # auto_merge: false — иначе API вместо записи может завести мерж
          # базовой ветки. Выкатка катит ровно то, что проверено, и ничего
          # не мержит сама.
          PAYLOAD="$(jq -n --arg ref "$SHA" --arg env "$ENVIRONMENT" --arg desc "$VERSION" \
            '{ref:$ref,environment:$env,description:$desc,auto_merge:false,required_contexts:[]}')"
          BODY="$(mktemp)"
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "$API" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD")" || CODE=000
          case "$CODE" in
            201)
              ID="$(jq -r '.id // empty' "$BODY")"
              if [ -n "$ID" ]; then
                echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"
                echo "Запись о выкатке #$ID: окружение $ENVIRONMENT, коммит $SHA"
              else
                echo "::warning::GitHub завёл запись о выкатке, но не вернул её номер — исход отмечать будет нечем"
              fi
              ;;
            403|404)
              echo "::warning::нет права deployments: write (ответ $CODE) — записи о выкатке не будет. Вызывающий workflow должен объявить permissions: deployments: write рядом с contents: read. На саму выкатку это не влияет"
              ;;
            *)
              echo "::warning::GitHub не завёл запись о выкатке (ответ $CODE) — выкатка идёт дальше"
              ;;
          esac
          exit 0

      # SSH НАСТРАИВАЕТСЯ ЗДЕСЬ, А НЕ ПЕРЕД САМОЙ ВЫКАТКОЙ, и переехал он сюда
      # вместе с событиями выкатки. Шаг «Событие — выкатка началась» уходит на
      # тот же хост тем же ключом, и уйти он обязан ДО регресса: событие
      # `started` кормит детектор аномалий («началась и не кончилась») и
      # заводит карточку прогона в чате, в которую потом дописываются исходы
      # целей. Оставь настройку на прежнем месте — и провал на гейтах, ради
      # которого всё затевалось, приходил бы в чат первым сообщением группы,
      # а «выкатка началась» не приходило бы никогда.
      #
      # Шаг только пишет два файла из секретов, поэтому ранний запуск ничего не
      # меняет ни для одного соседа. Ключ убирается шагом «Убрать ключ» под
      # always() — как и раньше.
      - name: Настроить SSH
        id: ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOST_KEY не задан"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      # Событие «выкатка началась». В чат само по себе не идёт (docs/events.md,
      # §4) — оно заводит карточку прогона и даёт детектору аномалий точку
      # отсчёта. Недоставленное `started` выкатку не роняет: это решение принято
      # внутри действия и там же объяснено.
      #
      # Список изменений едет только с исходом: на `started` его ещё нет —
      # диапазон считается позже, уже зная, что реально стоит на проде.
      # Генератор отдаёт готовый HTML, действие пробрасывает ФАЙЛ, а к тексту
      # его приводит lib/notify.sh — единственный нормализатор на всю цепочку.
      - name: Событие — выкатка началась
        if: ${{ !inputs.dry-run && steps.cfg.outputs.app != '' }}
        uses: tr0llex/deploy-kit/.github/actions/notify@main
        with:
          app: ${{ steps.cfg.outputs.app }}
          kind: started
          notify: ${{ steps.cfg.outputs.notify }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}

      # Регресс идёт под архитектурой раннера — тесты должны выполняться,
      # а не кросс-компилироваться. Гонки ищутся именно здесь: -race не
      # работает при кросс-сборке.
      #
      # gates тоже приходит переменной окружения и выполняется через eval:
      # выполнить эту строку — и есть смысл шага, но текстом скрипта она при
      # этом не становится (см. пояснение у шага «Прочитать описание цели»).
      - name: Полный регресс
        id: gates
        working-directory: ${{ inputs.workdir }}
        env:
          GATES: ${{ inputs.gates }}
        run: eval "$GATES"

      # Ранняя проверка конфига: тот же конфиг на сервере ещё раз проходит
      # nginx-apply.sh, который сверяет версию nginx, запускает nginx -t и
      # откатывается при провале. Здесь это делается до того, как выкатка
      # что-либо тронет.
      #
      # Недоступность скрипта — это отказ, а не пропуск: проверку, которую
      # нельзя выполнить, нельзя и считать пройденной.
      #
      # Откуда берётся конфиг сайта.
      #
      # Основной путь — NGINX_CONF в описании цели: путь ВНУТРИ deploy-kit,
      # откуда файл и скачивается. Так конфигурация nginx остаётся в одном
      # репозитории, как и задумано, а проекту не нужна её копия у себя.
      #
      # Вход nginx-conf оставлен для целей, которые всё же держат конфиг у себя
      # (путь тогда считается от корня репозитория проекта). Если заданы оба,
      # выигрывает описание цели: оно ближе к выкатке и читается обоими путями,
      # локальным и этим.
      #
      # Все три шага — ровно те же, что в static-site.yml, и правятся вместе с
      # ними. Go-сервису они нужны по той же причине: у него бывает свой домен,
      # который nginx проксирует на юнит, и до сих пор этот конфиг не возил ни
      # один путь выкатки, кроме локального dk deploy.
      - name: Взять конфиг nginx
        id: nginxsrc
        if: steps.cfg.outputs.nginx_conf != '' || inputs.nginx-conf != ''
        env:
          KIT_CONF: ${{ steps.cfg.outputs.nginx_conf }}
          REPO_CONF: ${{ inputs.nginx-conf }}
          # РЕВИЗИЯ deploy-kit — ТА ЖЕ, ЧТО У ЭТОГО WORKFLOW, А НЕ ВЕРШИНА main.
          #
          # Проекты зовут пайплайн как @main, и это решение (см. комментарий у
          # `uses:` в вызывающих): правки общего кита обязаны доезжать сразу и
          # везде. Ревизия при этом разрешается ОДИН РАЗ, на старте job'а, —
          # а curl уходит минутами позже и брал вершину main НА МОМЕНТ ШАГА.
          # Мерж, попавший в этот промежуток, разводил половины одного коммита:
          # workflow одной ревизии, скачанный им скрипт — другой.
          #
          # Ровно об этом предупреждает .github/actions/notify: «разъехавшиеся
          # половины одного коммита нам уже стоили одного разбирательства».
          # Там это решили тем, что файл едет вместе с действием; здесь —
          # github.job_workflow_sha, то есть коммит ЭТОГО файла. Пиннинг
          # проектов при этом не нужен: они по-прежнему на @main и получают
          # правки следующим же прогоном.
          KIT_REF: ${{ github.job_workflow_sha }}
        run: |
          if [ -n "$KIT_CONF" ]; then
            [ -n "$REPO_CONF" ] && echo "::warning::заданы и NGINX_CONF, и вход nginx-conf — беру NGINX_CONF ($KIT_CONF)"
            # Ссылка на main — тем же способом, что и ci/nginx-check.sh ниже:
            # reusable workflow вызывают как @main, и конфиг обязан приехать из
            # той же точки, что и проверяющий его скрипт.
            curl -fsSL "https://raw.githubusercontent.com/tr0llex/deploy-kit/${KIT_REF:-main}/$KIT_CONF" -o /tmp/site.conf \
              || { echo "::error::не удалось скачать $KIT_CONF из deploy-kit"; exit 1; }
            # Пустой файл curl считает успехом, а nginx — валидным конфигом:
            # выкатка бы прошла зелёной и оставила сайт без единого location.
            [ -s /tmp/site.conf ] || { echo "::error::$KIT_CONF скачался пустым"; exit 1; }
          else
            case "$REPO_CONF" in
              /*|*..*) echo "::error::nginx-conf должен быть относительным путём внутри репозитория, получено: $REPO_CONF"; exit 1 ;;
            esac
            [ -f "$REPO_CONF" ] || { echo "::error::нет файла $REPO_CONF"; exit 1; }
            cp "$REPO_CONF" /tmp/site.conf
          fi
          echo "path=/tmp/site.conf" >> "$GITHUB_OUTPUT"
          echo "Конфиг nginx: ${KIT_CONF:-$REPO_CONF}"

      - name: Проверить конфиг nginx
        id: nginxcheck
        if: steps.nginxsrc.outputs.path != ''
        env:
          # РЕВИЗИЯ deploy-kit — ТА ЖЕ, ЧТО У ЭТОГО WORKFLOW, А НЕ ВЕРШИНА main.
          #
          # Проекты зовут пайплайн как @main, и это решение (см. комментарий у
          # `uses:` в вызывающих): правки общего кита обязаны доезжать сразу и
          # везде. Ревизия при этом разрешается ОДИН РАЗ, на старте job'а, —
          # а curl уходит минутами позже и брал вершину main НА МОМЕНТ ШАГА.
          # Мерж, попавший в этот промежуток, разводил половины одного коммита:
          # workflow одной ревизии, скачанный им скрипт — другой.
          #
          # Ровно об этом предупреждает .github/actions/notify: «разъехавшиеся
          # половины одного коммита нам уже стоили одного разбирательства».
          # Там это решили тем, что файл едет вместе с действием; здесь —
          # github.job_workflow_sha, то есть коммит ЭТОГО файла. Пиннинг
          # проектов при этом не нужен: они по-прежнему на @main и получают
          # правки следующим же прогоном.
          KIT_REF: ${{ github.job_workflow_sha }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/tr0llex/deploy-kit/${KIT_REF:-main}/ci/nginx-check.sh" -o /tmp/nginx-check.sh \
            || { echo "::error::не удалось скачать ci/nginx-check.sh — ранняя проверка конфига невозможна"; exit 1; }
          bash /tmp/nginx-check.sh "${{ steps.nginxsrc.outputs.path }}"

      - name: Собрать артефакт
        id: build
        env:
          DEPLOY_VERSION: ${{ steps.ver.outputs.version }}
          DEPLOY_GOARCH: ${{ steps.cfg.outputs.goarch }}
          CONFIG: ${{ inputs.config }}
        run: |
          # Описание читаем здесь же и выполняем команду как есть — так строка
          # доезжает до shell в точности такой, какой её написали в проекте.
          set -a
          # Путь — через env, а не подстановкой: см. шаг «Прочитать описание цели».
          # shellcheck disable=SC1090
          . "$GITHUB_WORKSPACE/$CONFIG"
          set +a
          eval "$BUILD_CMD"

          D="${{ steps.cfg.outputs.artifact_dir }}"
          [ -d "$D" ] || { echo "::error::сборка не создала $D"; exit 1; }
          # Пустой каталог — тоже провал. Без этой проверки на сервер уезжал
          # артефакт без бинаря, systemd падал с 203/EXEC, и выкатка
          # откатывалась — верно, но причина пряталась в конце цепочки.
          [ -n "$(ls -A "$D")" ] || { echo "::error::каталог $D пуст — сборка ничего не создала"; exit 1; }
          echo "Собрано:"; ls -la "$D"

      # Список изменений собирается ЗДЕСЬ, а не в шаге уведомления, хотя
      # нужен обоим. Порядок шагов выбора не оставляет: version.json пишется
      # до упаковки артефакта, а уведомление уходит после выкатки — значит
      # шаг уведомления физически не может отдать свой вывод в файл, который
      # к тому моменту уже лежит на сервере. Поэтому генератор зовётся один
      # раз тут, а оба потребителя читают готовый файл. Выгода не только в
      # одном скачивании: в чат и в version.json уезжает ГАРАНТИРОВАННО один
      # и тот же текст, а не два независимо посчитанных списка одного релиза.
      #
      # Шаг не имеет права уронить выкатку ничем: список изменений —
      # украшение поверх релиза. Отсюда и пустой файл заранее, и warning
      # вместо error на каждой неудаче, и continue-on-error сверху как
      # последняя страховка от того, чего мы не предусмотрели.
      - name: Собрать список изменений
        continue-on-error: true
        env:
          # РЕВИЗИЯ deploy-kit — ТА ЖЕ, ЧТО У ЭТОГО WORKFLOW, А НЕ ВЕРШИНА main.
          #
          # Проекты зовут пайплайн как @main, и это решение (см. комментарий у
          # `uses:` в вызывающих): правки общего кита обязаны доезжать сразу и
          # везде. Ревизия при этом разрешается ОДИН РАЗ, на старте job'а, —
          # а curl уходит минутами позже и брал вершину main НА МОМЕНТ ШАГА.
          # Мерж, попавший в этот промежуток, разводил половины одного коммита:
          # workflow одной ревизии, скачанный им скрипт — другой.
          #
          # Ровно об этом предупреждает .github/actions/notify: «разъехавшиеся
          # половины одного коммита нам уже стоили одного разбирательства».
          # Там это решили тем, что файл едет вместе с действием; здесь —
          # github.job_workflow_sha, то есть коммит ЭТОГО файла. Пиннинг
          # проектов при этом не нужен: они по-прежнему на @main и получают
          # правки следующим же прогоном.
          KIT_REF: ${{ github.job_workflow_sha }}
          # ЗАПАСНОЕ начало диапазона, а больше не основное. На push это
          # предыдущий HEAD ветки; на теге и dispatch выражение даёт пустую
          # строку, на первом пуше — нули. И то и другое генератор считает «не
          # задано» и сам выбирает запасной диапазон.
          BEFORE: ${{ github.event.before }}
          # ОСНОВНОЙ источник начала диапазона: version.json цели, то есть то,
          # что СЕЙЧАС работает на проде. Почему он важнее диапазона пуша —
          # в комментарии у самого шага.
          PROD_VERSION_URL: ${{ steps.cfg.outputs.version_url }}
          # Запасной источник живого релиза — симлинк current на хосте, см. ниже.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ steps.cfg.outputs.root }}
          # База ссылок на номер PR. Слияние в хозяйстве всегда сквошем, и
          # GitHub дописывает к теме хвост «(#21)»; генератор его срезает —
          # в чате голый номер никуда не ведёт и занимает место. С --link-base
          # номер возвращается в строку, но уже ССЫЛКОЙ:
          # «• Завести dependabot одинаково во всех репозиториях <a …>#21</a>».
          # Скобок вокруг ссылки НЕТ: генератор снимает их вместе с хвостом, и
          # видимая часть строки — ровно «#21», четыре знака вместо шести.
          # Строка не потолстела, а из чата стало можно уйти в сам PR.
          #
          # Берётся из github.repository, а не из `git remote get-url origin`:
          # это каноническое имя выкатываемого репозитория, и разбирать ssh- и
          # https-формы remote'а здесь не нужно вовсе. server_url, а не литерал
          # https://github.com — на GHES хост другой, а неверная ссылка хуже
          # отсутствующей: она молча ведёт в никуда.
          #
          # /pull/N безопасно и тогда, когда номер оказался issue: GitHub
          # переадресует /pull/N ↔ /issues/N в обе стороны.
          LINK_BASE: ${{ github.server_url }}/${{ github.repository }}
          # ЧТО ВЕЗЁТ ЦЕЛЬ. Список изменений считается по истории репозитория,
          # а цель собирает артефакт из своего куска дерева. В монорепозитории
          # это расходится: 22.08 карточка chillhub-site перечислила восемь PR
          # при одном настоящем — остальные семь были про лаунчер, админку и
          # установщик, потому что сайт не выкатывался с 16.08 и диапазон
          # «прод → HEAD» накрыл шесть дней чужой работы.
          #
          # Пусто — прежнее поведение: вся история репозитория. Заполняет цель
          # у себя (CHANGELOG_PATHS), потому что раскладку своего дерева знает
          # только она.
          TARGET_PATHS: ${{ steps.cfg.outputs.changelog_paths }}
        run: |
          # Файл существует ВСЕГДА, пусть и пустой: читающие шаги смотрят
          # только на его содержимое и не должны знать, дошло ли тут дело
          # до генератора вообще.
          : > "$CHANGELOG_FILE"
          # Куда генератор запишет, ОТ ЧЕГО он считал диапазон. Читается ниже,
          # в этом же шаге: без этой строки «посчитано от прода» и «посчитано
          # запасным путём» в логе не отличить.
          RANGE_FILE=/tmp/changelog-range.txt
          : > "$RANGE_FILE"

          # ТОЧКА ОТСЧЁТА — ЖИВОЙ ПРОД, А НЕ github.event.before.
          #
          # Диапазон пуша годится ровно до первого пропущенного прогона, а
          # пропускаются они регулярно и не по нашей воле: GitHub держит в
          # очереди на группу concurrency ОДНУ ожидающую задачу (см. комментарий
          # у concurrency выше). Катится A, ждёт B, приходит C — B отменяется, и
          # cancel-in-progress: false тут ничего не решает. Выкатки B нет, а
          # следующий релиз считает свой отрезок «от C», то есть коммиты B не
          # объявит НИКОГДА: они не попадут ни в чат, ни в version.json.
          #
          # От прода такого не бывает по построению. version.json отдаёт поле
          # commit — короткий sha ТОГО релиза, который сейчас работает; диапазон
          # «прод → HEAD» покрывает и наши коммиты, и коммиты пропущенного
          # прогона, сколько бы их ни накопилось. Отсчёт самовосстанавливающийся,
          # а не однократный.
          #
          # Читается commit, а не version: версия — это release-<дата>-<sha>, и
          # sha в ней короткий и хвостовой. Генератор его достать умеет, но
          # commit — прямое поле, ровно его читает и агент статус-страницы
          # (status.samoy.love, buildInfo). version остаётся вторым заходом: у
          # релизов, выложенных до появления поля, есть только она.
          #
          # ГЛУБИНА КЛОНА. checkout выше берёт 50 коммитов, и коммит прода
          # может лежать глубже — залежавшийся релиз, серия пушей, откат.
          # Поэтому генератору передаётся --deepen: не найдя ревизию, он сам
          # доуглубляет клон (git fetch --deepen, затем --unshallow) и только
          # потом сдаётся. fetch-depth: 0 закрыл бы это же, но платил бы полной
          # историей на КАЖДОМ прогоне ради редкого случая.
          LIVE=""
          if [ -n "${PROD_VERSION_URL:-}" ]; then
            VJ="$(curl -fsS --max-time 10 "$PROD_VERSION_URL" 2>/dev/null | tr ',' '\n')"
            LIVE="$(printf '%s\n' "$VJ" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
            [ -n "$LIVE" ] || LIVE="$(printf '%s\n' "$VJ" \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
          fi
          # ВТОРОЙ ИСТОЧНИК — СИМЛИНК РЕЛИЗА НА ХОСТЕ. У цели без VERSION_URL
          # (WRITE_VERSION_FILE=0: бот, агент, мониторинг, админка) прод по HTTP
          # не отвечает — но что на нём стоит, знает сам хост: current ->
          # releases/release-<дата>-<sha>, и генератор достаёт sha из такого
          # имени сам (resolve_rev в bin/changelog). SSH к этому шагу уже
          # настроен. Раньше такие цели ВСЕГДА считали список от диапазона пуша
          # и на каждой выкатке предупреждали об этом — при том, что ответ лежал
          # в одном readlink от них. Ошибка ssh — не провал: остаёмся на прежнем
          # пути и говорим об этом ниже.
          if [ -z "$LIVE" ] && [ -n "${DEPLOY_HOST:-}" ] && [ -f ~/.ssh/deploy_key ]; then
            LIVE="$(timeout 20 ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST"                       "readlink -f '$DEPLOY_ROOT/current' 2>/dev/null" 2>/dev/null | xargs -r basename 2>/dev/null || true)"
            case "$LIVE" in
              release-*|manual-*) echo "живой релиз прочитан с хоста: $LIVE (симлинк current)" ;;
              *) LIVE="" ;;
            esac
          fi
          if [ -n "$LIVE" ]; then
            echo "на проде сейчас: $LIVE"
          else
            # Молчать нельзя: дальше работает прежний отсчёт от диапазона пуша,
            # а он теряет коммиты отменённых прогонов. У Go-сервисов с
            # WRITE_VERSION_FILE=0 это норма, но норма с известной ценой — и
            # цена обязана быть видна в логе, а не только в этом комментарии.
            echo "::warning::прод не сказал, что на нём стоит (нет VERSION_URL или прод недоступен, и симлинк current на хосте не прочитался) — список изменений считается от диапазона пуша: коммиты прогона, отменённого очередью concurrency, в ленту не попадут"
          fi
          if ! curl -fsSL "https://raw.githubusercontent.com/tr0llex/deploy-kit/${KIT_REF:-main}/bin/changelog" -o /tmp/changelog; then
            echo "::warning::bin/changelog не скачался — релиз уедет без списка изменений"
            exit 0
          fi
          # Запускаем через bash: в индексе файл лежит без бита +x
          # (core.filemode=false), на раннере он неисполняемый.
          #
          # timeout — не паранойя и не про сегодняшний код генератора.
          # Скачивается он с main, а не берётся из проверенного здесь клона:
          # какая ревизия приедет, решает состояние main в момент прогона, и
          # закрепить её тут нечем. Вечный цикл в разборе аргументов там уже
          # был однажды — шаг висел до таймаута job'а. Починка в bin/changelog
          # эту конкретную дыру закрыла, но условие «украшение поверх выкатки
          # не может стать её потолком по времени» должно держаться здесь, на
          # стороне вызывающего, и при любой ревизии генератора.
          #
          # stderr не глушим — там ровно одна строка о выбранном диапазоне,
          # и лог шага единственное место, где её потом ищут.
          #
          # --all — режим БЕЗ ПОТОЛКА: в файл уезжает ВЕСЬ список релиза, а не
          # первые восемь пунктов. Обрезка именно здесь необратима: этот файл
          # дословно ложится в version.json, а бот и статус-страница читают
          # готовое поле changelog и физически не могут показать то, чего в
          # файле нет. Отсюда же исчезает хвост «…и ещё 1 коммит» — строка,
          # которая занимает место и не говорит, КАКОЙ коммит.
          #
          # Лимит Telegram этим не нарушается: укладывать сообщение в 4096
          # единиц UTF-16 — забота бота, единственного, кто теперь говорит в
          # чат. Пайплайну достаточно не терять пункты.
          #
          # Оба новых аргумента понимает генератор из ТОГО ЖЕ main, откуда
          # приезжает и этот workflow: они едут одним коммитом. Разъедутся —
          # генератор ответит на неизвестный аргумент пустым stdout и кодом 0,
          # то есть релиз уедет без списка, но уедет.
          #
          # Сторож поднят с 60 до 180 секунд: с --deepen генератор может сходить
          # в сеть за историей (сам он держит по 60 секунд на каждый из двух
          # fetch'ей). Прежние 60 обрывали бы ровно тот случай, ради которого
          # доуглубление и заведено, — и обрывали бы молча, пустым списком.
          #
          # ВЫЗОВ ДЕРЖИМ РОВНО В ДВУХ СТРОКАХ. Стык «чем зовут генератор»
          # проверяет ci/contract-test.sh, и вырезает он вызов через
          # `grep -A1 -F 'bash /tmp/changelog'` — то есть видит строку с
          # командой и ОДНУ следующую. Разбей флаги на три строки, и часть их
          # молча выпадет из проверки: неизвестный генератору флаг снова уедет
          # в прод, а стык останется зелёным.
          if ! DK_CHANGELOG_STATUS_FILE="$RANGE_FILE" timeout 180 bash /tmp/changelog \
                 --repo "$GITHUB_WORKSPACE" --live "$LIVE" --since "${BEFORE:-}" --deepen --link-base "$LINK_BASE" --paths "${TARGET_PATHS:-}" --all > "$CHANGELOG_FILE"; then
            echo "::warning::генератор списка изменений не отработал — релиз уедет без него"
            : > "$CHANGELOG_FILE"
          fi

          # ОТ ЧЕГО ПОСЧИТАЛОСЬ НА САМОМ ДЕЛЕ. Живой коммит прода мог быть
          # известен и всё равно не подойти: форс-пуш, чужая ветка, недостижимый
          # объект после доуглубления. Тогда генератор откатывается на диапазон
          # пуша — и это ровно та деградация, о которой нельзя молчать: список
          # уедет непустым и внешне правильным, а коммитов отменённого прогона в
          # нём не будет. Строку range= пишет сам генератор; здесь она только
          # превращается в предупреждение прогона.
          #
          # Если LIVE пуст, предупреждение уже сказано выше — второй раз о том же
          # не говорим.
          RANGE_KIND="$(sed -n 's/^range=//p' "$RANGE_FILE" 2>/dev/null | head -1)"
          if [ -n "$LIVE" ] && [ "$RANGE_KIND" != live ]; then
            echo "::warning::список изменений посчитан не от живого прода, а запасным путём (${RANGE_KIND:-неизвестно}): коммита $LIVE в клоне нет даже после доуглубления. Коммиты прогона, отменённого очередью concurrency, в ленту не попадут"
          fi

      # Цель с WRITE_VERSION_FILE=0 version.json не раздаёт — класть его в
      # артефакт нечестно: шлюз бы сверял файл, до которого снаружи не дойти.
      - name: Отметить версию
        id: verfile
        if: steps.cfg.outputs.write_version_file != '0'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARTIFACT_DIR: ${{ steps.cfg.outputs.artifact_dir }}
        run: |
          # Кладём в public/, если он есть: тогда версия доступна по /version.json
          # тем же способом, что и у статики, и её сверяет шаг проверки.
          T="$ARTIFACT_DIR/public"; [ -d "$T" ] || T="$ARTIFACT_DIR"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT="$(TZ=Europe/Moscow date '+%Y-%m-%dT%H:%M:%S+03:00')"

          # Необязательный ключ changelog — ВЕРБАТИМНЫЙ stdout генератора одной
          # строкой JSON. Его читает агент статус-страницы: до этого поля он
          # умел, а писать его не умел никто, и половина бота была недостижима.
          #
          # СОБИРАЕТ ФАЙЛ jq, А НЕ printf, и это не вкусовщина. Темы коммитов
          # пишет кто угодно с правом на пуш: в них есть кавычки, обратные
          # слэши и — главное — настоящие переводы строк, которые генератор
          # честно ставит между пунктами. Наивный printf '…"changelog":"%s"…'
          # на таком вводе даёт файл, который отвергает ЛЮБОЙ разбирающий JSON
          # («control characters from U+0000 through U+001F must be escaped»),
          # то есть version.json перестаёт читаться целиком — вместе с полями
          # version и commit, по которым выкатка себя проверяет. Ради
          # украшения потерять проверку релиза нельзя.
          #
          # Вывод оставляем МНОГОСТРОЧНЫМ (jq так и печатает по умолчанию):
          # версию из файла читают три разных места (check_version и
          # current_live_version в server/lib.sh, таблица в bin/dk) — все три
          # построчным sed'ом с `head -1`. Ключ version стоит первым, значит
          # первая подходящая строка всегда настоящая версия.
          #
          # Пустой вывод генератора = ключа нет вовсе, ровно как в договоре.
          OK=0
          if command -v jq >/dev/null 2>&1; then
            if [ -s "$CHANGELOG_FILE" ]; then
              if jq -n --arg version "$VERSION" --arg commit "$COMMIT" --arg builtAt "$BUILT_AT" \
                      --rawfile changelog "$CHANGELOG_FILE" \
                      '{version:$version,commit:$commit,builtAt:$builtAt,changelog:$changelog}' \
                      > "$T/version.json"; then OK=1; fi
            else
              if jq -n --arg version "$VERSION" --arg commit "$COMMIT" --arg builtAt "$BUILT_AT" \
                      '{version:$version,commit:$commit,builtAt:$builtAt}' \
                      > "$T/version.json"; then OK=1; fi
            fi
          fi
          # Страховка: нет jq или он почему-то не отработал — пишем ровно тот
          # файл, что писали всегда. Версия обязана уехать при любом раскладе,
          # список изменений — нет.
          if [ "$OK" != 1 ]; then
            echo "::warning::jq недоступен или не собрал version.json — пишу файл без списка изменений"
            printf '{"version":"%s","commit":"%s","builtAt":"%s"}\n' \
              "$VERSION" "$COMMIT" "$BUILT_AT" > "$T/version.json"
          fi
          cat "$T/version.json"

      - name: Упаковать
        id: pack
        run: |
          tar -czf /tmp/artifact.tar.gz -C "${{ steps.cfg.outputs.artifact_dir }}" .
          echo "Размер: $(du -h /tmp/artifact.tar.gz | cut -f1)"
          sha256sum /tmp/artifact.tar.gz

      - name: Предусловия на хосте
        id: hostpre
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP: ${{ steps.cfg.outputs.app }}
          ROOT: ${{ steps.cfg.outputs.root }}
          UNIT: ${{ steps.cfg.outputs.unit }}
        run: |
          # ЗНАЧЕНИЯ ОПИСАНИЯ ЦЕЛИ ЕДУТ ЧЕРЕЗ env И printf %q, А НЕ
          # ПОДСТАНОВКОЙ ВЫРАЖЕНИЯ В РУЧНЫХ АПОСТРОФАХ.
          #
          # Значение приезжает из .deploy-kit/*.env репозитория проекта и
          # становилось ЧАСТЬЮ ТЕКСТА команды, которую выполняет удалённый
          # шелл под sudo. Одного апострофа в APP, ROOT или UNIT хватало,
          # чтобы разорвать кавычки и получить вторую команду под учёткой с
          # NOPASSWD на скрипты выкатки. bin/deploy эту дыру у себя закрыл
          # давно, переиспользуемый workflow тогда не поправили.
          ARGS=(--app "$APP" --root "$ROOT")
          [ -n "$UNIT" ] && ARGS+=(--units "$UNIT")
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "sudo /opt/deploy-kit/preflight.sh $(printf '%q ' "${ARGS[@]}")"

      # ИМЯ НА СЕРВЕРЕ — УНИКАЛЬНОЕ, А НЕ /tmp/site.conf.
      #
      # Здесь стоял путь, ОДИН И ТОТ ЖЕ для всех проектов. Пока цели катились
      # по одной, это работало. Мерж нескольких PR подряд запускает выкатки
      # параллельно — и они начинают писать в один файл: проект A заливает
      # свой конфиг, проект B перезаписывает его своим, после чего A просит
      # применить «/tmp/site.conf» под ИМЕНЕМ СВОЕГО сайта. В
      # /etc/nginx/sites-available/samoy.love.conf так уехал конфиг
      # metrics.samoy.love: server_name перестал совпадать, TLS-рукопожатие
      # для samoy.love падать стало ещё до HTTP, и сайт лёг. Соседи это
      # заметили и откатили СВОИ исправные релизы — по цепочке покраснели
      # шесть выкаток из восьми.
      #
      # mktemp -d даёт каталог 0700 с непредсказуемым именем: два прогона в
      # один файл не попадут. Тем же способом это давно делает bin/deploy —
      # локальный путь выкатки чинили, а переиспользуемый workflow забыли.
      # Непредсказуемость здесь не только про гонку: /tmp пишет кто угодно, а
      # читает этот файл nginx-apply.sh под sudo, ставя его в /etc/nginx.
      - name: Обновить конфиг nginx
        id: nginxapply
        if: steps.nginxsrc.outputs.path != '' && steps.cfg.outputs.nginx_dest != ''
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          NGINX_CONF: ${{ steps.nginxsrc.outputs.path }}
          APP: ${{ steps.cfg.outputs.app }}
          NGINX_DEST: ${{ steps.cfg.outputs.nginx_dest }}
          DRY: ${{ inputs.dry-run }}
        run: |
          REMOTE_DIR="$(ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'mktemp -d /tmp/dk-XXXXXXXXXX' | tr -d '\r' | tail -1)"
          case "$REMOTE_DIR" in
            /*) : ;;
            *)  echo "::error::не удалось создать временный каталог на сервере"; exit 1 ;;
          esac
          trap 'ssh -i ~/.ssh/deploy_key "$USER@$HOST" "rm -rf -- $REMOTE_DIR" || true' EXIT

          scp -i ~/.ssh/deploy_key "$NGINX_CONF" "$USER@$HOST:$REMOTE_DIR/site.conf"
          # Через env и printf %q — по той же причине, что и в предусловиях
          # выше: NGINX_DEST приезжает из описания цели и уезжает в командную
          # строку root'а, которая ставит файл в /etc/nginx.
          ARGS=(--app "$APP" --conf "$REMOTE_DIR/site.conf" --dest "$NGINX_DEST" --enable)
          [ "$DRY" = "true" ] && ARGS+=(--dry-run)
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "sudo /opt/deploy-kit/nginx-apply.sh $(printf '%q ' "${ARGS[@]}")"

      - name: Выкатить
        id: release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP: ${{ steps.cfg.outputs.app }}
          VERSION: ${{ steps.ver.outputs.version }}
          ROOT: ${{ steps.cfg.outputs.root }}
          OWNER: ${{ steps.cfg.outputs.owner }}
          UNIT: ${{ steps.cfg.outputs.unit }}
          HEALTH: ${{ steps.cfg.outputs.health }}
          VERSION_URL: ${{ steps.cfg.outputs.version_url }}
          NEIGHBOURS: ${{ steps.cfg.outputs.neighbours }}
          WRITE_VERSION_FILE: ${{ steps.cfg.outputs.write_version_file }}
          NOTIFY: ${{ steps.cfg.outputs.notify }}
          ALLOW_SAME: ${{ inputs.allow-same-version }}
          DRY: ${{ inputs.dry-run }}
        run: |
          # Архив кладётся в приватный каталог, а не прямо в /tmp.
          #
          # Гонки здесь не было: имя содержит цель и версию, поэтому два
          # прогона в один файл не попадали. Опасно другое — имя ПРЕДСКАЗУЕМО,
          # а писать в /tmp может любой локальный пользователь. Этот файл
          # читает release.sh под sudo и распаковывает от root, так что между
          # scp и распаковкой есть окно, в которое можно подменить содержимое
          # или подставить симлинк. Ровно об этом написано в bin/deploy, где
          # оба временных файла давно уехали в каталог от mktemp -d.
          #
          # Для Go-сервисов цена подмены выше, чем у статики: в артефакте не
          # только бинарь, но и юниты systemd — install_units раскладывает их
          # в /etc/systemd и перезапускает сервис.
          #
          # 0700 и непредсказуемое имя окно закрывают. Убирается по trap, а не
          # строкой после release.sh: при обрыве scp или ssh каталог иначе
          # оставался бы на сервере вместе с распакованным релизом внутри.
          REMOTE_DIR="$(ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'mktemp -d /tmp/dk-XXXXXXXXXX' | tr -d '\r' | tail -1)"
          case "$REMOTE_DIR" in
            /*) : ;;
            *)  echo "::error::не удалось создать временный каталог на сервере"; exit 1 ;;
          esac
          trap 'ssh -i ~/.ssh/deploy_key "$USER@$HOST" "rm -rf -- $REMOTE_DIR" || true' EXIT

          REMOTE="$REMOTE_DIR/$APP-$VERSION.tar.gz"
          scp -i ~/.ssh/deploy_key /tmp/artifact.tar.gz "$USER@$HOST:$REMOTE"

          # АРГУМЕНТЫ — МАССИВОМ И ЧЕРЕЗ printf %q, а не склейкой строки с
          # ручными апострофами. Причина та же, что в шаге «Предусловия на
          # хосте» выше: значения приезжают из описания цели в репозитории
          # проекта и уезжают в командную строку, которую выполняет root.
          ARGS=(--app "$APP" --version "$VERSION" --archive "$REMOTE" --root "$ROOT")
          [ -n "$UNIT" ]        && ARGS+=(--unit "$UNIT")
          [ -n "$OWNER" ]       && ARGS+=(--owner "$OWNER")
          [ -n "$HEALTH" ]      && ARGS+=(--health "$HEALTH")
          [ -n "$VERSION_URL" ] && ARGS+=(--version-url "$VERSION_URL")
          [ -n "$NEIGHBOURS" ]  && ARGS+=(--neighbours "$NEIGHBOURS")
          [ "$WRITE_VERSION_FILE" = "0" ] && ARGS+=(--no-version-file)
          [ "$ALLOW_SAME" = "true" ]      && ARGS+=(--allow-same-version)
          [ "$DRY" = "true" ]             && ARGS+=(--dry-run)

          # ГРУППА ПРОГОНА И ПРАВИЛО NOTIFY УЕЗЖАЮТ НА СЕРВЕР ВМЕСТЕ С ВЫКАТКОЙ.
          #
          # release.sh объявляет исход своим событием — он единственный, кто
          # видит автооткат и его причину. Но группы прогона он не знал, и
          # notify.sh на сервере считал её сам: source=local, hostname сервера,
          # свой pid. С группой этого прогона она не совпадала НИКОГДА, а по
          # §6 контракта незнакомая группа — это новое сообщение. Одна выкатка
          # объявлялась в чате дважды: карточкой прогона отсюда и отдельным
          # сообщением от сервера.
          #
          # Прообраз — ровно тот, что §6 предписывает для CI, и тот же, что
          # считает lib/notify.sh: repo, run_id и attempt через «|», без
          # перевода строки в конце.
          #
          # NOTIFY передаётся по той же причине: цель с NOTIFY=never просила
          # молчать, но серверные события уезжали в чат мимо настройки.
          GROUP="$(printf '%s|%s|%s' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${GITHUB_RUN_ATTEMPT:-1}" | sha256sum | cut -d' ' -f1)"
          ARGS+=(--group "$GROUP" --notify "${NOTIFY:-all}")

          # Выкатка запускается transient-юнитом, а не просто командой по SSH.
          # Разрыв соединения посылает SIGHUP удалённому процессу: выкатка
          # умерла бы между переключением симлинка и healthcheck, то есть
          # ровно там, где автооткат ещё не отработал, и прод остался бы на
          # непроверенном релизе. systemd-run переживает разрыв.
          #
          # Имя юнита тоже собирается из значения описания цели, поэтому и оно
          # чистится: раньше APP уезжал в --unit= подстановкой выражения.
          CMD="sudo /opt/deploy-kit/release.sh $(printf '%q ' "${ARGS[@]}")"
          UNIT_NAME="deploy-$(printf '%s' "$APP" | tr -c 'a-zA-Z0-9_.-' '-')-$GITHUB_RUN_ID-${GITHUB_RUN_ATTEMPT:-1}"
          RC=0
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "
            if command -v systemd-run >/dev/null 2>&1; then
              sudo systemd-run --wait --collect --quiet --pipe --unit=$(printf '%q' "$UNIT_NAME") $CMD
            else
              $CMD
            fi" || RC=$?
          # Код release.sh уезжает выходом шага: по нему шаг «Стадия провала»
          # отличает отказ версионного шлюза (прод не тронут — это preflight)
          # от всего остального. Пишется ДО выхода: $GITHUB_OUTPUT раннер
          # читает после шага независимо от его кода возврата.
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # Код 3 — отказ версионного шлюза: прод не тронут. Отдельная
          # формулировка нужна, чтобы в логе была причина, а не «job failed».
          if [ "$RC" = "3" ]; then
            echo "::error::версия $VERSION не прошла версионный шлюз (уже на проде, старше прода или несравнима). Прод не тронут. Осознанный повтор — запуск с allow-same-version"
            exit 1
          fi
          [ "$RC" = "0" ] || exit "$RC"

      # СТАДИЯ ПРОВАЛА. Считается по ПЕРВОМУ шагу, который не отработал:
      # шаги идут по порядку, и всё, что после упавшего, GitHub помечает как
      # пропущенное. Перечисление закрыто (docs/events.md, §7) — сырой вывод
      # лога в событие не попадает никогда: в нём бывают пути, хосты и куски
      # конфигурации, а событие уезжает в чат и на публичную страницу.
      #
      # Отменённый прогон тоже попадает сюда, и это осознанно. Стадию он даёт
      # ту, на которой его прервали, а событие уходит как failure: карточка
      # прогона уже висит в чате со строкой «выкатывается…», и оставить её
      # такой навсегда — та же тишина, ради которой всё затевалось.
      - name: Стадия провала
        id: stage
        if: ${{ always() && job.status != 'success' && !inputs.dry-run }}
        env:
          O_CFG: ${{ steps.cfg.outcome }}
          O_VER: ${{ steps.ver.outcome }}
          O_SSH: ${{ steps.ssh.outcome }}
          O_GATES: ${{ steps.gates.outcome }}
          O_NGINXSRC: ${{ steps.nginxsrc.outcome }}
          O_NGINXCHECK: ${{ steps.nginxcheck.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_VERFILE: ${{ steps.verfile.outcome }}
          O_PACK: ${{ steps.pack.outcome }}
          O_HOSTPRE: ${{ steps.hostpre.outcome }}
          O_NGINXAPPLY: ${{ steps.nginxapply.outcome }}
          O_RELEASE: ${{ steps.release.outcome }}
          RELEASE_RC: ${{ steps.release.outputs.rc }}
        run: |
          # Порядок пар — порядок шагов. Пустой outcome значит «до шага не
          # дошло», skipped — «пропущен по своему if», и ни то ни другое
          # стадией не является.
          STAGE=""
          for pair in \
              "$O_CFG:preflight" "$O_VER:preflight" "$O_SSH:upload" \
              "$O_GATES:gates" \
              "$O_NGINXSRC:preflight" "$O_NGINXCHECK:preflight" \
              "$O_BUILD:preflight" "$O_VERFILE:preflight" "$O_PACK:preflight" \
              "$O_HOSTPRE:preflight" "$O_NGINXAPPLY:switch" "$O_RELEASE:switch"; do
            case "${pair%%:*}" in
              ''|success|skipped) continue ;;
            esac
            STAGE="${pair#*:}"
            break
          done
          # Код 3 — версионный шлюз: прод не тронут, переключения не было.
          # Контракт (§7) относит его к preflight, а не к switch.
          if [ "$STAGE" = "switch" ] && [ "${RELEASE_RC:-}" = "3" ]; then
            STAGE=preflight
          fi
          # РОВНО ЗДЕСЬ КОНЧАЕТСЯ ТО, ЧТО ЗНАЕТ ПАЙПЛАЙН. Провал внутри
          # release.sh бывает на units, health, version и neighbours, но
          # снаружи он выглядит одним ненулевым кодом. Точную стадию и причину
          # рассказывает сам release.sh своим событием rolled_back — он
          # единственный, кто их видит. Событие отсюда отвечает за другое:
          # чтобы о провале узнали ДАЖЕ ЕСЛИ до сервера дело не дошло или
          # серверное событие не уехало.
          [ -n "$STAGE" ] || STAGE=preflight
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Стадия провала: $STAGE"

      # ИСХОД — ОДНИМ шагом под always(). Два шага (успех и провал) со
      # взаимоисключающими условиями дали бы два места, где считается вид
      # события, и рано или поздно они разошлись бы.
      #
      # Условие на app: без него событие не к чему привязать — оно попадает в
      # имя файла журнала. Пустым app бывает ровно тогда, когда упало чтение
      # описания цели, и в этом единственном случае о провале рассказывает
      # только красный прогон.
      - name: Событие — исход выкатки
        if: ${{ always() && !inputs.dry-run && steps.cfg.outputs.app != '' }}
        uses: tr0llex/deploy-kit/.github/actions/notify@main
        with:
          app: ${{ steps.cfg.outputs.app }}
          kind: ${{ job.status == 'success' && 'success' || 'failure' }}
          version: ${{ steps.ver.outputs.version }}
          changelog-html: ${{ env.CHANGELOG_FILE }}
          # Стадия — только у провала: у успеха контракт её ЗАПРЕЩАЕТ, и
          # действие на непустую стадию при kind=success ответит ошибкой.
          stage: ${{ job.status == 'success' && '' || steps.stage.outputs.stage }}
          notify: ${{ steps.cfg.outputs.notify }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}

      # Исход выкатки — в ту же запись, и обязательно под always(). Запись,
      # заведённая и навсегда оставшаяся в состоянии pending, врёт хуже, чем
      # её отсутствие: на коммите висел бы вечный «выкатывается», а в панели
      # Environments — цель, про которую непонятно, доехала она или нет.
      #
      # environment_url — HEALTH цели: с коммита и из панели открывается сам
      # компонент, а не только лог. log_url — прогон, который эту выкатку
      # сделал. Вместе они и дают связь «коммит ↔ выкатка» в обе стороны:
      # с коммита видно выкатку, из выкатки — коммит.
      #
      # Условие на deployment_id закрывает разом три случая: dry-run,
      # отказ создания (403 у необновлённого вызывающего) и ответ без номера.
      # Нет номера — отмечать нечего, и шаг молча не выполняется.
      - name: Отметить исход выкатки
        if: always() && steps.deployment.outputs.deployment_id != ''
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses
          ENVIRONMENT: ${{ steps.cfg.outputs.app }}
          HEALTH: ${{ steps.cfg.outputs.health }}
          VERSION: ${{ steps.ver.outputs.version }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::нет jq — исход выкатки в записи не отмечен"
            exit 0
          fi
          # Отменённый прогон — не провал выкатки: релиз переключается
          # последним шагом, поэтому при отмене прод остаётся прежним.
          # GitHub называет такой исход error, и это честнее, чем failure.
          case "$STATUS" in
            success)   STATE=success ;;
            cancelled) STATE=error ;;
            *)         STATE=failure ;;
          esac
          # HEALTH есть не у всякой цели, а пустой environment_url API
          # отвергает целиком — вместе со всем статусом. Поэтому ключа
          # просто нет, когда цели нечего открыть.
          PAYLOAD="$(jq -n --arg state "$STATE" --arg env "$ENVIRONMENT" \
            --arg log "$RUN_URL" --arg desc "$VERSION" --arg url "$HEALTH" \
            '{state:$state,environment:$env,log_url:$log,description:$desc}
             + (if $url == "" then {} else {environment_url:$url} end)')"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD")" || CODE=000
          case "$CODE" in
            201) echo "Исход выкатки записан: $STATE" ;;
            403|404) echo "::warning::нет права deployments: write (ответ $CODE) — исход выкатки не записан, запись останется в состоянии pending" ;;
            *) echo "::warning::GitHub не принял исход выкатки (ответ $CODE) — запись останется в состоянии pending" ;;
          esac
          exit 0

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
