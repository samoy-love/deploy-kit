name: static-site

# Переиспользуемый пайплайн для статических сайтов.
#
# В проекте остаётся вызов на десяток строк:
#
#   jobs:
#     deploy:
#       uses: tr0llex/deploy-kit/.github/workflows/static-site.yml@main
#       with:
#         config: .deploy-kit/prod.env
#         gates: npm ci && npm run test:coverage && npm run build
#       secrets: inherit

on:
  workflow_call:
    inputs:
      config:
        description: 'Файл описания цели в репозитории проекта'
        required: true
        type: string
      gates:
        description: 'Полный регресс: линт, типы, тесты, сборка. Красный = выкатки нет'
        required: true
        type: string
      node-version:
        required: false
        type: number
        default: 22
      nginx-conf:
        description: 'Конфиг nginx проекта, если его надо обновлять'
        required: false
        type: string
        default: ''
      dry-run:
        required: false
        type: boolean
        default: false
      allow-same-version:
        description: 'Разрешить версию, которая уже на проде (перевыкатка после ручной порчи каталога)'
        required: false
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Саму выкатку пайплайн делает по SSH
# секретами, а не токеном; токену остаются checkout и ОДНА вещь сверх того —
# запись о выкатке (Deployment) против вызвавшего коммита, отсюда
# deployments: write. Блок задан здесь, а не оставлен на настройки
# репозитория-вызывателя: переиспользуемый workflow катит прод во всех проектах
# сразу, и его права не должны зависеть от того, кто именно его позвал.
#
# У этого рассуждения есть честная граница, и проходит она ровно здесь:
# объявленное тут — ПОТОЛОК, а не выдача. Переиспользуемый workflow не может
# держать прав больше, чем дал вызывающий: токен выдаёт вызывающий прогон, и
# этот блок с его блоком пересекается, а не складывается. Значит
# `deployments: write` обязаны объявить ОБЕ стороны — здесь и в каждом
# вызывающем workflow рядом с contents: read, — иначе API отвечает 403.
# Половины приезжают в разном порядке и в разные дни, поэтому шаги записи о
# выкатке 403 переживают и катят дальше: запись — украшение, выкатка — нет.
permissions:
  contents: read
  deployments: write

concurrency:
  # Очередь на репозиторий. Очередь на весь хост держит flock в release.sh:
  # сюда она дотянуться не может, потому что репозиториев несколько.
  # Ключ включает ЦЕЛЬ, а не только репозиторий.
  #
  # При `target=all` четыре задачи одного репозитория попадали в одну группу,
  # а GitHub держит в очереди лишь одну ожидающую — остальные вытесняли друг
  # друга и отменялись. Выкатить всё за один запуск было невозможно: две цели
  # проходили, две гибли. Четыре разные цели — это не гонка двух выкаток, а
  # одна выкатка четырёх вещей.
  #
  # Очерёдность на самом хосте держит flock в release.sh, поэтому параллельные
  # цели одного репозитория безопасны.
  group: deploy-${{ github.repository }}-${{ inputs.config }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Список изменений собирается ОДИН раз и лежит здесь до конца job'а:
      # его читают и шаг «Отметить версию в сборке» (пишет в version.json), и
      # шаг уведомления (дописывает в сообщение). Путь общий, чтобы эти двое
      # не разъехались по опечатке в литерале.
      CHANGELOG_FILE: /tmp/changelog.txt
    steps:
      # Глубина нужна шагу «Уведомить в Telegram»: список изменений строится
      # из истории репозитория проекта, а по умолчанию checkout привозит один
      # коммит — и тогда changelog честно покажет ровно один пункт (а если это
      # коммит слияния, то ничего). Теги нужны отдельным флагом: при ненулевой
      # глубине они не приезжают, и диапазон «от прошлого тега» не работает.
      # 50 — минимум по договорённости с bin/changelog; 0 (вся история) дороже
      # на каждом прогоне, а нужен только хвост.
      #
      # Долгое время go-service.yml здесь стоял с fetch-tags: false, и причина
      # была не капризом: теги видел шаг «Версия релиза», на отмеченном тегом
      # коммите версия получалась v1.2.3 вместо release-…, а compare_versions
      # в server/lib.sh сравнивает схему только сама с собой — смесь даёт
      # incomparable, и release.sh отвечает GATE_REJECT (код 3). Здесь теги
      # качались, то есть ровно эта мина лежала и в статике: любой пуш на
      # отмеченный тегом коммит валил выкатку.
      #
      # Разошлись не настройки, а два требования к одному флагу: теги нужны
      # ИСТОРИИ и вредны ВЕРСИИ. Теперь оба пайплайна теги качают, а версию
      # из них не берут (см. шаг «Версия релиза»).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          fetch-tags: true

      # Без кеша npm — он требует lock-файла.
      #
      # У статических сайтов здесь нет package.json вовсе: линтеры зовутся через
      # `npx --yes`. setup-node в этом случае не предупреждает, а ПАДАЕТ
      # («Dependencies lock file is not found»), и выкатка обрывается ещё до
      # гейтов, то есть до того, как хоть что-то проверено. Кешировать при этом
      # нечего: npx тянет по одному пакету на прогон.
      #
      # ВЕРСИЮ ВЫБИРАЕТ РЕПОЗИТОРИЙ, А НЕ ДЕФОЛТ ЭТОГО ФАЙЛА.
      #
      # Здесь стоял `node-version: ${{ inputs.node-version }}` с дефолтом 22, и
      # переопределял его ровно один проект из четырёх. Остальные СОБИРАЛИ
      # АРТЕФАКТ ДЛЯ ПРОДА НА NODE 22, хотя все свои проверки — линт, юнит-тесты,
      # сквозные — гоняли на 24. То есть проверяли одно, а выкладывали другое, и
      # разойтись эти две версии могли молча: сборка на 22 не падает от того, что
      # тесты прошли на 24.
      #
      # Теперь источник один — .nvmrc в самом репозитории, тот же файл, что
      # читает `nvm use` у разработчика. Дефолт входа остаётся запасным для
      # проектов, где .nvmrc ещё нет.
      #
      # ВЫБОР ДЕЛАЕТ ШАГ, А НЕ ВЫРАЖЕНИЕ В `with`. Напрашивающееся
      #
      #   node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
      #   node-version:      ${{ hashFiles('.nvmrc') != '' && '' || inputs.node-version }}
      #
      # НЕ РАБОТАЕТ, и молча. В выражениях GitHub `A && B || C` — не тернарник:
      # `&&` возвращает B, только если B истинно, а пустая строка ложна. Вторая
      # строка поэтому всегда сворачивается в дефолт, оба ключа приезжают
      # заполненными, и setup-node берёт node-version — файл он при этом
      # честно называет в предупреждении «Both inputs are specified», которое в
      # зелёном логе никто не читает. Проверено сухим прогоном: .nvmrc с
      # цифрой 24 в репозитории, а в лог уехало «node-version: 22».
      #
      # Шаг ещё и говорит вслух, чей номер победил, — иначе выяснять это опять
      # придётся сухим прогоном.
      - name: Выбрать версию Node
        id: node
        env:
          FALLBACK: ${{ inputs.node-version }}
        run: |
          if [ -f .nvmrc ]; then
            # v-префикс и пробелы допустимы в .nvmrc, setup-node их переживёт,
            # но в логе номер должен читаться, а не угадываться.
            V="$(tr -d ' \t\r\nv' < .nvmrc)"
            echo "версия Node из .nvmrc: $V"
          else
            V="$FALLBACK"
            echo "в репозитории нет .nvmrc — беру дефолт пайплайна: $V"
          fi
          [ -n "$V" ] || { echo "::error::версия Node не определилась"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}

      # Входы приходят в шаг ПЕРЕМЕННЫМИ ОКРУЖЕНИЯ, а не подстановкой ${{ }}
      # в тело скрипта. Разница не косметическая: при подстановке значение
      # становится ЧАСТЬЮ ТЕКСТА скрипта, и строка вида `x"; curl ...; #`
      # выполняется как отдельная команда до всего остального — со всеми
      # секретами job'а под рукой. Через env значение остаётся данными.
      #
      # Сейчас это защита в глубину, а не закрытая дыра: триггеры у вызывающих
      # доверенные (push/теги/dispatch, pull_request_target нигде нет), то есть
      # содержимое входов пишет тот же, кто и так может править этот пайплайн.
      # Но глубина здесь стоит трёх строк.
      - name: Прочитать описание цели
        id: cfg
        env:
          CONFIG: ${{ inputs.config }}
          # Второй, необязательный источник конфига nginx — вход nginx-conf.
          # Нужен ниже проверке пары: с ним NGINX_DEST без NGINX_CONF законен.
          REPO_CONF: ${{ inputs.nginx-conf }}
        run: |
          # Путь обязан быть относительным и не выходить из репозитория:
          # описание цели — файл проекта, а не произвольная точка ФС раннера.
          case "$CONFIG" in
            /*|*..*) echo "::error::config должен быть относительным путём внутри репозитория, получено: $CONFIG"; exit 1 ;;
          esac
          [ -f "$CONFIG" ] || { echo "::error::нет файла $CONFIG"; exit 1; }
          # Значение входа снимается ДО чтения описания. Описание цели — обычный
          # shell-файл проекта: строка REPO_CONF=… в нём переписала бы вход и
          # тихо отключила проверку пары ниже.
          INPUT_NGINX_CONF="$REPO_CONF"
          # Значения уезжают в outputs, а не в глобальный env: так видно,
          # что именно пайплайн взял из описания.
          set -a
          # Путь к описанию цели приходит параметром workflow — проследить его
          # статически нельзя, и это осознанно: файл принадлежит проекту.
          # shellcheck disable=SC1090
          . "./$CONFIG"
          set +a
          for v in APP ARTIFACT_DIR ROOT; do
            [ -n "${!v}" ] || { echo "::error::в описании не задано $v"; exit 1; }
          done
          # Конфиг nginx описывается парой: что ставить и куда. Одна половина
          # без другой — это не «частично настроено», а молча пропущенный шаг:
          # ровно так NGINX_DEST у целей и простоял, ничего не применяя.
          if [ -n "${NGINX_CONF:-}" ]; then
            case "$NGINX_CONF" in
              /*|*..*) echo "::error::NGINX_CONF должен быть относительным путём внутри deploy-kit, получено: $NGINX_CONF"; exit 1 ;;
            esac
            [ -n "${NGINX_DEST:-}" ] || { echo "::error::задан NGINX_CONF, но нет NGINX_DEST — некуда ставить конфиг"; exit 1; }
          fi
          # Обратная половина той же пары — и она важнее прямой. NGINX_CONF без
          # NGINX_DEST падал здесь всегда, а NGINX_DEST без NGINX_CONF пайплайн
          # принимал МОЛЧА: шаги «Взять конфиг nginx», «Проверить конфиг nginx»
          # и «Обновить конфиг nginx» просто не выполнялись, и прогон
          # заканчивался зелёным. Ровно так шесть конфигов из nginx/sites/
          # годами лежали невыложенными: правку вносили, прогон был зелёный, на
          # сервере не менялось ничего — и заметить это было неоткуда.
          # Односторонняя проверка сама прятала тот дефект, который была
          # обязана называть.
          #
          # Сообщение называет ПОСЛЕДСТВИЕ, а не отсутствующую переменную:
          # «нет NGINX_CONF» читается как «чего-то недонастроили», а вся цена
          # ошибки в том, что выкатка выглядит удачной. Смысл проверки —
          # прекратить молчаливый пропуск, значит и говорить она должна о нём.
          #
          # Вход nginx-conf — законное исключение: конфиг тогда лежит в
          # репозитории проекта, NGINX_CONF пуст, а шаги отрабатывают. Ошибка
          # только там, где везти нечего НИ ОДНИМ из двух путей.
          if [ -n "${NGINX_DEST:-}" ] && [ -z "${NGINX_CONF:-}" ] && [ -z "$INPUT_NGINX_CONF" ]; then
            echo "::error::задан NGINX_DEST, но нет NGINX_CONF — везти нечего, все шаги nginx будут пропущены: выкатка будет зелёной, а конфиг не поедет. Задайте NGINX_CONF (путь внутри deploy-kit) либо уберите NGINX_DEST"
            exit 1
          fi
          {
            echo "app=$APP"
            echo "artifact_dir=$ARTIFACT_DIR"
            echo "root=$ROOT"
            echo "owner=${OWNER:-}"
            # UNIT здесь не про Go. Цель может раздаваться статикой и при этом
            # иметь юнит-обёртку, который нужно перезапустить после
            # переключения симлинка, — так устроен стек мониторинга: артефакт
            # это конфиги, а применяет их `systemctl restart`. Пока входа не
            # было, такой цели не подходил ни один пайплайн: go-service.yml
            # требует go.mod, которого у неё нет.
            echo "unit=${UNIT:-}"
            echo "health=${HEALTH:-}"
            echo "notify=${NOTIFY:-all}"
            echo "version_url=${VERSION_URL:-}"
            echo "neighbours=${NEIGHBOURS:-}"
            echo "nginx_reload=${NGINX_RELOAD:-0}"
            echo "nginx_conf=${NGINX_CONF:-}"
            echo "nginx_dest=${NGINX_DEST:-}"
            echo "write_version_file=${WRITE_VERSION_FILE:-1}"
          } >> "$GITHUB_OUTPUT"

      - name: Версия релиза
        id: ver
        run: |
          # Всё, что уехало отсюда, помечается release-: по имени релиза на
          # сервере сразу видно, пайплайн его положил или человек руками.
          #
          # Тег здесь БОЛЬШЕ НЕ СПРАШИВАЕМ, хотя теги в клоне есть. Раньше
          # стояло `git describe --tags --exact-match`, и на коммите с тегом
          # версия становилась v1.2.3. Прод при этом живёт в схеме
          # release-<дата>-<sha>, а compare_versions сравнивает схему только
          # сама с собой: смесь даёт incomparable, шлюз отвечает кодом 3 и
          # выкатки нет. Правило «всё, что уехало отсюда, помечается release-»
          # эта ветка нарушала и заодно ломала — теперь оно выполняется
          # буквально. Тег никуда не теряется: он достаётся из commit, который
          # лежит рядом в version.json.
          V="release-$(TZ=Europe/Moscow date '+%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

      # Запись о выкатке средствами самого GitHub: Deployment против ТОГО
      # коммита, который выкатку вызвал. Связь «коммит → выкатка» до сих пор
      # существовала только внутри релиза — в имени release-<дата>-<sha> и в
      # поле commit файла version.json, — то есть чтобы её увидеть, надо было
      # заранее знать, куда смотреть. Deployment виден там, куда смотрят и
      # так: строкой на самом коммите и в панели Environments репозитория.
      #
      # ОКРУЖЕНИЕ — ЭТО ЦЕЛЬ, А НЕ РЕПОЗИТОРИЙ: берём APP из описания цели.
      # В хозяйстве есть репозиторий с четырьмя целями; назови окружение
      # именем репозитория — и в панели окажется одно окружение, в которое по
      # очереди «выкатываются» четыре разных вещи, и история каждой затирает
      # остальные три. APP — то же имя, под которым цель живёт на сервере, в
      # юните и в сообщении о релизе, и связь читается без словаря.
      #
      # Шаг стоит не первым в job'е, а сразу за чтением описания и версией:
      # раньше просто неоткуда взять ни имя окружения, ни описание записи.
      # Зато ДО регресса — красный гейт это тоже исход выкатки, и запись
      # обязана о нём рассказать, а не появиться только у удачных прогонов.
      #
      # При dry-run записи нет вовсе: прод не тронут, а «выкачено» на коммите
      # и в панели Environments после проверочного прогона — прямая ложь.
      #
      # ЗАПИСЬ — УКРАШЕНИЕ ПОВЕРХ ВЫКАТКИ, ровно как список изменений, и
      # правило у неё то же: ни один её отказ не имеет права ни уронить job,
      # ни остановить выкатку. Отсюда continue-on-error, exit 0 на всех путях
      # и ::warning:: вместо ::error::. Отдельной веткой разобран 403: право
      # deployments: write обязаны дать обе стороны (см. комментарий у
      # permissions), а вызывающие обновляются не одним коммитом с этим
      # файлом. Пропавшая запись — потеря косметическая, упавшая выкатка нет.
      - name: Завести запись о выкатке
        id: deployment
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/deployments
          ENVIRONMENT: ${{ steps.cfg.outputs.app }}
          VERSION: ${{ steps.ver.outputs.version }}
          # Коммит вызывающего: в переиспользуемом workflow github.sha — это
          # ревизия того репозитория, который его позвал, и ровно её же выше
          # выложил checkout. Записывать надо её, а не HEAD deploy-kit.
          SHA: ${{ github.sha }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::нет jq — запись о выкатке не заводится, выкатка идёт дальше"
            exit 0
          fi
          # required_contexts: [] обязательно. По умолчанию GitHub ждёт на
          # коммите зелёных commit statuses и на их отсутствие отвечает 409 —
          # запись не появилась бы никогда. Проверка здесь одна и она ниже:
          # шаг «Полный регресс», а не статусы на коммите.
          #
          # auto_merge: false — иначе API вместо записи может завести мерж
          # базовой ветки. Выкатка катит ровно то, что проверено, и ничего
          # не мержит сама.
          PAYLOAD="$(jq -n --arg ref "$SHA" --arg env "$ENVIRONMENT" --arg desc "$VERSION" \
            '{ref:$ref,environment:$env,description:$desc,auto_merge:false,required_contexts:[]}')"
          BODY="$(mktemp)"
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "$API" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD")" || CODE=000
          case "$CODE" in
            201)
              ID="$(jq -r '.id // empty' "$BODY")"
              if [ -n "$ID" ]; then
                echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"
                echo "Запись о выкатке #$ID: окружение $ENVIRONMENT, коммит $SHA"
              else
                echo "::warning::GitHub завёл запись о выкатке, но не вернул её номер — исход отмечать будет нечем"
              fi
              ;;
            403|404)
              echo "::warning::нет права deployments: write (ответ $CODE) — записи о выкатке не будет. Вызывающий workflow должен объявить permissions: deployments: write рядом с contents: read. На саму выкатку это не влияет"
              ;;
            *)
              echo "::warning::GitHub не завёл запись о выкатке (ответ $CODE) — выкатка идёт дальше"
              ;;
          esac
          exit 0

      # Полный регресс. Красный регресс = выкатки нет: main обязан быть
      # всегда выкатываемым, раз каждый мерж уезжает на прод.
      #
      # gates тоже приходит переменной окружения и выполняется через eval:
      # выполнить эту строку — и есть смысл шага, но текстом скрипта она при
      # этом не становится (см. пояснение у шага «Прочитать описание цели»).
      - name: Полный регресс
        env:
          GATES: ${{ inputs.gates }}
        run: eval "$GATES"

      # Ранняя проверка конфига: тот же конфиг на сервере ещё раз проходит
      # nginx-apply.sh, который сверяет версию nginx, запускает nginx -t и
      # откатывается при провале. Здесь это делается до того, как выкатка
      # что-либо тронет.
      #
      # Раньше на этом месте стояла мягкая ветка: если скрипт не скачался,
      # шаг печатал ::warning:: «deploy-kit приватный» и пропускался.
      # Репозиторий публичный — ветка была мертва, а её существование делало
      # шаг молча пропускаемым при ЛЮБОМ сбое сети. Теперь недоступность
      # скрипта — это отказ: проверку, которую нельзя выполнить, нельзя и
      # считать пройденной.
      # Откуда берётся конфиг сайта.
      #
      # Основной путь — NGINX_CONF в описании цели: путь ВНУТРИ deploy-kit,
      # откуда файл и скачивается. Так конфигурация nginx остаётся в одном
      # репозитории, как и задумано, а проекту не нужна её копия у себя.
      #
      # Вход nginx-conf оставлен для целей, которые всё же держат конфиг у себя
      # (путь тогда считается от корня репозитория проекта). Если заданы оба,
      # выигрывает описание цели: оно ближе к выкатке и читается обоими путями,
      # локальным и этим.
      - name: Взять конфиг nginx
        id: nginxsrc
        if: steps.cfg.outputs.nginx_conf != '' || inputs.nginx-conf != ''
        env:
          KIT_CONF: ${{ steps.cfg.outputs.nginx_conf }}
          REPO_CONF: ${{ inputs.nginx-conf }}
        run: |
          if [ -n "$KIT_CONF" ]; then
            [ -n "$REPO_CONF" ] && echo "::warning::заданы и NGINX_CONF, и вход nginx-conf — беру NGINX_CONF ($KIT_CONF)"
            # Ссылка на main — тем же способом, что и ci/nginx-check.sh ниже:
            # reusable workflow вызывают как @main, и конфиг обязан приехать из
            # той же точки, что и проверяющий его скрипт.
            curl -fsSL "https://raw.githubusercontent.com/tr0llex/deploy-kit/main/$KIT_CONF" -o /tmp/site.conf \
              || { echo "::error::не удалось скачать $KIT_CONF из deploy-kit"; exit 1; }
            # Пустой файл curl считает успехом, а nginx — валидным конфигом:
            # выкатка бы прошла зелёной и оставила сайт без единого location.
            [ -s /tmp/site.conf ] || { echo "::error::$KIT_CONF скачался пустым"; exit 1; }
          else
            case "$REPO_CONF" in
              /*|*..*) echo "::error::nginx-conf должен быть относительным путём внутри репозитория, получено: $REPO_CONF"; exit 1 ;;
            esac
            [ -f "$REPO_CONF" ] || { echo "::error::нет файла $REPO_CONF"; exit 1; }
            cp "$REPO_CONF" /tmp/site.conf
          fi
          echo "path=/tmp/site.conf" >> "$GITHUB_OUTPUT"
          echo "Конфиг nginx: ${KIT_CONF:-$REPO_CONF}"

      - name: Проверить конфиг nginx
        if: steps.nginxsrc.outputs.path != ''
        run: |
          curl -fsSL https://raw.githubusercontent.com/tr0llex/deploy-kit/main/ci/nginx-check.sh -o /tmp/nginx-check.sh \
            || { echo "::error::не удалось скачать ci/nginx-check.sh — ранняя проверка конфига невозможна"; exit 1; }
          bash /tmp/nginx-check.sh "${{ steps.nginxsrc.outputs.path }}"

      # Цель с WRITE_VERSION_FILE=0 version.json не раздаёт — класть его в
      # артефакт нечестно: шлюз бы сверял файл, до которого снаружи не дойти.
      # BUILD_CMD выполняется и здесь, как в go-service.
      #
      # Раньше шага не было вовсе, хотя описания целей его задают: chillhub
      # копирует landing в stage-site, metro и samoy.love зовут
      # `npm ci && npm run build`. Команда молча игнорировалась, и первым падал
      # следующий шаг — записью version.json в несуществующий каталог, с
      # сообщением «No such file or directory», по которому причину не найти.
      #
      # Команда необязательна: цель, чей артефакт лежит в репозитории как есть,
      # проходит проверку наличия каталога и едет дальше.
      - name: Собрать артефакт
        env:
          DEPLOY_VERSION: ${{ steps.ver.outputs.version }}
          CONFIG: ${{ inputs.config }}
        run: |
          # Описание читаем здесь же и выполняем команду как есть — так строка
          # доезжает до shell в точности такой, какой её написали в проекте.
          set -a
          # Путь — через env, а не подстановкой: см. шаг «Прочитать описание цели».
          # shellcheck disable=SC1090
          . "$GITHUB_WORKSPACE/$CONFIG"
          set +a
          [ -z "${BUILD_CMD:-}" ] || eval "$BUILD_CMD"

          D="${{ steps.cfg.outputs.artifact_dir }}"
          [ -d "$D" ] || { echo "::error::нет каталога $D — BUILD_CMD его не создал, а в репозитории его нет"; exit 1; }
          # Пустой каталог — тоже провал: на сервер уехала бы пустая статика, и
          # сайт отдавал бы 404 при формально успешной выкатке.
          [ -n "$(ls -A "$D")" ] || { echo "::error::каталог $D пуст"; exit 1; }
          echo "Артефакт:"; ls -la "$D"

      # Список изменений собирается ЗДЕСЬ, а не в шаге уведомления, хотя
      # нужен обоим. Порядок шагов выбора не оставляет: version.json пишется
      # до упаковки артефакта, а уведомление уходит после выкатки — значит
      # шаг уведомления физически не может отдать свой вывод в файл, который
      # к тому моменту уже лежит на сервере. Поэтому генератор зовётся один
      # раз тут, а оба потребителя читают готовый файл. Выгода не только в
      # одном скачивании: в чат и в version.json уезжает ГАРАНТИРОВАННО один
      # и тот же текст, а не два независимо посчитанных списка одного релиза.
      #
      # Шаг не имеет права уронить выкатку ничем: список изменений —
      # украшение поверх релиза. Отсюда и пустой файл заранее, и warning
      # вместо error на каждой неудаче, и continue-on-error сверху как
      # последняя страховка от того, чего мы не предусмотрели.
      - name: Собрать список изменений
        continue-on-error: true
        env:
          # Предыдущая ревизия для списка изменений. Есть только у push;
          # на остальных событиях пусто — changelog сам откатится на тег или
          # на последние коммиты. Нули от первого пуша он тоже переживает.
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          # Чем закрыть дыру, когда события push нет (workflow_dispatch):
          # версия, которая СЕЙЧАС на проде. Генератор принимает её целиком —
          # хвостовой sha из release-<дата>-<sha> он достаёт сам.
          PROD_VERSION_URL: ${{ steps.cfg.outputs.version_url }}
          # База ссылок на номер PR. Слияние в хозяйстве всегда сквошем, и
          # GitHub дописывает к теме хвост «(#21)»; генератор его срезает —
          # в чате голый номер никуда не ведёт и занимает место. С --link-base
          # номер возвращается в строку, но уже ССЫЛКОЙ:
          # «• Завести dependabot одинаково во всех репозиториях <a …>#21</a>».
          # Скобок вокруг ссылки НЕТ: генератор снимает их вместе с хвостом, и
          # видимая часть строки — ровно «#21», четыре знака вместо шести.
          # Строка не потолстела, а из чата стало можно уйти в сам PR.
          #
          # Берётся из github.repository, а не из `git remote get-url origin`:
          # это каноническое имя выкатываемого репозитория, и разбирать ssh- и
          # https-формы remote'а здесь не нужно вовсе. server_url, а не литерал
          # https://github.com — на GHES хост другой, а неверная ссылка хуже
          # отсутствующей: она молча ведёт в никуда.
          #
          # /pull/N безопасно и тогда, когда номер оказался issue: GitHub
          # переадресует /pull/N ↔ /issues/N в обе стороны.
          LINK_BASE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Файл существует ВСЕГДА, пусть и пустой: читающие шаги смотрят
          # только на его содержимое и не должны знать, дошло ли тут дело
          # до генератора вообще.
          : > "$CHANGELOG_FILE"

          # ТОЧКА ОТСЧЁТА, КОГДА СОБЫТИЯ push НЕТ.
          #
          # github.event.before есть только у push. У workflow_dispatch его не
          # бывает, --since уезжал пустым, и дальше генератор честно
          # отрабатывал запасной вариант «тегов нет и предыдущая ревизия не
          # передана». Тегов в хозяйстве нет ни в одном репозитории, так что
          # запасным оказывался он же — и в релиз статус-страницы уехали шесть
          # десятков чужих правок за полгода, включая служебные «probe: …».
          #
          # Спрашиваем прод: version.json отдаёт версию РАБОТАЮЩЕГО релиза, а
          # это и есть «что стоит сейчас». Точнее источника нет — так же
          # рассуждает release.sh, сверяясь с симлинком current.
          #
          # Молчаливо: цель может не раздавать version.json
          # (WRITE_VERSION_FILE=0), прод может лежать, релиз может быть первым.
          # Везде остаётся пусто, то есть прежнее поведение, — список изменений
          # не имеет права уронить выкатку.
          if [ -z "${BEFORE:-}" ] && [ -n "${PROD_VERSION_URL:-}" ]; then
            BEFORE="$(curl -fsS --max-time 10 "$PROD_VERSION_URL" 2>/dev/null | tr ',' '\n' \
              | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
            [ -n "$BEFORE" ] && echo "предыдущая версия с прода: $BEFORE"
          fi
          # Качается оттуда же, откуда ci/nginx-check.sh, — один генератор на
          # все пути выкатки, чтобы лента релизов читалась одинаково.
          if ! curl -fsSL https://raw.githubusercontent.com/tr0llex/deploy-kit/main/bin/changelog -o /tmp/changelog; then
            echo "::warning::bin/changelog не скачался — релиз уедет без списка изменений"
            exit 0
          fi
          # Через `bash <файл>`, а не запуском напрямую: в deploy-kit
          # core.filemode=false, bin/* лежат в индексе как 100644, и на
          # свежем клоне под Linux файл неисполняемый.
          #
          # timeout — не паранойя и не про сегодняшний код генератора.
          # Скачивается он с main, а не берётся из проверенного здесь клона:
          # какая ревизия приедет, решает состояние main в момент прогона, и
          # закрепить её тут нечем. Вечный цикл в разборе аргументов там уже
          # был однажды — шаг висел до таймаута job'а. Починка в bin/changelog
          # эту конкретную дыру закрыла, но условие «украшение поверх выкатки
          # не может стать её потолком по времени» должно держаться здесь, на
          # стороне вызывающего, и при любой ревизии генератора.
          #
          # stderr генератора НЕ глушится: там ровно одна строка с причиной
          # выбранного диапазона, и в логе прогона она стоит копейки. Глушить
          # её здесь означало бы вернуть ровно тот дефект, из-за которого
          # «пусто» неотличимо от «выключено».
          #
          # --all — режим БЕЗ ПОТОЛКА: в файл уезжает ВЕСЬ список релиза, а не
          # первые восемь пунктов. Обрезка именно здесь необратима: этот файл
          # дословно ложится в version.json, а бот и статус-страница читают
          # готовое поле changelog и физически не могут показать то, чего в
          # файле нет. Отсюда же исчезает хвост «…и ещё 1 коммит» — строка,
          # которая занимает место и не говорит, КАКОЙ коммит.
          #
          # Лимит Telegram этим не нарушается: длинный текст уходит несколькими
          # сообщениями подряд — см. шаг «Уведомить в Telegram».
          #
          # Оба новых аргумента понимает генератор из ТОГО ЖЕ main, откуда
          # приезжает и этот workflow: они едут одним коммитом. Разъедутся —
          # генератор ответит на неизвестный аргумент пустым stdout и кодом 0,
          # то есть релиз уедет без списка, но уедет.
          if ! timeout 60 bash /tmp/changelog --repo "$GITHUB_WORKSPACE" --since "${BEFORE:-}" \
                 --link-base "$LINK_BASE" --all > "$CHANGELOG_FILE"; then
            echo "::warning::генератор списка изменений не отработал — релиз уедет без него"
            : > "$CHANGELOG_FILE"
          fi

      - name: Отметить версию в сборке
        if: steps.cfg.outputs.write_version_file != '0'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARTIFACT_DIR: ${{ steps.cfg.outputs.artifact_dir }}
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT="$(TZ=Europe/Moscow date '+%Y-%m-%dT%H:%M:%S+03:00')"

          # Необязательный ключ changelog — ВЕРБАТИМНЫЙ stdout генератора одной
          # строкой JSON. Его читает агент статус-страницы: до этого поля он
          # умел, а писать его не умел никто, и половина бота была недостижима.
          #
          # СОБИРАЕТ ФАЙЛ jq, А НЕ printf, и это не вкусовщина. Темы коммитов
          # пишет кто угодно с правом на пуш: в них есть кавычки, обратные
          # слэши и — главное — настоящие переводы строк, которые генератор
          # честно ставит между пунктами. Наивный printf '…"changelog":"%s"…'
          # на таком вводе даёт файл, который отвергает ЛЮБОЙ разбирающий JSON
          # («control characters from U+0000 through U+001F must be escaped»),
          # то есть version.json перестаёт читаться целиком — вместе с полями
          # version и commit, по которым выкатка себя проверяет. Ради
          # украшения потерять проверку релиза нельзя.
          #
          # Вывод оставляем МНОГОСТРОЧНЫМ (jq так и печатает по умолчанию):
          # версию из файла читают три разных места (check_version и
          # current_live_version в server/lib.sh, таблица в bin/dk) — все три
          # построчным sed'ом с `head -1`. Ключ version стоит первым, значит
          # первая подходящая строка всегда настоящая версия.
          #
          # У статики этот файл лежит в корне сайта и виден снаружи: темы
          # коммитов теперь читаемы по /version.json. Для наших публичных
          # репозиториев это ничего не открывает — те же темы лежат в истории
          # на GitHub. Цель с закрытым репозиторием, которой такое не подходит,
          # ставит в описании WRITE_VERSION_FILE=0 и версию не раздаёт вовсе.
          #
          # Пустой вывод генератора = ключа нет вовсе, ровно как в договоре.
          OK=0
          if command -v jq >/dev/null 2>&1; then
            if [ -s "$CHANGELOG_FILE" ]; then
              if jq -n --arg version "$VERSION" --arg commit "$COMMIT" --arg builtAt "$BUILT_AT" \
                      --rawfile changelog "$CHANGELOG_FILE" \
                      '{version:$version,commit:$commit,builtAt:$builtAt,changelog:$changelog}' \
                      > "$ARTIFACT_DIR/version.json"; then OK=1; fi
            else
              if jq -n --arg version "$VERSION" --arg commit "$COMMIT" --arg builtAt "$BUILT_AT" \
                      '{version:$version,commit:$commit,builtAt:$builtAt}' \
                      > "$ARTIFACT_DIR/version.json"; then OK=1; fi
            fi
          fi
          # Страховка: нет jq или он почему-то не отработал — пишем ровно тот
          # файл, что писали всегда. Версия обязана уехать при любом раскладе,
          # список изменений — нет.
          if [ "$OK" != 1 ]; then
            echo "::warning::jq недоступен или не собрал version.json — пишу файл без списка изменений"
            printf '{"version":"%s","commit":"%s","builtAt":"%s"}\n' \
              "$VERSION" "$COMMIT" "$BUILT_AT" > "$ARTIFACT_DIR/version.json"
          fi
          cat "$ARTIFACT_DIR/version.json"

      - name: Упаковать
        run: |
          tar -czf /tmp/artifact.tar.gz -C "${{ steps.cfg.outputs.artifact_dir }}" .
          echo "Размер: $(du -h /tmp/artifact.tar.gz | cut -f1)"
          sha256sum /tmp/artifact.tar.gz

      - name: Настроить SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключ хоста из секрета, а не ssh-keyscan: keyscan доверяет первому
          # ответу и молча принимает подмену.
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOST_KEY не задан — ключ хоста принимается доверием к первому ответу"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Предусловия на хосте
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "sudo /opt/deploy-kit/preflight.sh --app '${{ steps.cfg.outputs.app }}' \
               --root '${{ steps.cfg.outputs.root }}' \
               ${{ steps.cfg.outputs.unit && format('--units ''{0}''', steps.cfg.outputs.unit) || '' }}"

      # ИМЯ НА СЕРВЕРЕ — УНИКАЛЬНОЕ, А НЕ /tmp/site.conf.
      #
      # Здесь стоял путь, ОДИН И ТОТ ЖЕ для всех проектов. Пока цели катились
      # по одной, это работало. Мерж нескольких PR подряд запускает выкатки
      # параллельно — и они начинают писать в один файл: проект A заливает
      # свой конфиг, проект B перезаписывает его своим, после чего A просит
      # применить «/tmp/site.conf» под ИМЕНЕМ СВОЕГО сайта. В
      # /etc/nginx/sites-available/samoy.love.conf так уехал конфиг
      # metrics.samoy.love: server_name перестал совпадать, TLS-рукопожатие
      # для samoy.love падать стало ещё до HTTP, и сайт лёг. Соседи это
      # заметили и откатили СВОИ исправные релизы — по цепочке покраснели
      # шесть выкаток из восьми.
      #
      # mktemp -d даёт каталог 0700 с непредсказуемым именем: два прогона в
      # один файл не попадут. Тем же способом это давно делает bin/deploy —
      # локальный путь выкатки чинили, а переиспользуемый workflow забыли.
      # Непредсказуемость здесь не только про гонку: /tmp пишет кто угодно, а
      # читает этот файл nginx-apply.sh под sudo, ставя его в /etc/nginx.
      - name: Обновить конфиг nginx
        if: steps.nginxsrc.outputs.path != '' && steps.cfg.outputs.nginx_dest != ''
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          NGINX_CONF: ${{ steps.nginxsrc.outputs.path }}
        run: |
          REMOTE_DIR="$(ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'mktemp -d /tmp/dk-XXXXXXXXXX' | tr -d '\r' | tail -1)"
          case "$REMOTE_DIR" in
            /*) : ;;
            *)  echo "::error::не удалось создать временный каталог на сервере"; exit 1 ;;
          esac
          trap 'ssh -i ~/.ssh/deploy_key "$USER@$HOST" "rm -rf -- $REMOTE_DIR" || true' EXIT

          scp -i ~/.ssh/deploy_key "$NGINX_CONF" "$USER@$HOST:$REMOTE_DIR/site.conf"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "sudo /opt/deploy-kit/nginx-apply.sh --app '${{ steps.cfg.outputs.app }}' \
               --conf '$REMOTE_DIR/site.conf' --dest '${{ steps.cfg.outputs.nginx_dest }}' --enable \
               ${{ inputs.dry-run && '--dry-run' || '' }}"

      - name: Выкатить
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Архив кладётся в приватный каталог, а не прямо в /tmp.
          #
          # Гонки здесь не было: имя содержит цель и версию, поэтому два
          # прогона в один файл не попадали. Опасно другое — имя ПРЕДСКАЗУЕМО,
          # а писать в /tmp может любой локальный пользователь. Этот файл
          # читает release.sh под sudo и распаковывает от root, так что между
          # scp и распаковкой есть окно, в которое можно подменить содержимое
          # или подставить симлинк. Ровно об этом написано в bin/deploy, где
          # оба временных файла давно уехали в каталог от mktemp -d.
          #
          # 0700 и непредсказуемое имя окно закрывают. Убирается по trap, а не
          # строкой после release.sh: при обрыве scp или ssh каталог иначе
          # оставался бы на сервере вместе с распакованным релизом внутри.
          REMOTE_DIR="$(ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'mktemp -d /tmp/dk-XXXXXXXXXX' | tr -d '\r' | tail -1)"
          case "$REMOTE_DIR" in
            /*) : ;;
            *)  echo "::error::не удалось создать временный каталог на сервере"; exit 1 ;;
          esac
          trap 'ssh -i ~/.ssh/deploy_key "$USER@$HOST" "rm -rf -- $REMOTE_DIR" || true' EXIT

          REMOTE="$REMOTE_DIR/${{ steps.cfg.outputs.app }}-${{ steps.ver.outputs.version }}.tar.gz"
          scp -i ~/.ssh/deploy_key /tmp/artifact.tar.gz "$USER@$HOST:$REMOTE"

          ARGS="--app '${{ steps.cfg.outputs.app }}' --version '${{ steps.ver.outputs.version }}'"
          ARGS="$ARGS --archive '$REMOTE' --root '${{ steps.cfg.outputs.root }}'"
          [ -n "${{ steps.cfg.outputs.owner }}" ]       && ARGS="$ARGS --owner '${{ steps.cfg.outputs.owner }}'"
          [ -n "${{ steps.cfg.outputs.unit }}" ]        && ARGS="$ARGS --unit '${{ steps.cfg.outputs.unit }}'"
          [ -n "${{ steps.cfg.outputs.health }}" ]      && ARGS="$ARGS --health '${{ steps.cfg.outputs.health }}'"
          [ -n "${{ steps.cfg.outputs.version_url }}" ] && ARGS="$ARGS --version-url '${{ steps.cfg.outputs.version_url }}'"
          [ -n "${{ steps.cfg.outputs.neighbours }}" ]  && ARGS="$ARGS --neighbours '${{ steps.cfg.outputs.neighbours }}'"
          [ "${{ steps.cfg.outputs.nginx_reload }}" = "1" ] && ARGS="$ARGS --nginx-reload"
          [ "${{ steps.cfg.outputs.write_version_file }}" = "0" ] && ARGS="$ARGS --no-version-file"
          ${{ inputs.allow-same-version && 'ARGS="$ARGS --allow-same-version"' || 'true' }}
          ${{ inputs.dry-run && 'ARGS="$ARGS --dry-run"' || 'true' }}

          RC=0
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "sudo /opt/deploy-kit/release.sh $ARGS" || RC=$?
          # Код 3 — отказ версионного шлюза: прод не тронут. Отдельная
          # формулировка нужна, чтобы в логе была причина, а не «job failed».
          if [ "$RC" = "3" ]; then
            echo "::error::версия ${{ steps.ver.outputs.version }} не прошла версионный шлюз (уже на проде, старше прода или несравнима). Прод не тронут. Осознанный повтор — запуск с allow-same-version"
            exit 1
          fi
          [ "$RC" = "0" ] || exit "$RC"

      - name: Уведомить в Telegram
        if: always() && !inputs.dry-run
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP: ${{ steps.cfg.outputs.app }}
          VERSION: ${{ steps.ver.outputs.version }}
          HEALTH: ${{ steps.cfg.outputs.health }}
          NOTIFY: ${{ steps.cfg.outputs.notify }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Пустой секрет молчал так же, как NOTIFY=never, и «о релизе не
          # сообщили» было неотличимо от «сообщать не просили». Именно из-за
          # этого пять репозиториев из шести годами не слали ни одного
          # сообщения, и никто не заметил. Теперь ненастроенный чат виден.
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            [ "${NOTIFY:-all}" = "never" ] && exit 0
            echo "::warning::TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID не заданы в секретах репозитория — о релизе никто не узнал. Задайте их либо поставьте NOTIFY=never в описании цели"
            exit 0
          fi
          # Об успехе можно молчать: у проекта бывает свой канал новостей о
          # релизах, и тогда сообщение отсюда — второй голос об одном событии.
          # О провале молчать нельзя: невыкаченное, о котором не сказали,
          # выглядит как выкаченное.
          case "${NOTIFY:-all}:$STATUS" in
            never:*)      exit 0 ;;
            fail:success) exit 0 ;;
          esac
          if [ "$STATUS" = "success" ]; then
            TEXT=$(printf '🚀 <b>%s</b> выкачен\n<code>%s</code>' "$APP" "$VERSION")
            # Ссылка на сам компонент, если он отвечает по HTTP: увидел
            # «выкачен» — хочешь открыть и посмотреть.
            [ -n "$HEALTH" ] && TEXT=$(printf '%s\n<a href="%s">открыть</a>' "$TEXT" "$HEALTH")

            # Список изменений — украшение поверх релиза, поэтому НИ ОДНА его
            # неудача не должна валить шаг: не собрался — молчим, пустой вывод —
            # молчим, сообщение уходит ровно таким же, каким уходило раньше.
            # Отсюда и форма `if ... fi`: строка `[ -n "$CL" ] && TEXT=...`
            # вернула бы 1 на пустом changelog, а под `bash -e` последняя
            # единица в блоке run: — это красный шаг и «выкатка провалена»
            # на ровном месте.
            #
            # Генератор здесь БОЛЬШЕ НЕ ЗОВЁТСЯ: его вывод уже лежит в файле
            # с шага «Собрать список изменений» и уже уехал в version.json.
            # Второй вызов означал бы второе скачивание и, что хуже, два
            # независимо посчитанных списка одного релиза — в чате один, на
            # статус-странице другой.
            #
            # Тема коммита — текст, который пишет кто угодно с правом на пуш,
            # то есть ВРАЖДЕБНЫЙ ВВОД. Она нигде не превращается в код:
            # результат подстановки $( ) второй раз shell'ом не разбирается,
            # поэтому `;`, `|`, обратные кавычки и `$(...)` внутри темы —
            # обычные символы. Дальше значение идёт только АРГУМЕНТОМ printf,
            # не форматом (иначе тема с `%s` или `%n` ломала бы вывод), и
            # только в кавычках. Разметку (& < >) экранирует сам генератор —
            # второй раз экранировать нельзя.
            CHANGES=""
            if [ -s "$CHANGELOG_FILE" ]; then
              CHANGES="$(cat "$CHANGELOG_FILE")"
            fi
            # Блок дописывается ПОСЛЕДНИМ, и он БОЛЬШЕ НЕ ОГРАНИЧЕН. Раньше
            # здесь стоял расчёт запаса: генератор отдавал не больше 1200
            # символов, до лимита Telegram в 4096 оставалось втрое. Теперь
            # генератор зовётся с --all и отдаёт весь релиз целиком — сорок
            # коммитов по 120 символов это около 4800 единиц UTF-16, то есть
            # больше лимита. Запас держит не генератор, а разрез на несколько
            # сообщений ниже.
            # Перенос строки — настоящий, через printf, как и в строке с
            # HEALTH: литерал %0A внутри текста ещё раз кодируется в
            # --data-urlencode и приезжает в чат как есть.
            if [ -n "$CHANGES" ]; then
              TEXT=$(printf '%s\n%s' "$TEXT" "$CHANGES")
            fi
          else
            # Перенос строки настоящий: литерал %0A внутри текста ещё раз
            # кодируется в --data-urlencode и приезжает в чат как есть.
            TEXT=$(printf '💥 <b>%s</b> — выкатка провалена\n<code>%s</code>\nПрод не тронут: релиз переключается последним шагом.\n<a href="%s">разобраться</a>' "$APP" "$VERSION" "$RUN_URL")
          fi
          # --- отправка: одним сообщением или несколькими подряд ------------
          #
          # Предел Telegram — 4096 единиц UTF-16 НА СООБЩЕНИЕ, и он жёсткий:
          # текст длиннее API не режет, а ОТВЕРГАЕТ целиком. curl стоит без -f
          # и с выводом в /dev/null, поэтому отказ выглядел бы точь-в-точь как
          # успех — и об удавшемся релизе не пришло бы НИЧЕГО. Молчание тут
          # хуже урезанного сообщения: выкаченное, о котором не сказали, ничем
          # не отличается от невыкаченного.
          #
          # Раньше запас держался сам собой: генератор отдавал не больше
          # восьми пунктов и 1200 символов. С --all потолка у списка нет —
          # это осознанный размен: список не теряет ни одного коммита, а
          # обязанность уложиться в лимит переезжает сюда.
          #
          # РЕЖЕМ ТОЛЬКО ПО ГРАНИЦАМ СТРОК. Строка — это пункт списка, и в ней
          # стоит <a href="…">#21</a>: рез посреди строки порвал бы тег, а
          # невалидная разметка — это снова отказ API, то есть потерянная
          # часть. Ни один пункт при этом не пропадает и не обрезается.
          LIMIT=4096
          # Запас под служебную строку «часть N из M», которая приписывается к
          # куску, когда кусок не один. Строка целиком наша и короткая —
          # 160 единиц это запас вдвое.
          BUDGET=$(( LIMIT - 160 ))

          # Длина КАЖДОЙ строки stdin, по одному числу на строку.
          if command -v jq >/dev/null 2>&1; then
            # Считаем ровно тем же счётом, что и Telegram, — в единицах UTF-16.
            # explode отдаёт кодовые точки, и символ вне BMP (эмодзи в шапке
            # сообщения) занимает ДВЕ единицы, а не одну.
            line_len() { jq -Rrn 'inputs | ([explode[] | if . > 65535 then 2 else 1 end] | add // 0)'; }
          else
            # Без jq считаем БАЙТАМИ. В UTF-8 байтов всегда не меньше, чем
            # единиц UTF-16 (кириллица — два байта на единицу, эмодзи — четыре
            # на две), поэтому оценка идёт В ЗАПАС: сообщений выйдет больше
            # необходимого, но длиннее предела — ни одного.
            line_len() { LC_ALL=C awk '{ print length($0) }'; }
          fi

          mapfile -t MSG_LINES <<< "$TEXT"
          # tr -d '\r' — длины печатает отдельная программа, и вывод с CRLF
          # дал бы «27\r». Для (( … )) это не число, а ошибка разбора, но
          # ошибка ТИХАЯ: условие просто считается ложным, и упаковка
          # рассыпается на «по сообщению на каждую строку». Поймано прогоном.
          mapfile -t MSG_LENS < <(printf '%s\n' "$TEXT" | line_len | tr -d '\r')

          # Измерение годится только ЦЕЛИКОМ. Одно нечисло среди длин — и
          # арифметика ниже перестаёт быть арифметикой, молча и не там, где
          # видно. Поэтому проверяются все до единой, а негодное измерение
          # уводит в общий запасной путь, а не чинится по месту.
          MEASURED=1
          if (( ${#MSG_LENS[@]} != ${#MSG_LINES[@]} )); then
            MEASURED=0
          else
            for n in "${MSG_LENS[@]}"; do
              case "$n" in ''|*[!0-9]*) MEASURED=0; break ;; esac
            done
          fi

          PARTS=()
          if (( MEASURED == 0 )); then
            # Счётчик не отработал (урезанный образ без jq и без awk — или
            # он выдал не число). Резать вслепую нельзя: неверный рез рвёт
            # разметку и теряет часть, а слишком длинное сообщение теряет
            # ровно столько же. Уходим одним куском — ровно так, как уходило
            # до этой правки, и с явной строкой в логе.
            echo "::warning::не удалось измерить сообщение — отправляю одним куском"
            PARTS=("$TEXT")
          else
            cur=""; curlen=0; started=0
            for i in "${!MSG_LINES[@]}"; do
              l="${MSG_LINES[i]}"; n="${MSG_LENS[i]}"
              if (( started == 0 )); then
                cur="$l"; curlen=$n; started=1
              elif (( curlen + 1 + n <= BUDGET )); then
                cur="$cur"$'\n'"$l"; curlen=$(( curlen + 1 + n ))
              else
                PARTS+=("$cur"); cur="$l"; curlen=$n
              fi
            done
            # Строка, которая не влезает в бюджет и в одиночку, уезжает своим
            # сообщением КАК ЕСТЬ: обрезать её здесь значило бы порвать тег.
            # Такой строки не бывает (тема ограничена --width 120 символов), но
            # цикл обязан продвигаться при любом вводе — иначе он не кончается.
            if (( started )); then PARTS+=("$cur"); fi
          fi

          # Имя цели в служебной строке урезано до сорока символов: чат один на
          # всё хозяйство, и «часть 2 из 3» без имени не к чему привязать —
          # особенно когда рядом катятся четыре цели разом и их сообщения
          # перемешиваются.
          APP_SHORT="${APP:0:40}"
          TOTAL_PARTS=${#PARTS[@]}
          PART_NO=0
          for part in "${PARTS[@]}"; do
            PART_NO=$(( PART_NO + 1 ))
            if (( TOTAL_PARTS > 1 )); then
              if (( PART_NO == 1 )); then
                part="$part"$'\n'"<i>часть 1 из $TOTAL_PARTS — продолжение ниже</i>"
              else
                part="<b>$APP_SHORT</b> — часть $PART_NO из $TOTAL_PARTS"$'\n'"$part"
              fi
            fi
            # Ответ API РАЗБИРАЕТСЯ, а не выбрасывается: отвергнутое сообщение
            # ничем иначе от отправленного не отличается — ни кодом curl, ни
            # логом, и ровно поэтому дефект с длиной жил незамеченным.
            #
            # В лог уходит только НОМЕР части: в теле ответа Telegram
            # возвращает эхом chat_id, а это секрет.
            #
            # Неудача отправки шаг НЕ красит: прод уже выкачен и проверен, и
            # ронять job из-за недоехавшего уведомления — врать про выкатку.
            RESP="$(curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT" -d parse_mode=HTML -d disable_web_page_preview=true \
              --data-urlencode "text=$part" || true)"
            #
            # НА ПЕРВОЙ ЖЕ НЕУДАЧЕ ОТПРАВКА ПРЕКРАЩАЕТСЯ. Досылать хвост после
            # дыры значит выдать неполный список за полный: «часть 1 из 3» без
            # второй читатель заметит, а «1 из 3» и сразу «3 из 3» прочтёт как
            # «всё пришло, просто вторая где-то задержалась». Правило то же, что
            # в bin/deploy (notify): расходиться двум путям выкатки тут нельзя.
            case "$RESP" in
              *'"ok":true'*) ;;
              *)
                echo "::warning::Telegram не принял часть $PART_NO из $TOTAL_PARTS — уведомление о релизе дошло не полностью."
                echo "::warning::Отправлено частей: $(( PART_NO - 1 )) из $TOTAL_PARTS, остальные не отправлялись. Полный список изменений лежит в version.json выкаченного релиза."
                break
                ;;
            esac
          done

      # Исход выкатки — в ту же запись, и обязательно под always(). Запись,
      # заведённая и навсегда оставшаяся в состоянии pending, врёт хуже, чем
      # её отсутствие: на коммите висел бы вечный «выкатывается», а в панели
      # Environments — цель, про которую непонятно, доехала она или нет.
      #
      # environment_url — HEALTH цели: с коммита и из панели открывается сам
      # компонент, а не только лог. log_url — прогон, который эту выкатку
      # сделал. Вместе они и дают связь «коммит ↔ выкатка» в обе стороны:
      # с коммита видно выкатку, из выкатки — коммит.
      #
      # Условие на deployment_id закрывает разом три случая: dry-run,
      # отказ создания (403 у необновлённого вызывающего) и ответ без номера.
      # Нет номера — отмечать нечего, и шаг молча не выполняется.
      - name: Отметить исход выкатки
        if: always() && steps.deployment.outputs.deployment_id != ''
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses
          ENVIRONMENT: ${{ steps.cfg.outputs.app }}
          HEALTH: ${{ steps.cfg.outputs.health }}
          VERSION: ${{ steps.ver.outputs.version }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::нет jq — исход выкатки в записи не отмечен"
            exit 0
          fi
          # Отменённый прогон — не провал выкатки: релиз переключается
          # последним шагом, поэтому при отмене прод остаётся прежним.
          # GitHub называет такой исход error, и это честнее, чем failure.
          case "$STATUS" in
            success)   STATE=success ;;
            cancelled) STATE=error ;;
            *)         STATE=failure ;;
          esac
          # HEALTH есть не у всякой цели, а пустой environment_url API
          # отвергает целиком — вместе со всем статусом. Поэтому ключа
          # просто нет, когда цели нечего открыть.
          PAYLOAD="$(jq -n --arg state "$STATE" --arg env "$ENVIRONMENT" \
            --arg log "$RUN_URL" --arg desc "$VERSION" --arg url "$HEALTH" \
            '{state:$state,environment:$env,log_url:$log,description:$desc}
             + (if $url == "" then {} else {environment_url:$url} end)')"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD")" || CODE=000
          case "$CODE" in
            201) echo "Исход выкатки записан: $STATE" ;;
            403|404) echo "::warning::нет права deployments: write (ответ $CODE) — исход выкатки не записан, запись останется в состоянии pending" ;;
            *) echo "::warning::GitHub не принял исход выкатки (ответ $CODE) — запись останется в состоянии pending" ;;
          esac
          exit 0

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
