name: desktop-artifact

# Сборка и публикация установщика.
#
# Отличие от остальных архетипов: ничего не выкатывается на сервер. Артефакт
# собирается на windows-раннере, публикуется в GitHub Release с чексуммой и
# оттуда раздаётся сайтом.
#
#   jobs:
#     installer:
#       uses: tr0llex/deploy-kit/.github/workflows/desktop-artifact.yml@main
#       with:
#         build: ./scripts/build-installer.ps1 -Configuration Release -AppVersion $env:DEPLOY_VERSION
#         artifact: scripts/generated_downloads/ChillHub-Setup.exe
#       secrets: inherit

on:
  workflow_call:
    inputs:
      build:
        description: 'Команда сборки (PowerShell)'
        required: true
        type: string
      artifact:
        description: 'Путь к готовому установщику'
        required: true
        type: string
      gates:
        description: 'Проверки перед сборкой (PowerShell), необязательно'
        required: false
        type: string
        default: ''
      publish:
        description: 'Публиковать в GitHub Release (только для тегов)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Версия релиза
        id: ver
        shell: bash
        run: |
          # Без префикса release-: эта версия уезжает в NSIS как AppVersion,
          # а он ждёт числовой вид. Установщик и не кладётся релизом на сервер.
          V="$(git describe --tags --exact-match 2>/dev/null || true)"
          [ -n "$V" ] || V="0.0.0-$(TZ=Europe/Moscow date '+%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

      # Входы приходят ПЕРЕМЕННЫМИ ОКРУЖЕНИЯ, а не подстановкой ${{ }} в тело
      # скрипта: при подстановке значение становится частью текста скрипта и
      # может выполниться как отдельная команда. Здесь это важнее, чем в
      # соседних пайплайнах: у этого workflow токен с правом contents: write.
      - name: Проверки
        if: inputs.gates != ''
        shell: pwsh
        env:
          GATES: ${{ inputs.gates }}
        run: Invoke-Expression $env:GATES

      - name: Собрать установщик
        shell: pwsh
        env:
          DEPLOY_VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ inputs.build }}
        run: Invoke-Expression $env:BUILD

      - name: Чексумма
        id: sum
        shell: bash
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          F="$ARTIFACT"
          [ -f "$F" ] || { echo "::error::сборка не создала $F"; exit 1; }
          SHA=$(sha256sum "$F" | cut -d' ' -f1)
          SIZE=$(du -h "$F" | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Размер: $SIZE"
          echo "SHA-256: $SHA"
          # Файл с чексуммой едет рядом с установщиком: скачавший должен иметь
          # возможность проверить, что получил именно то, что собрано здесь.
          echo "$SHA  $(basename "$F")" > "$F.sha256"

      # Подпись кода. Сертификата пока нет: у физлица доступен только OV, и
      # ключ по правилам CA/B Forum обязан лежать на аппаратном носителе —
      # в раннер его не воткнуть, нужна облачная подпись. Шаг включится сам,
      # когда появятся секреты; до тех пор рядом с файлом лежит SHA-256.
      - name: Подписать
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          SIGNING_AVAILABLE: ${{ secrets.CODE_SIGN_CERT != '' }}
        shell: pwsh
        run: echo "подпись будет здесь"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.ver.outputs.version }}
          path: |
            ${{ inputs.artifact }}
            ${{ inputs.artifact }}.sha256
          retention-days: 30

      - name: Опубликовать в Release
        if: inputs.publish && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          # Через env, а не подстановкой в тело: у этого шага токен с правом
          # contents: write, а имя тега ставит человек — то есть это значение
          # приходит извне пайплайна. См. шаг «Проверки».
          TAG: ${{ github.ref_name }}
          ARTIFACT: ${{ inputs.artifact }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.sum.outputs.sha }}
        shell: bash
        run: |
          NOTES="Установщик ChillHub $VERSION

          SHA-256: \`$SHA\`

          Windows покажет предупреждение SmartScreen: установщик не подписан.
          «Подробнее» → «Выполнить в любом случае»."

          gh release create "$TAG" --title "$TAG" --notes "$NOTES" \
            "$ARTIFACT" "$ARTIFACT.sha256" \
            || gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" --clobber
