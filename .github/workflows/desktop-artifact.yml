name: desktop-artifact

# Сборка и публикация установщика.
#
# Отличие от остальных архетипов: у артефакта нет ни юнита, ни релизного
# каталога с симлинком current. Собирается он на windows-раннере, а каналов
# публикации два, и оба необязательные:
#
#   * файл на сервере выкатки (PUBLISH_DEST в описании цели) — установщик и
#     его .sha256 атомарно подменяются в каталоге, который nginx раздаёт как
#     есть. Именно этот канал делает «мерж в main обновляет кнопку „Скачать“»;
#   * сборка самообновления (SELFUPDATE_URL + SELFUPDATE_ZIP) — ZIP полезной
#     нагрузки уезжает в админку лаунчера через bin/selfupdate-upload, сервер
#     строит манифест версии. latest.json при этом НЕ переключается — версию
#     активной делает человек в админке; см. шапку bin/selfupdate-upload.
#
# Основной способ вызова — описание цели, ОБЩЕЕ с локальной выкаткой
# (`dk deploy` читает тот же файл и публикует тем же publish-file.sh):
#
#   jobs:
#     installer:
#       uses: tr0llex/deploy-kit/.github/workflows/desktop-artifact.yml@main
#       with:
#         config: .deploy-kit/installer.env
#       secrets: inherit
#
# Ключи описания: APP, TITLE, BUILD_CMD (bash-строка; PowerShell зовётся в ней
# явно), ARTIFACT_FILE, VERSION_CMD, PUBLISH_DEST, VERIFY_URL, HEALTH,
# SELFUPDATE_URL, SELFUPDATE_ZIP, NOTIFY. Описание цели сильнее одноимённых
# входов — ровно как NGINX_CONF в static-site.yml: оно ближе к выкатке и
# читается обоими путями.
#
# Отдельные входы build/artifact/… остаются для проверочных сборок, которым
# описание цели не нужно («собирается ли установщик вообще»).

on:
  workflow_call:
    inputs:
      config:
        description: 'Файл описания цели в репозитории проекта (.deploy-kit/installer.env)'
        required: false
        type: string
        default: ''
      build:
        description: 'Команда сборки (PowerShell); используется, когда config не задан'
        required: false
        type: string
        default: ''
      artifact:
        description: 'Путь к готовому установщику; используется, когда config не задан'
        required: false
        type: string
        default: ''
      gates:
        description: 'Проверки перед сборкой (PowerShell), необязательно'
        required: false
        type: string
        default: ''
      version-cmd:
        description: 'Команда (bash), печатающая версию приложения; используется на прогонах без тега'
        required: false
        type: string
        default: ''
      upload-dest:
        description: 'Абсолютный путь установщика на сервере выкатки; задан — установщик публикуется туда'
        required: false
        type: string
        default: ''
      verify-url:
        description: 'Публичный URL контрольной суммы (.sha256) для сверки после публикации'
        required: false
        type: string
        default: ''

# Только чтение: единственным потребителем contents: write был шаг публикации
# GitHub Release — канал удалён, релизы хозяйству не нужны, артефакты
# раздаются собственным сервером.
permissions:
  contents: read

# Блока не было вовсе, то есть два прогона шли параллельно до конца. Публикация
# здесь — подмена ОДНОГО файла на сервере (PUBLISH_DEST) и его .sha256 рядом:
# два прогона наперегонки кладут туда разные сборки, и «Сверить с прода» у
# обоих сравнивает свою сумму с чужим файлом — либо красный прогон при
# выложенном установщике, либо зелёный при чужой версии на кнопке «Скачать».
# Канал самообновления страдает так же: манифест строится по тому ZIP, который
# приехал последним.
#
# Ключ такой же, как в static-site.yml: репозиторий плюс ЦЕЛЬ, потому что
# разные цели одного репозитория публикуются в разные места и гонки между
# собой не имеют. К цели приклеен upload-dest — по той же причине, по которой
# в rollback.yml к config приклеен app: у проверочных сборок описания цели нет,
# и без второй половины все они попали бы в одну группу «пустая цель» и ждали
# бы друг друга без повода.
#
# cancel-in-progress: false — очередь, а не отмена: прогон, отменённый между
# scp и publish-file.sh, оставляет на сервере установщик без свежей суммы.
concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.config }}${{ inputs.upload-dest }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # Всё, что нужно job'у уведомления. Он идёт на ubuntu (см. его шапку) и
    # описания цели уже не видит: файл лежит в репозитории проекта, а читает
    # его шаг «Прочитать описание цели» здесь.
    outputs:
      event_app: ${{ steps.cfg.outputs.event_app }}
      version: ${{ steps.ver.outputs.version }}
      notify: ${{ steps.cfg.outputs.notify }}
      upload_dest: ${{ steps.cfg.outputs.upload_dest }}
      # Стадия провала уезжает из job'а сборки наружу, потому что событие об
      # исходе отправляет СОСЕДНИЙ job (см. его шапку — он на ubuntu, и это
      # вынужденно). Контекст steps соседу недоступен, а стадию знает только
      # тот, кто эти шаги выполнял.
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v7

      # Дальше шаги смотрят ТОЛЬКО на выходы этого шага, а не на inputs:
      # эффективное значение каждого параметра считается один раз и здесь.
      # Правило старшинства то же, что у NGINX_CONF в static-site.yml:
      # описание цели сильнее одноимённого входа — оно ближе к выкатке и его
      # же читает dk deploy. Задано и то и другое — берём описание и говорим
      # об этом вслух.
      - name: Прочитать описание цели
        id: cfg
        shell: bash
        env:
          CONFIG: ${{ inputs.config }}
          IN_BUILD: ${{ inputs.build }}
          IN_ARTIFACT: ${{ inputs.artifact }}
          IN_VERSION_CMD: ${{ inputs.version-cmd }}
          IN_UPLOAD_DEST: ${{ inputs.upload-dest }}
          IN_VERIFY_URL: ${{ inputs.verify-url }}
        run: |
          APP=""; TITLE=""; BUILD_CMD=""; ARTIFACT_FILE=""; VERSION_CMD=""
          PUBLISH_DEST=""; VERIFY_URL=""; HEALTH=""
          SELFUPDATE_URL=""; SELFUPDATE_ZIP=""; NOTIFY=""
          if [ -n "$CONFIG" ]; then
            # Путь обязан быть относительным и не выходить из репозитория —
            # ровно те же требования, что у config в static-site.yml.
            case "$CONFIG" in
              /*|*..*) echo "::error::config должен быть относительным путём внутри репозитория, получено: $CONFIG"; exit 1 ;;
            esac
            [ -f "$CONFIG" ] || { echo "::error::нет файла $CONFIG"; exit 1; }
            set -a
            # Путь к описанию цели приходит параметром workflow — проследить
            # его статически нельзя, и это осознанно: файл принадлежит проекту.
            # shellcheck disable=SC1090
            . "./$CONFIG"
            set +a
            for pair in "build:$IN_BUILD" "artifact:$IN_ARTIFACT" "version-cmd:$IN_VERSION_CMD" "upload-dest:$IN_UPLOAD_DEST" "verify-url:$IN_VERIFY_URL"; do
              [ -n "${pair#*:}" ] && echo "::warning::задан и config, и вход ${pair%%:*} — беру значение из описания цели"
            done
          else
            ARTIFACT_FILE="$IN_ARTIFACT"
            VERSION_CMD="$IN_VERSION_CMD"
            PUBLISH_DEST="$IN_UPLOAD_DEST"
            VERIFY_URL="$IN_VERIFY_URL"
          fi
          # Сборка обязана быть задана ровно одним способом: BUILD_CMD из
          # описания — bash-строка (общая с dk deploy), вход build — PowerShell
          # (прежний контракт). Выполняются они разными шагами ниже.
          if [ -n "$CONFIG" ]; then
            [ -n "$BUILD_CMD" ] || { echo "::error::в $CONFIG нет BUILD_CMD"; exit 1; }
            [ -n "$ARTIFACT_FILE" ] || { echo "::error::в $CONFIG нет ARTIFACT_FILE"; exit 1; }
          else
            [ -n "$IN_BUILD" ] || { echo "::error::нужен вход config либо build"; exit 1; }
            [ -n "$ARTIFACT_FILE" ] || { echo "::error::нужен вход artifact"; exit 1; }
          fi
          # Какой из двух шагов сборки исполнится, решают эти два выхода:
          # заполнен всегда ровно один.
          BUILD_PWSH=""; [ -z "$CONFIG" ] && BUILD_PWSH="$IN_BUILD"
          {
            echo "app=${APP:-установщик}"
            # ОТДЕЛЬНЫЙ ВЫХОД ДЛЯ СОБЫТИЯ ВЫКАТКИ, и он не дубликат `app`.
            # Умолчание выше — «установщик»: слово для чата, а `app` в событии
            # попадает в ИМЯ ФАЙЛА журнала и подчиняется
            # ^[a-z0-9][a-z0-9._-]{0,63}$ (docs/events.md, §4). Кириллица под
            # него не подходит, и событие было бы отвергнуто у источника.
            # Пусто значит «цель не названа» — это проверочная сборка без
            # описания цели, и события у неё нет: называть в журнале нечего.
            echo "event_app=${APP:-}"
            # Имя для чата. APP — техническое имя цели (chillhub-installer), и
            # в ленте релизов, где у соседей стоит «Лаунчер · Сайт», оно
            # читается как строка из лога, а не как событие хозяйства. TITLE
            # необязателен: без него в сообщение уедет APP, как и уезжал.
            echo "title=${TITLE:-${APP:-установщик}}"
            # Куда ведёт название в сообщении: страница, с которой файл
            # скачивают. Тот же ключ, что у остальных архетипов, — там он
            # адрес пробы, здесь ссылка «куда смотреть глазами».
            echo "home=$HEALTH"
            echo "build_bash=${CONFIG:+$BUILD_CMD}"
            echo "build_pwsh=$BUILD_PWSH"
            echo "artifact=$ARTIFACT_FILE"
            echo "version_cmd=$VERSION_CMD"
            echo "upload_dest=$PUBLISH_DEST"
            echo "verify_url=$VERIFY_URL"
            echo "selfupdate_url=$SELFUPDATE_URL"
            echo "selfupdate_zip=$SELFUPDATE_ZIP"
            echo "notify=${NOTIFY:-all}"
          } >> "$GITHUB_OUTPUT"
          # Половина канала самообновления без другой — молча пропущенный шаг,
          # ровно как пара NGINX_CONF/NGINX_DEST в static-site.yml.
          if [ -n "$SELFUPDATE_URL$SELFUPDATE_ZIP" ] && { [ -z "$SELFUPDATE_URL" ] || [ -z "$SELFUPDATE_ZIP" ]; }; then
            echo "::error::SELFUPDATE_URL и SELFUPDATE_ZIP задаются парой — иначе сборка самообновления молча не уедет"
            exit 1
          fi

      - name: Версия релиза
        id: ver
        shell: bash
        env:
          # Через env, а не подстановкой в тело — см. пояснение у шага
          # «Проверки» ниже: в окружении job'а секреты выкатки.
          VERSION_CMD: ${{ steps.cfg.outputs.version_cmd }}
        run: |
          # Без префикса release-: эта версия уезжает в NSIS как AppVersion,
          # а он ждёт числовой вид. Релизным каталогом установщик не кладётся
          # и версионный шлюз release.sh его не сверяет.
          #
          # Порядок источников: тег → version-cmd → заглушка.
          #
          # version-cmd нужна прогонам без тега — выкатке по мержу в main.
          # Там версию объявляет сам репозиторий (например, <Version> в
          # csproj), и печатает её команда проекта. Сломавшаяся или
          # замолчавшая команда — это ОТКАЗ, а не откат на заглушку: заглушка
          # 0.0.0-… уехала бы на прод в launcher.version у каждого, кто
          # скачает такой установщик.
          #
          # Заглушка остаётся для вызовов без version-cmd — проверочных
          # сборок, которым нужен только сам факт «собирается».
          # Ведущая `v` из тега СНИМАЕТСЯ ЗДЕСЬ, до того как версию увидит
          # хоть кто-нибудь. Тег называется v1.2.3, а версия уезжает в сборку
          # и сравнивается с версией приложения ПОСИМВОЛЬНО: «v1.2.3» против
          # «1.2.3» — это у лаунчера вечный цикл самообновления у каждого,
          # кто поставит такой билд. Раньше срез делала команда сборки в
          # проекте — теперь она общая с локальной выкаткой и про теги не
          # знает, поэтому срез живёт у единственного источника тегов.
          V="$(git describe --tags --exact-match 2>/dev/null || true)"
          V="${V#v}"
          if [ -z "$V" ] && [ -n "$VERSION_CMD" ]; then
            V="$(eval "$VERSION_CMD" | tr -d ' \t\r\n')"
            [ -n "$V" ] || { echo "::error::version-cmd не напечатала версию — публиковать сборку с заглушкой вместо версии нельзя"; exit 1; }
          fi
          [ -n "$V" ] || V="0.0.0-$(TZ=Europe/Moscow date '+%Y%m%d')-$(git rev-parse --short HEAD)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Версия: $V"

      # Входы приходят ПЕРЕМЕННЫМИ ОКРУЖЕНИЯ, а не подстановкой ${{ }} в тело
      # скрипта: при подстановке значение становится частью текста скрипта и
      # может выполниться как отдельная команда. Здесь это важнее, чем в
      # соседних пайплайнах: в окружении job'а — ключ выкатки и учётка админки.
      - name: Проверки
        id: gates
        if: inputs.gates != ''
        shell: pwsh
        env:
          GATES: ${{ inputs.gates }}
        run: Invoke-Expression $env:GATES

      # SSH НАСТРАИВАЕТСЯ ДО СБОРКИ, а не перед публикацией, и переехал он
      # сюда вместе с событиями выкатки. Событие «выкатка началась» уходит на
      # тот же хост тем же ключом, и уйти оно обязано до проверок и сборки:
      # `started` кормит детектор аномалий («началась и не кончилась») и
      # заводит карточку прогона, в которую потом дописываются исходы целей.
      # Сборка установщика идёт десятками минут — карточка, появляющаяся
      # только к её концу, теряет ровно то, ради чего события затевались.
      #
      # Условие прежнее: без PUBLISH_DEST публиковать некуда, это проверочная
      # сборка, и ни ключ, ни событие ей не нужны.
      - name: Настроить SSH
        id: ssh
        if: steps.cfg.outputs.upload_dest != ''
        shell: bash
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # НЕ `install -m 700 -d`, как в static-site.yml: раннер здесь
          # windows, каталог ~/.ssh уже существует, а сменить права на нём
          # Git Bash не может — ACL профиля не его: «cannot change
          # permissions … Permission denied», и публикация падала ещё до
          # первого байта. ssh от Git for Windows строгие права требует
          # только от самого ключа, каталогу достаточно существовать.
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключ хоста из секрета, а не ssh-keyscan: keyscan доверяет первому
          # ответу и молча принимает подмену.
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOST_KEY не задан — ключ хоста принимается доверием к первому ответу"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      # Событие «выкатка началась». Само по себе в чат не идёт (docs/events.md,
      # §4) — заводит карточку прогона и даёт детектору аномалий точку отсчёта.
      # Недоставленное `started` сборку не роняет: решение принято внутри
      # действия и там же объяснено.
      - name: Событие — выкатка началась
        if: steps.cfg.outputs.upload_dest != '' && steps.cfg.outputs.event_app != ''
        uses: tr0llex/deploy-kit/.github/actions/notify@main
        with:
          app: ${{ steps.cfg.outputs.event_app }}
          kind: started
          notify: ${{ steps.cfg.outputs.notify }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}

      # Сборка — двумя взаимоисключающими шагами: BUILD_CMD из описания цели —
      # bash-строка (та же, что выполняет dk deploy, PowerShell в ней зовётся
      # явно), вход build — PowerShell, прежний контракт проверочных сборок.
      # Заполнен всегда ровно один выход — см. шаг «Прочитать описание цели».
      - name: Собрать установщик
        id: build
        if: steps.cfg.outputs.build_bash != ''
        shell: bash
        env:
          DEPLOY_VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.cfg.outputs.build_bash }}
        run: eval "$BUILD"

      - name: Собрать установщик (PowerShell)
        id: build_pwsh
        if: steps.cfg.outputs.build_pwsh != ''
        shell: pwsh
        env:
          DEPLOY_VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.cfg.outputs.build_pwsh }}
        run: Invoke-Expression $env:BUILD

      - name: Чексумма
        id: sum
        shell: bash
        env:
          ARTIFACT: ${{ steps.cfg.outputs.artifact }}
        run: |
          F="$ARTIFACT"
          [ -f "$F" ] || { echo "::error::сборка не создала $F"; exit 1; }
          SHA=$(sha256sum "$F" | cut -d' ' -f1)
          SIZE=$(du -h "$F" | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Размер: $SIZE"
          echo "SHA-256: $SHA"
          # Файл с чексуммой едет рядом с установщиком: скачавший должен иметь
          # возможность проверить, что получил именно то, что собрано здесь.
          echo "$SHA  $(basename "$F")" > "$F.sha256"

      # Подпись кода. Сертификата пока нет: у физлица доступен только OV, и
      # ключ по правилам CA/B Forum обязан лежать на аппаратном носителе —
      # в раннер его не воткнуть, нужна облачная подпись. Шаг включится сам,
      # когда появятся секреты; до тех пор рядом с файлом лежит SHA-256.
      - name: Подписать
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          SIGNING_AVAILABLE: ${{ secrets.CODE_SIGN_CERT != '' }}
        shell: pwsh
        run: echo "подпись будет здесь"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.cfg.outputs.artifact }}
            ${{ steps.cfg.outputs.artifact }}.sha256
          retention-days: 30

      # ---------------- публикация на сервер выкатки (вход upload-dest) ----
      #
      # Раннер здесь windows, но шаги те же, что в static-site.yml: bash от
      # Git for Windows несёт свои ssh и scp, и ~/.ssh в нём разворачивается
      # в профиль раннера — известные хосты и ключ читаются оттуда же, откуда
      # их читает ssh.
      # Каталог на сервере — приватный от mktemp, по тем же соображениям, что
      # в шаге «Выкатить» static-site.yml: файл читает publish-file.sh под
      # sudo, и между scp и установкой не должно быть окна для подмены.
      - name: Выложить на сервер
        id: upload
        if: steps.cfg.outputs.upload_dest != ''
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          ARTIFACT: ${{ steps.cfg.outputs.artifact }}
          UPLOAD_DEST: ${{ steps.cfg.outputs.upload_dest }}
        run: |
          REMOTE_DIR="$(ssh -i ~/.ssh/deploy_key "$USER@$HOST" 'mktemp -d /tmp/dk-XXXXXXXXXX' | tr -d '\r' | tail -1)"
          case "$REMOTE_DIR" in
            /*) : ;;
            *)  echo "::error::не удалось создать временный каталог на сервере"; exit 1 ;;
          esac
          trap 'ssh -i ~/.ssh/deploy_key "$USER@$HOST" "rm -rf -- $REMOTE_DIR" || true' EXIT

          BASE="$(basename "$ARTIFACT")"
          scp -i ~/.ssh/deploy_key "$ARTIFACT" "$ARTIFACT.sha256" "$USER@$HOST:$REMOTE_DIR/"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" \
            "sudo /opt/deploy-kit/publish-file.sh --file '$REMOTE_DIR/$BASE' \
               --sha256 '$REMOTE_DIR/$BASE.sha256' --dest '$UPLOAD_DEST'"

      # «Зелёный деплой со старыми файлами» ловится именно здесь: сумма,
      # посчитанная на раннере, сверяется с той, что РАЗДАЁТ прод. Это тот же
      # смысл, что сверка /version.json после выкатки сайта.
      - name: Сверить с прода
        id: verify
        if: steps.cfg.outputs.upload_dest != '' && steps.cfg.outputs.verify_url != ''
        shell: bash
        env:
          URL: ${{ steps.cfg.outputs.verify_url }}
          SHA: ${{ steps.sum.outputs.sha }}
        run: |
          GOT="$(curl -fsS --max-time 30 "$URL" | awk '{print tolower($1); exit}')"
          [ -n "$GOT" ] || { echo "::error::$URL не отдал контрольную сумму — публикация не подтверждена"; exit 1; }
          if [ "$GOT" != "$SHA" ]; then
            echo "::error::прод раздаёт другую сборку: собрано $SHA, по адресу $URL лежит $GOT"
            exit 1
          fi
          echo "Проверено: $URL раздаёт свежую сумму $SHA"

      # Третий канал: ZIP полезной нагрузки уезжает в админку лаунчера, сервер
      # строит манифест версии. latest.json НЕ переключается — это граница
      # автоматизации (см. шапки файла и bin/selfupdate-upload): активной
      # версию делает человек в админке.
      #
      # Скрипт скачивается с main тем же способом, что bin/changelog в
      # static-site.yml: логика одна на CI и локальную выкатку, копий нет.
      # Его недоступность — отказ, а не пропуск: проверку, которую нельзя
      # выполнить, нельзя и считать пройденной.
      #
      # Провал шага — провал job'а НАМЕРЕННО: установщик на сайте уже
      # подменён, и молча оставить манифест несобранным значит разъехаться
      # с ним до следующего релиза.
      - name: Загрузить сборку самообновления
        id: selfupdate
        if: steps.cfg.outputs.selfupdate_url != ''
        shell: bash
        env:
          SELFUPDATE_URL: ${{ steps.cfg.outputs.selfupdate_url }}
          SELFUPDATE_ZIP: ${{ steps.cfg.outputs.selfupdate_zip }}
          VERSION: ${{ steps.ver.outputs.version }}
          # Секреты репозитория проекта. ADMIN_PASSWORD_PLAIN — под тем же
          # именем, под которым он в хозяйстве и лежит.
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_PLAIN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/tr0llex/deploy-kit/main/bin/selfupdate-upload -o /tmp/selfupdate-upload \
            || { echo "::error::не удалось скачать bin/selfupdate-upload из deploy-kit — сборка самообновления не уедет"; exit 1; }
          [ -s /tmp/selfupdate-upload ] || { echo "::error::bin/selfupdate-upload скачался пустым"; exit 1; }
          bash /tmp/selfupdate-upload --url "$SELFUPDATE_URL" --zip "$SELFUPDATE_ZIP" --version "$VERSION"

      # СТАДИЯ ПРОВАЛА. Считается по ПЕРВОМУ шагу, который не отработал: шаги
      # идут по порядку, и всё, что после упавшего, GitHub помечает как
      # пропущенное. Перечисление закрыто (docs/events.md, §7) — сырой вывод
      # лога в событие не попадает никогда: в нём бывают пути, хосты и куски
      # конфигурации, а событие уезжает в чат и на публичную страницу.
      #
      # Шаг стоит ДО «Убрать ключ» и под always(), потому что иначе он не
      # выполнился бы ровно тогда, когда только и нужен, — на красном прогоне.
      - name: Стадия провала
        id: stage
        if: always() && job.status != 'success'
        shell: bash
        env:
          O_CFG: ${{ steps.cfg.outcome }}
          O_VER: ${{ steps.ver.outcome }}
          O_SSH: ${{ steps.ssh.outcome }}
          O_GATES: ${{ steps.gates.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_BUILD_PWSH: ${{ steps.build_pwsh.outcome }}
          O_SUM: ${{ steps.sum.outcome }}
          O_UPLOAD: ${{ steps.upload.outcome }}
          O_VERIFY: ${{ steps.verify.outcome }}
          O_SELFUPDATE: ${{ steps.selfupdate.outcome }}
        run: |
          # Порядок пар — порядок шагов. Пустой outcome значит «до шага не
          # дошло», skipped — «пропущен по своему if», и ни то ни другое
          # стадией не является.
          #
          # «Сверить с прода» — это version: сумма, посчитанная на раннере,
          # сверяется с той, что РАЗДАЁТ прод, то есть ровно та же проверка,
          # что сверка /version.json у остальных архетипов, только маркер
          # другой. Публикация сборки самообновления — второй канал доставки,
          # отсюда upload.
          STAGE=""
          for pair in \
              "$O_CFG:preflight" "$O_VER:preflight" "$O_SSH:upload" \
              "$O_GATES:gates" \
              "$O_BUILD:preflight" "$O_BUILD_PWSH:preflight" "$O_SUM:preflight" \
              "$O_UPLOAD:upload" "$O_VERIFY:version" "$O_SELFUPDATE:upload"; do
            case "${pair%%:*}" in
              ''|success|skipped) continue ;;
            esac
            STAGE="${pair#*:}"
            break
          done
          # Ни один известный шаг не покраснел — упало что-то до них (checkout,
          # сам раннер) или прогон отменили. Стадия у failure обязательна, а
          # значения «неизвестно» в закрытом перечислении нет: preflight —
          # самое раннее из возможных и потому наименее лживое.
          [ -n "$STAGE" ] || STAGE=preflight
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Стадия провала: $STAGE"

      - name: Убрать ключ
        if: always() && steps.cfg.outputs.upload_dest != ''
        shell: bash
        run: rm -f ~/.ssh/deploy_key

  # Публикация на сервер объявляет результат событием выкатки, как и остальные
  # пути: невыкаченное, о котором не сказали, выглядит как выкаченное.
  #
  # ОТДЕЛЬНЫМ JOB'ОМ И НА UBUNTU — не ради красоты структуры.
  #
  # Раннер сборки windows, bash там от Git for Windows, и аргументы НАТИВНЫМ
  # программам (ssh.exe, curl.exe) он перекодирует в системную кодовую
  # страницу (CP1252), где ни кириллице, ни эмодзи соответствия нет: каждый
  # символ становится «?», а эмодзи — двумя, по суррогатной паре. Уведомление
  # об установщике так однажды и уехало в чат строкой
  # «?? chillhub-installer ???????????», причём в логе прогона всё читалось:
  # echo не выходит за пределы bash, argv не проходит, — дефект был виден
  # только получателю. Событие выкатки едет по SSH теми же аргументами и
  # подставилось бы ровно под ту же перекодировку.
  #
  # Вылечить это на месте нечем: перекодировка живёт между bash и любым
  # нативным exe. Здесь, на ubuntu, событие собирается и уходит тем же
  # lib/notify.sh, что у остальных архетипов.
  #
  # Репозиторий этому job'у не нужен и не выкачивается: всё, что он говорит,
  # приходит выходами job'а сборки, а доставку делает действие из deploy-kit.
  notify:
    needs: build
    if: always() && needs.build.outputs.upload_dest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Ключ хоста нужен и здесь: доставка события идёт по SSH со СВОИМ
      # StrictHostKeyChecking=yes (lib/notify.sh), а этот job — отдельный
      # раннер, у которого ~/.ssh пуст. Приватный ключ шагу не нужен: его
      # действие получает входом и держит во временном файле само.
      - name: Настроить SSH
        env:
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOST_KEY не задан — ключ хоста принимается доверием к первому ответу"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      # ИСХОД — ОДНИМ шагом. Вид события считается в одном месте: два шага со
      # взаимоисключающими условиями рано или поздно разошлись бы.
      #
      # Вид успеха — success, а НЕ published, хотя публикуется файл. Причина
      # в читателе: `published` контракт (§12) показывает «по правилам цели»,
      # а `success` — всегда и той же карточкой, что у остальных архетипов.
      # Установщик в ленте релизов — такое же событие хозяйства, как выкатка
      # сайта, и оформленный иначе он читался бы как событие другой природы.
      # `published` остаётся за publish-file.sh, куда приходит локальная
      # выкатка `dk deploy`.
      #
      # Список изменений сюда не передаётся: генератор отдаёт готовый HTML, а
      # вход `changelog` действия принимает простой текст. Нормализация
      # описана в docs/events.md §4 и живёт в lib/notify.sh (--changelog-html);
      # заводить здесь второй нормализатор — заводить второй способ ошибиться.
      - name: Событие — исход публикации
        if: always() && needs.build.outputs.event_app != ''
        uses: tr0llex/deploy-kit/.github/actions/notify@main
        with:
          app: ${{ needs.build.outputs.event_app }}
          kind: ${{ needs.build.result == 'success' && 'success' || 'failure' }}
          version: ${{ needs.build.outputs.version }}
          # Стадия — только у провала: у успеха контракт её ЗАПРЕЩАЕТ, и
          # действие на непустую стадию при kind=success ответит ошибкой.
          stage: ${{ needs.build.result == 'success' && '' || needs.build.outputs.stage }}
          notify: ${{ needs.build.outputs.notify }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}
