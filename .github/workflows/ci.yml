name: CI

# Инструмент, который гейтит выкатку всех остальных проектов, до сих пор сам
# ничем не проверялся. Ошибка здесь ломает релизы во всех репозиториях сразу,
# поэтому набор проверок здесь строже, чем у обычного проекта.

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          # Событие всегда pull_request (см. блок on:), поэтому диапазон один:
          # то, что ветка добавляет к своей базе.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  shell:
    name: Скрипты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # bin/* глобом, а не перечислением. Перечисление уже разъехалось:
      # bin/install-server не попадал ни сюда, ни в shellcheck — то есть
      # единственный скрипт, который кладёт код НА СЕРВЕР, был и единственным
      # непроверяемым. Глоб не забывает про новый файл.
      # Синтаксис отдельно от статического анализа: разобранный скрипт с
      # претензиями shellcheck починить можно, а неразбираемый — уже нет.
      - name: Синтаксис
        run: |
          fail=0
          for f in server/*.sh ci/*.sh bin/*; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::скрипт не разбирается"
              fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -x: скрипты подключают lib.sh, без этого проверка слепа к общим функциям.
          shellcheck -x -S warning server/*.sh ci/*.sh bin/*

      # Справка — часть контракта: dk help читают чаще, чем исходники.
      - name: dk help не падает
        run: bash bin/dk help > /dev/null

  nginx:
    name: Конфигурация nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Настоящий nginx той же версии, что на проде: 1.24 не знает директивы
      # `http2 on`, и конфиг, валидный для свежего nginx, там просто не встанет.
      - name: Проверить конфиги настоящим nginx
        run: |
          fail=0
          for conf in nginx/sites/*.conf; do
            echo "::group::$conf"
            if bash ci/nginx-check.sh "$conf"; then
              echo "ok"
            else
              echo "::error file=$conf::nginx не принял конфиг"
              fail=1
            fi
            echo '::endgroup::'
          done
          exit $fail

  workflows:
    name: Переиспользуемые workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
