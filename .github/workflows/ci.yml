name: CI

# Инструмент, который гейтит выкатку всех остальных проектов, до сих пор сам
# ничем не проверялся. Ошибка здесь ломает релизы во всех репозиториях сразу,
# поэтому набор проверок здесь строже, чем у обычного проекта.

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

permissions:
  contents: read

# Устаревший прогон отменяется, как только пришёл следующий пуш в ту же ветку.
# Без этого пять правок подряд держат пять параллельных прогонов, и первым
# завершается самый старый — то есть зелёная галочка может относиться к коду,
# которого уже нет. Для main отмену НЕ включаем: там каждый коммит должен
# получить свой честный результат, он же попадает в историю.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          # Событие всегда pull_request (см. блок on:), поэтому диапазон один:
          # то, что ветка добавляет к своей базе.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  shell:
    name: Скрипты
    runs-on: ubuntu-latest
    # Разбор аргументов в скриптах — цикл `while [[ $# -gt 0 ]]`, и ветка,
    # забывшая сдвинуть аргументы, крутится вечно. Без явного лимита такой
    # прогон держал бы раннер до общего потолка в шесть часов и выглядел бы
    # как «CI задумался», а не как красная задача.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bin/* глобом, а не перечислением. Перечисление уже разъехалось:
      # bin/install-server не попадал ни сюда, ни в shellcheck — то есть
      # единственный скрипт, который кладёт код НА СЕРВЕР, был и единственным
      # непроверяемым. Глоб не забывает про новый файл.
      # Синтаксис отдельно от статического анализа: разобранный скрипт с
      # претензиями shellcheck починить можно, а неразбираемый — уже нет.
      - name: Синтаксис
        run: |
          fail=0
          for f in server/*.sh ci/*.sh bin/*; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::скрипт не разбирается"
              fail=1
            fi
          done
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -x: скрипты подключают lib.sh, без этого проверка слепа к общим функциям.
          shellcheck -x -S warning server/*.sh ci/*.sh bin/*

      # Тесты — гейт, а не украшение (CLAUDE.md). Набор для bin/changelog
      # лежал рядом и запускался руками: в CI файлы `ci/*.sh` попадали только
      # как вход для shellcheck, то есть проверялись как текст, а не как
      # поведение. Разницу видно сразу: гарантия генератора — «не может
      # уронить выкатку ни при каком входе», а это пустой репозиторий,
      # shallow-клон, detached HEAD, отсутствие git в PATH, чужой текст в теме
      # коммита и кириллица ровно на границе обрезки. Разбором текста такое не
      # ловится, только прогоном.
      #
      # Цена ошибки здесь несимметрична: от одного этого файла зависят все три
      # пути выкатки, а его отказ не виден в логе деплоя — сообщение о релизе
      # просто не приходит либо приходит с битой разметкой. Красный шаг тут
      # дешевле молчащего чата на проде.
      #
      # Свой лимит у шага, а не только общий у задачи: оба набора гоняют
      # генератор в цикле по одноразовым репозиториям, а зависание генератора —
      # это ровно тот дефект, который они обязаны ловить. Упёршись в лимит
      # задачи, прогон съел бы все десять минут и оставил бы вопрос «где
      # именно встало» без ответа; лимит на шаге называет виновника сам.
      # Пять минут — заведомо больше настоящего прогона и заведомо меньше
      # лимита задачи, так что первым срабатывает всегда шаг.
      - name: Тесты bin/changelog
        timeout-minutes: 5
        run: bash ci/changelog-test.sh

      # А этот набор проверяет то, чего не видит ни один из двух концов: СТЫК.
      # У генератора свои зелёные тесты (шаг выше), у агента статус-страницы —
      # свои Go-суиты, и оба конца однажды были зелёными одновременно с
      # поломкой посередине. Стык физический: текст генератора уезжает внутрь
      # JSON-строки version.json, а этот же файл читает версионный шлюз в
      # server/lib.sh — одна неэкранированная кавычка из темы коммита ломает не
      # «красивый список», а сверку версии после выкатки.
      #
      # Писателей version.json три (bin/deploy и оба переиспользуемых
      # workflow), и набор не переписывает их, а ВЫРЕЗАЕТ ИЗ ИСХОДНИКОВ и
      # запускает как есть — копия кода в тесте проверяла бы копию.
      #
      # jq здесь обязателен: без него набор молча пропускает обе jq-ветки
      # writer'ов, то есть ровно то, что в CI и работает. На ubuntu-latest jq
      # предустановлен, строка ниже — страховка от смены образа.
      #
      # Лимит на шаге — по той же причине, что и у набора выше: набор поднимает
      # одноразовые репозитории и запускает вырезанных из исходников писателей,
      # и зависшего писателя надо увидеть шагом, а не общим лимитом задачи.
      - name: Тесты стыка changelog и version.json
        timeout-minutes: 5
        run: |
          command -v jq >/dev/null || sudo apt-get install -y -qq jq
          bash ci/contract-test.sh

      # install_units — единственное место, где выкатка пишет в
      # /etc/systemd/system, и делает это от root. Цена ошибки тут не «список
      # изменений выглядит криво», а «служба не запускается»: не тот путь, не
      # созданный каталог, не сделанный daemon-reload. Половина поведения
      # функции — это поведение глобов, cmp и install на файловой системе,
      # чтением такое не проверяется. Набор поднимает поддельный
      # /etc/systemd/system и гоняет по нему НАСТОЯЩУЮ функцию из lib.sh.
      - name: Тесты установки юнитов systemd
        timeout-minutes: 5
        run: bash ci/units-test.sh

      # Чистка релизов — единственное место выкатки, которое делает `rm -rf`
      # по каталогу, вычисленному из состояния файловой системы. Цена ошибки
      # тут не «список выглядит криво», а снесённый каталог живого релиза:
      # симлинк current указывает в пустоту, прод отдаёт 404, а выкатка при
      # этом зелёная. Проверяется настоящей функцией на настоящем каталоге.
      - name: Тесты чистки старых релизов
        timeout-minutes: 5
        run: bash ci/prune-test.sh

      # ДВА НАБОРА НИЖЕ ЛЕЖАЛИ РЯДОМ И НЕ ЗАПУСКАЛИСЬ НИГДЕ.
      #
      # В CI они попадали только как вход для shellcheck, то есть проверялись
      # как текст, а не как поведение — при том, что оба заканчиваются строкой
      # «Пропущенные проверки — это НЕ зелёный прогон: на раннере они обязаны
      # пройти», то есть писались ровно для раннера. Проверять транспорт
      # события чтением бессмысленно: половина его поведения — это поведение
      # flock, base64, ssh и файловой системы.
      #
      # Цена ошибки здесь та же, что у changelog, только хуже: событие —
      # единственный канал, по которому владелец узнаёт о провале выкатки, и
      # его отказ не виден в логе деплоя. Тишина в чате читается как «не
      # катились».
      - name: Тесты доставки события
        timeout-minutes: 5
        run: bash ci/notify-test.sh

      # Сквозной прогон журнала: писатель кладёт события, читатель (бот на Go)
      # их разбирает. Это единственное место, где обе стороны контракта
      # docs/events.md встречаются в одном прогоне.
      - name: Сквозной прогон журнала событий
        timeout-minutes: 5
        run: bash ci/events-e2e.sh

      # Справка — часть контракта: dk help читают чаще, чем исходники.
      - name: dk help не падает
        run: bash bin/dk help > /dev/null

  nginx:
    name: Конфигурация nginx
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Настоящий nginx той же версии, что на проде: 1.24 не знает директивы
      # `http2 on`, и конфиг, валидный для свежего nginx, там просто не встанет.
      - name: Проверить конфиги настоящим nginx
        run: |
          fail=0
          for conf in nginx/sites/*.conf; do
            echo "::group::$conf"
            if bash ci/nginx-check.sh "$conf"; then
              echo "ok"
            else
              echo "::error file=$conf::nginx не принял конфиг"
              fail=1
            fi
            echo '::endgroup::'
          done
          exit $fail

  workflows:
    name: Переиспользуемые workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Версия закреплена тегом релиза, а не веткой main самого actionlint:
      # раньше скрипт скачивания и сам бинарь ставились с main без пина, то
      # есть каждый прогон мог получить другую версию линтера без единого
      # изменения в этом репозитории — придирки или, наоборот, слепые пятна
      # у actionlint появлялись бы сами по себе, вне контроля CLAUDE.md.
      # Обновление версии — осознанный шаг, а не побочный эффект чужого релиза.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -sSf "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  # Переименование или слияние задач CI не красит прогон в красный — красной
  # становится защита ветки, и только через день, на СЛЕДУЮЩЕМ PR: main ждёт
  # проверку по старому имени вечно, а "Merge" молчит о причине. Руками это
  # правится в Settings → Branches, но руками же и забывается.
  #
  # GITHUB_TOKEN сюда не годится: у него в принципе нет permission scope для
  # чтения защиты ветки (полный список — actions, artifact-metadata,
  # attestations, checks, contents, deployments, discussions, id-token,
  # issues, models, packages, pages, pull-requests, repository-projects,
  # security-events, statuses; administration среди них нет, хотя REST API и
  # называет его так). Отсюда PROTECTION_READ_TOKEN — fine-grained PAT на
  # deploy-kit с двумя правами: Administration: Read-only (список обязательных
  # проверок) и Actions: Read-only (список задач текущего прогона — тем же
  # токеном читаются обе стороны сравнения). Лежит в secrets репозитория и
  # передаётся только этому шагу, а не всей задаче.
  protection-sync:
    name: Защита ветки соответствует задачам CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
    steps:
      # Секреты репозитория не отдаются прогонам dependabot и форков — там
      # PAT приходит пустым. Сверять нечего: задача проверяет настройку
      # репозитория, а не содержимое PR, и на своих ветках отработает та же
      # проверка. Падать здесь — значит красить чужие PR за то, чего они не
      # ломали, поэтому пропускаем явно и вслух.
      - name: Пропустить сверку без доступа к защите ветки
        if: env.GH_TOKEN == ''
        run: |
          echo "::notice::PAT недоступен (dependabot или форк) — сверка защиты ветки пропущена"

      - uses: actions/checkout@v7
        if: env.GH_TOKEN != ''

      - name: Сверить задачи с обязательными проверками main
        if: env.GH_TOKEN != ''
        env:
          SELF_JOB_NAME: Защита ветки соответствует задачам CI
        run: bash ci/branch-protection-check.sh
