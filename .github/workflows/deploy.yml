# Выкатка самого deploy-kit.
#
# У deploy-kit нет .deploy-kit/*.env и он не проходит через release.sh: катить
# нечего — это не сервис с релизами, а набор скриптов, которые ЖИВУТ на хосте.
# Серверная часть (server/*.sh в /opt/deploy-kit, общие сниппеты nginx и файлы
# уровня http в conf.d) обновляется единственной командой bin/install-server.
#
# Пока эта команда запускалась только руками, мерж в main менял код, но не
# менял ничего на сервере. Правки лежали влитыми и невыкаченными, и понять это
# можно было лишь заглянув на хост. Отдельно неприятно с исправлениями
# безопасности: PR закрыт, дыра открыта.
#
# Конфиги САЙТОВ (nginx/sites/*.conf) сюда не входят намеренно: у каждого есть
# проект-владелец, и он возит свой конфиг сам через nginx-apply.sh во время
# собственной выкатки. Здесь ездит только то, у чего владельца нет.
#
# Ровно одно исключение, и оно подтверждает правило: nginx/sites/000-default.conf.
# Это общесерверный catch-all с ssl_reject_handshake — он не про сайт, а про все
# остальные домены сразу, и проекта-владельца у него нет по построению. Пока его
# не возил никто, правка в нём не доезжала до сервера никогда, а увидеть это было
# нечем: ни выкатки, ни сверки. Список ниже перечисляет ФАЙЛ, а не каталог —
# так же, как SITES в bin/install-server.
#
# Правило sudo (server/sudoers.d/deploy-kit) тоже не ездит: --with-sudoers
# меняет ПРАВА на хосте, а не код, и остаётся ручным шагом. См. шапку
# bin/install-server.
name: Выкатка

# Выкатка серверной части идёт автоматически, но НЕ под обычной учёткой CI.
#
# install-server пишет файлы от root (install, bash, tee), и сузить это нельзя:
# каждая из этих команд сама по себе равна root. Поэтому на сервере заведён
# ОТДЕЛЬНЫЙ пользователь deploy-admin с широкими правами, а секреты
# DEPLOY_USER и DEPLOY_SSH_KEY переопределены на уровне ЭТОГО репозитория.
#
# Смысл разделения: ключ, который лежит в остальных девяти репозиториях,
# остаётся узким — им можно запустить ровно пять скриптов deploy-kit. Root
# получает один этот workflow, а не весь парк.
on:
  push:
    branches: [main]
    paths:
      # Ровно то, что публикует install-server. Правка bin/* или README сервер
      # не трогает: bin/changelog CI качает с raw.githubusercontent прямо на
      # раннер, а bin/deploy и bin/dk работают с машины разработчика.
      - 'server/**'
      - 'nginx/snippets/**'
      - 'nginx/conf.d/**'
      - 'nginx/sites/000-default.conf'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Показать план, ничего не менять'
        type: boolean
        default: false

permissions:
  contents: read
  # Запись о выкатке против коммита: она появляется на странице самого коммита
  # и в панели Environments. Переиспользуемые workflow это уже умеют, но право
  # у них — ПОТОЛОК, а не выдача: вызываемый workflow не может держать больше,
  # чем дал вызывающий. Здесь вызывающий — этот файл, и без строки ниже API
  # отвечает 403, а запись молча не появляется.
  deployments: write

# Выкладка идёт в /opt/deploy-kit и /etc/nginx — два одновременных прогона
# перезаписывали бы одни файлы. Очередь, а не отмена: отменённая выкладка
# оставила бы хост наполовину обновлённым.
concurrency:
  group: deploy-kit-install
  cancel-in-progress: false

jobs:
  install:
    name: Выложить на сервер
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # История нужна сверке с origin/main (шаг ниже): install-server
          # отказывается выкладывать невлитое, а на клоне глубиной 1 общего
          # предка с main просто нет и сравнивать не с чем. 50 — тот же запас
          # на серию пушей, что и в остальных пайплайнах.
          fetch-depth: 50

      - name: Завести ссылку origin/main
        # install-server отказывается выкладывать невлитое: он сверяет каждый
        # файл с origin/main. actions/checkout эту remote-ссылку не создаёт,
        # и без неё сверка сравнивала бы с пустотой.
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Версия выкладки
        id: ver
        run: echo "version=release-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ключи доступа
        id: ssh
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY или DEPLOY_HOST не заданы в секретах репозитория — выкладывать некуда"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOST_KEY не задан"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      # Событие «выкладка началась». В чат само по себе не идёт
      # (docs/events.md, §4) — оно заводит карточку прогона и даёт детектору
      # аномалий точку отсчёта. Недоставленное `started` выкладку не роняет:
      # решение принято внутри действия и там же объяснено.
      #
      # Действие берётся ЛОКАЛЬНЫМ путём, а не как samoy-love/deploy-kit@main:
      # это workflow самого deploy-kit, репозиторий уже выложен checkout'ом, и
      # ссылка на main означала бы выкладку одной ревизии событием из другой.
      #
      # `app` здесь литерал: у deploy-kit нет .deploy-kit/*.env — катится не
      # сервис с релизами, а набор скриптов, которые живут на хосте. То же имя
      # стоит в старом сообщении и в bin/install-server.
      #
      # Список изменений не передаётся, и причина здесь другая, чем у прочих
      # архетипов: его нечем посчитать. Отсчёт диапазона у них идёт от
      # version.json выкаченного релиза, а deploy-kit кладёт на хост набор
      # скриптов — ни релизного каталога, ни version.json у него нет вовсе.
      # Заводить их ради строки в чате дороже самой строки.
      - name: Событие — выкладка началась
        if: ${{ !inputs.dry-run }}
        uses: ./.github/actions/notify
        with:
          app: deploy-kit
          kind: started
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}

      - name: План выкладки
        # ТОЛЬКО для ручного dry-run, и это не косметика.
        #
        # Без --apply install-server не просто печатает разницу — он ЗАВЕРШАЕТСЯ
        # КОДОМ 1, если разница есть. Для человека за терминалом это верный
        # ответ «есть что выкладывать», но в пайплайне он убивал job прямо
        # здесь, и шаг «Выложить» не выполнялся ни разу. Выкатка получалась
        # зелёной ровно тогда, когда выкладывать было нечего, и красной всегда,
        # когда работа была, — то есть работала строго наоборот.
        #
        # Разницу печатает и сам --apply, теми же строками и до того, как
        # что-либо тронет, так что из лога ничего не пропало.
        if: ${{ inputs.dry-run }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: /home/runner/.ssh/deploy_key
          # Писателей событий двое: обычная выкатка идёт под узкой учёткой CI,
          # а install-server — под админской. Без записи для группы второй
          # писатель терял бы доступ при каждой установке.
          DK_EVENTS_MODE: '3770'
        run: bash bin/install-server

      - name: Прошлая версия на сервере
        # Строка «была …» в сообщении. Своего маркера у deploy-kit не было:
        # у проектов версию хранит имя каталога релиза, а здесь файлы кладутся
        # поверх, и по ним не понять, что стояло раньше. Читаем ДО выкладки —
        # после неё это уже нынешняя версия.
        #
        # Отсутствие файла — не ошибка, а первая выкладка: строку «была»
        # тогда просто не печатаем.
        id: prev
        if: ${{ !inputs.dry-run }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          PREV="$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
                    'cat /opt/deploy-kit/.version 2>/dev/null' 2>/dev/null | tr -d '\r' | head -1 || true)"
          # В сообщение уедет как есть, поэтому в маркер пускаем только тот
          # алфавит, которым сами его пишем: содержимое лежит на хосте и
          # править его может кто угодно с доступом.
          case "$PREV" in
            ''|*[!A-Za-z0-9.-]*) PREV='' ;;
          esac
          echo "version=$PREV" >> "$GITHUB_OUTPUT"

      - name: Выложить
        id: install
        if: ${{ !inputs.dry-run }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: /home/runner/.ssh/deploy_key
          # Писателей событий двое: обычная выкатка идёт под узкой учёткой CI,
          # а install-server — под админской. Без записи для группы второй
          # писатель терял бы доступ при каждой установке.
          DK_EVENTS_MODE: '3770'
        run: bash bin/install-server --apply

      - name: Отметить версию на сервере
        # Пишем ПОСЛЕ успешной выкладки, иначе маркер соврёт при провале.
        # Неудача записи выкладку не роняет: файлы уже на месте, а испорченная
        # строчка «была» — цена несопоставимая с откатом рабочей выкладки.
        if: ${{ success() && !inputs.dry-run }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER@$HOST" \
                'sudo tee /opt/deploy-kit/.version >/dev/null && sudo chmod 0644 /opt/deploy-kit/.version' \
            || echo "::warning::не удалось записать маркер версии — в следующем сообщении не будет строки «была»"

      # СТАДИЯ ПРОВАЛА. Считается по ПЕРВОМУ шагу, который не отработал: шаги
      # идут по порядку, и всё, что после упавшего, GitHub помечает как
      # пропущенное. Перечисление закрыто (docs/events.md, §7) — сырой вывод
      # лога в событие не попадает никогда: в нём бывают пути, хосты и куски
      # конфигурации, а событие уезжает в чат и на публичную страницу.
      - name: Стадия провала
        id: stage
        if: ${{ always() && job.status != 'success' && !inputs.dry-run }}
        env:
          O_SSH: ${{ steps.ssh.outcome }}
          O_PREV: ${{ steps.prev.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
        run: |
          # Порядок пар — порядок шагов. Пустой outcome значит «до шага не
          # дошло», skipped — «пропущен по своему if», и ни то ни другое
          # стадией не является.
          #
          # install-server кладёт файлы в /opt/deploy-kit и /etc/nginx и
          # перезагружает nginx — это switch, та же стадия, что переключение
          # симлинка у остальных архетипов.
          STAGE=""
          for pair in "$O_SSH:upload" "$O_PREV:preflight" "$O_INSTALL:switch"; do
            case "${pair%%:*}" in
              ''|success|skipped) continue ;;
            esac
            STAGE="${pair#*:}"
            break
          done
          # Ни один известный шаг не покраснел — упало что-то до них (checkout,
          # ссылка origin/main) или прогон отменили. Стадия у failure
          # обязательна, а значения «неизвестно» в закрытом перечислении нет:
          # preflight — самое раннее из возможных и потому наименее лживое.
          [ -n "$STAGE" ] || STAGE=preflight
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "Стадия провала: $STAGE"

      # ИСХОД — ОДНИМ шагом под always(). Два шага (успех и провал) со
      # взаимоисключающими условиями дали бы два места, где считается вид
      # события, и рано или поздно они разошлись бы.
      - name: Событие — исход выкладки
        if: ${{ always() && !inputs.dry-run }}
        uses: ./.github/actions/notify
        with:
          app: deploy-kit
          kind: ${{ job.status == 'success' && 'success' || 'failure' }}
          version: ${{ steps.ver.outputs.version }}
          previous: ${{ steps.prev.outputs.version }}
          # Стадия — только у провала: у успеха контракт её ЗАПРЕЩАЕТ, и
          # действие на непустую стадию при kind=success ответит ошибкой.
          stage: ${{ job.status == 'success' && '' || steps.stage.outputs.stage }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
