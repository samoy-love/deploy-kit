name: rollback

# Откат из пайплайна.
#
# До этого файла откат существовал ровно в одном виде: `dk rollback <цель>` с
# машины владельца. То есть чинить прод можно было только там, где лежит
# приватный ключ, — с рабочего ноутбука. Ночью, из отпуска, с телефона, с чужой
# машины откатить сайт было нечем, хотя автооткат внутри release.sh умеет ровно
# это и делает сам.
#
# Прав это не расширяет и новых секретов не заводит. Ключ выкатки в проектных
# репозиториях уже есть, и он уже может катить прод: тот, кто способен
# смержить PR, способен и положить на сервер любой релиз. Возможность вернуть
# ПРЕЖНИЙ релиз тем же ключом — это меньше того, что уже разрешено, а не больше.
#
# Внутри — ровно то же, что делает cmd_rollback в bin/dk: читает описание цели,
# собирает из него аргументы и зовёт по SSH `sudo /opt/deploy-kit/rollback.sh`.
# Второй реализации отката не появилось: пересборки нет, релизы лежат на диске,
# переключается симлинк — вся логика на сервере и одна.
#
# СОБЫТИЕ ОБ ОТКАТЕ ЗДЕСЬ НЕ ОТПРАВЛЯЕТСЯ. Его шлёт сам rollback.sh, после того
# как симлинк переключён (kind=rollback, docs/events.md §4). Отправка отсюда
# дала бы второе сообщение на один откат — и, что хуже, сообщение о том, чего,
# возможно, не произошло: шаг видит только код возврата ssh.
#
# ВЫЗОВ ИЗ ПРОЕКТА. Переиспользуемый workflow нельзя запустить кнопкой напрямую:
# кнопку даёт workflow_dispatch в репозитории, где лежит вызывающий файл.
# Поэтому в проекте появляется обёртка на двадцать строк — и она же место, где
# перечислены цели этого проекта:
#
#   name: Откат
#   on:
#     workflow_dispatch:
#       inputs:
#         config:
#           description: 'Цель'
#           type: choice
#           options: ['.deploy-kit/prod.env']
#         to:
#           description: 'Релиз (пусто — предыдущий)'
#           type: string
#           required: false
#         list:
#           description: 'Только показать релизы на сервере'
#           type: boolean
#           default: false
#   permissions:
#     contents: read
#   jobs:
#     rollback:
#       uses: tr0llex/deploy-kit/.github/workflows/rollback.yml@main
#       with:
#         config: ${{ inputs.config }}
#         to: ${{ inputs.to }}
#         list: ${{ inputs.list }}
#       secrets: inherit
#
# ВТОРОЙ ВХОД — КНОПКА В САМОМ deploy-kit, и она не дубликат. Обёртки в проектах
# приезжают по одной и не приезжают вовсе в репозиторий, который лежит на
# рабочей ветке; авария же случается раньше. Поэтому у workflow_dispatch здесь
# те же входы плюс `app`/`root`: описание цели в этом репозитории не лежит, зато
# оба значения короткие (`snakes`, `/opt/snakes`) и их можно ввести руками, ни
# одного файла не правя. Путь аварийный: `unit` и `health` при нём приходится
# указывать самому, а забытый `unit` даёт откат наполовину — служба останется
# запущенной с ExecStart от нового релиза (см. install_units в rollback.sh).
# Штатный путь — обёртка в проекте, где эти значения берутся из описания цели.

on:
  # Наборы входов у обоих триггеров совпадают намеренно. Job читает `inputs.*`
  # одинаково при любом событии, и любое расхождение между блоками означало бы
  # поведение, зависящее от способа запуска.
  workflow_call:
    inputs:
      config:
        description: 'Файл описания цели в репозитории проекта (штатный путь)'
        required: false
        type: string
        default: ''
      app:
        description: 'Имя цели — только для аварийного запуска без описания'
        required: false
        type: string
        default: ''
      root:
        description: 'Корень выкатки на сервере — только вместе с app'
        required: false
        type: string
        default: ''
      unit:
        description: 'Юнит systemd, который перезапустить — только вместе с app'
        required: false
        type: string
        default: ''
      health:
        description: 'Адрес проверки после отката — только вместе с app'
        required: false
        type: string
        default: ''
      nginx-reload:
        description: 'Перезагрузить nginx — только вместе с app'
        required: false
        type: boolean
        default: false
      to:
        description: 'Релиз, на который откатиться. Пусто — предыдущий'
        required: false
        type: string
        default: ''
      list:
        description: 'Только показать релизы на сервере, ничего не менять'
        required: false
        type: boolean
        default: false
    secrets:
      # Все четыре объявлены необязательными, а проверяются шагом. Секреты
      # приезжают через `secrets: inherit`, и объявленный required у GitHub
      # означает отказ ДО первого шага — с сообщением про имя секрета вместо
      # внятного «выкатывать некуда». Так же сделано в deploy.yml.
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_HOST:
        required: false
      DEPLOY_USER:
        required: false
      SSH_HOST_KEY:
        required: false
  workflow_dispatch:
    inputs:
      config:
        description: 'Файл описания цели (в этом репозитории его нет — оставьте пустым)'
        required: false
        type: string
        default: ''
      app:
        description: 'Имя цели, например snakes'
        required: false
        type: string
        default: ''
      root:
        description: 'Корень выкатки, например /opt/snakes'
        required: false
        type: string
        default: ''
      unit:
        description: 'Юнит systemd, например snakes.service'
        required: false
        type: string
        default: ''
      health:
        description: 'Адрес проверки после отката'
        required: false
        type: string
        default: ''
      nginx-reload:
        description: 'Перезагрузить nginx'
        required: false
        type: boolean
        default: false
      to:
        description: 'Релиз, на который откатиться. Пусто — предыдущий'
        required: false
        type: string
        default: ''
      list:
        description: 'Только показать релизы на сервере, ничего не менять'
        required: false
        type: boolean
        default: false

permissions:
  # Токену остаётся только checkout: описание цели читается из репозитория.
  # Сам откат идёт по SSH секретами, а записи о выкатке (Deployment) откат не
  # создаёт — deployments: write здесь не нужен.
  contents: read

# ТА ЖЕ ГРУППА, ЧТО У ВЫКАТКИ. Ключ совпадает с group в static-site.yml и
# go-service.yml (`deploy-<репозиторий>-<описание цели>`) не случайно: откат и
# выкатка одной цели — операции над одним симлинком, и вставать в разные очереди
# им нельзя. Замок хоста в release.sh/rollback.sh их всё равно разведёт, но
# ждать на flock, держа два раннера, дороже и хуже читается в логе.
#
# `app` приклеен к `config` строкой: у аварийного запуска описания цели нет, и
# без него все такие прогоны попали бы в одну группу «пустая цель».
# cancel-in-progress: false — отменённый на середине откат оставил бы прод
# наполовину переключённым.
concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.config }}${{ inputs.app }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Откат на сервере
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Глубина 1: из репозитория читается один файл — описание цели. Ни
      # истории, ни тегов откату не нужно, пересборки нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # ПРОВЕРКА АРГУМЕНТОВ — И ОНА СТОИТ ЗДЕСЬ, ХОТЯ ЕСТЬ НА СЕРВЕРЕ.
      #
      # На сервере проверка есть: rollback.sh зовёт assert_path_component для
      # --app и --to и assert_deploy_root для --root (server/rollback.sh:34-36).
      # Дублирование здесь — не забывчивость, у него четыре отдельные причины.
      #
      # 1. Сервер проверяет НЕ ВСЁ, что уезжает в команду. Через
      #    assert_path_component проходят только --app и --to. --unit и --health
      #    не проверяет ни rollback.sh, ни lib.sh — а --unit попадает в
      #    `systemctl restart "$UNIT"`, выполняемый от root. Для них проверка
      #    здесь не вторая, а ЕДИНСТВЕННАЯ.
      # 2. Проверка на другой машине отказывает молча. Серверную часть
      #    выкладывает отдельный пайплайн (deploy.yml → bin/install-server), и
      #    на хосте лежит та ревизия lib.sh, которая доехала последней. Защита,
      #    существующая только на том конце, — это защита версии, которую
      #    отсюда не видно.
      # 3. Отказ до SSH дешевле отказа после. Проверка здесь срабатывает раньше,
      #    чем прогон возьмёт замок хоста и разбудит sudo, и объясняет себя
      #    строкой в логе прогона, а не кодом возврата ssh.
      # 4. Вход приходит ОТ ЧЕЛОВЕКА через workflow_dispatch и уезжает в строку,
      #    которую разбирает удалённый shell под sudo. Единственная точка
      #    проверки на таком пути — плохая арифметика: её цена три строки, а
      #    цена промаха — root на проде.
      #
      # Алфавит сознательно уже, чем у assert_path_component по смыслу быть не
      # может: он повторён здесь буква в букву, чтобы имя релиза, принятое одной
      # стороной, не отвергалось другой.
      - name: Проверить аргументы и собрать команду
        id: args
        env:
          IN_CONFIG: ${{ inputs.config }}
          IN_APP: ${{ inputs.app }}
          IN_ROOT: ${{ inputs.root }}
          IN_UNIT: ${{ inputs.unit }}
          IN_HEALTH: ${{ inputs.health }}
          IN_NGINX_RELOAD: ${{ inputs.nginx-reload }}
          IN_TO: ${{ inputs.to }}
          IN_LIST: ${{ inputs.list }}
        run: |
          bad() { echo "::error::$1"; exit 1; }

          # Одна составляющая пути: буквы, цифры и «._+-», без «/», без «..»,
          # без ведущей точки. Тот же набор условий, что в assert_path_component
          # (server/lib.sh:67) и в том же порядке — сообщения читаются рядом.
          component() {
            case "$2" in
              '')                  bad "$1: пустое значение" ;;
              */*)                 bad "$1 не может содержать «/»: «$2»" ;;
              *..*)                bad "$1 не может содержать «..»: «$2»" ;;
              .*)                  bad "$1 не может начинаться с точки: «$2»" ;;
              *[!A-Za-z0-9._+-]*)  bad "$1: допустимы только буквы, цифры и «._+-», получено «$2»" ;;
            esac
            # Потолок длины: у имён релизов он около двадцати символов, у имён
            # целей — меньше. Всё, что длиннее сотни, это не имя, а попытка
            # что-то переполнить на той стороне.
            [ "${#2}" -le 100 ] || bad "$1: длиннее 100 символов"
          }

          # --list и --to вместе. rollback.sh выходит на --list раньше, чем
          # посмотрит на --to, то есть выбранный релиз был бы МОЛЧА
          # проигнорирован: человек нажал «откатить на 20260801-2250», получил
          # список и зелёный прогон, а прод не тронут. Отказ вместо тишины.
          if [ "$IN_LIST" = "true" ] && [ -n "$IN_TO" ]; then
            bad "list и to вместе не имеют смысла: со list ничего не откатывается. Посмотрите список, затем запустите откат с to"
          fi

          [ -z "$IN_TO" ] || component "to" "$IN_TO"

          # Два источника описания цели, и ровно один за запуск. Смесь
          # («config плюс root») пришлось бы разрешать приоритетом, а приоритет
          # в аварийной кнопке — это способ откатить не то, что имели в виду.
          if [ -n "$IN_CONFIG" ]; then
            for pair in "app:$IN_APP" "root:$IN_ROOT" "unit:$IN_UNIT" "health:$IN_HEALTH"; do
              [ -z "${pair#*:}" ] || bad "задан config — значения цели берутся из него; уберите ${pair%%:*}"
            done
            [ "$IN_NGINX_RELOAD" != "true" ] || bad "задан config — nginx-reload берётся из него (NGINX_RELOAD), уберите вход"

            # Путь обязан быть относительным и не выходить из репозитория:
            # описание цели — файл проекта, а не произвольная точка ФС раннера.
            case "$IN_CONFIG" in
              /*|*..*) bad "config должен быть относительным путём внутри репозитория, получено: $IN_CONFIG" ;;
            esac
            [ -f "$IN_CONFIG" ] || bad "нет файла $IN_CONFIG"

            # ОПИСАНИЕ ЧИТАЕТСЯ В ОТДЕЛЬНОЙ ОБОЛОЧКЕ, а не подключается здесь.
            # Описание цели — обычный shell-файл проекта, и подключённое в этот
            # же процесс оно переписывает ЛЮБУЮ переменную шага, включая уже
            # проверенные входы: строка `IN_TO=../../etc` в конце файла отменила
            # бы проверку выше, потому что проверка стоит ДО подключения, а
            # команда собирается ПОСЛЕ. Подоболочка отдаёт наружу пять строк и
            # больше ничего — переписать ей нечего.
            #
            # Порядок строк — контракт этих двух команд, и он же причина держать
            # их рядом. NGINX_RELOAD идёт последним и всегда непустой: пустая
            # последняя строка съедается подстановкой, и read на ней отказал бы.
            CFG="$(
              set -a
              # Путь к описанию приходит входом workflow — проследить его
              # статически нельзя, файл принадлежит проекту.
              # shellcheck disable=SC1090
              . "./$IN_CONFIG"
              set +a
              printf '%s\n' "${APP-}" "${ROOT-}" "${UNIT-}" "${HEALTH-}" "${NGINX_RELOAD:-0}"
            )" || bad "описание $IN_CONFIG не читается как shell-файл"
            { read -r APP; read -r ROOT; read -r UNIT; read -r HEALTH; read -r NGINX_RELOAD; } <<< "$CFG"
            [ -n "$APP" ]  || bad "в описании $IN_CONFIG не задано APP"
            [ -n "$ROOT" ] || bad "в описании $IN_CONFIG не задано ROOT"
          else
            [ -n "$IN_APP" ]  || bad "укажите config (штатно) либо app и root (аварийно)"
            [ -n "$IN_ROOT" ] || bad "задан app, но нет root: без корня выкатки неизвестно, где лежат релизы"
            APP="$IN_APP"; ROOT="$IN_ROOT"; UNIT="$IN_UNIT"; HEALTH="$IN_HEALTH"
            NGINX_RELOAD=0
            [ "$IN_NGINX_RELOAD" != "true" ] || NGINX_RELOAD=1
          fi

          component "app" "$APP"

          # Корень выкатки: <разрешённый родитель>/<одна составляющая>. Требование
          # повторяет assert_deploy_root (server/lib.sh:83) вместе с его списком
          # родителей — им описаны все существующие цели (/opt/<сервис>,
          # /var/www/<сайт>). Новая площадка — осознанная правка в двух местах,
          # а не значение, приехавшее аргументом.
          case "$ROOT" in
            /*) ;;
            *)  bad "root должен быть абсолютным путём, получено «$ROOT»" ;;
          esac
          ROOT="${ROOT%/}"
          case "$ROOT" in
            /opt/*|/var/www/*) ;;
            *) bad "root допустим только внутри /opt или /var/www, получено «$ROOT»" ;;
          esac
          component "имя каталога в root" "${ROOT##*/}"
          # Отсечь третий уровень: /opt/a/b даёт «b» одной составляющей, но
          # корнем выкатки не является. Сравнение с восстановленным путём ловит
          # это без разбора на части.
          case "$ROOT" in
            "/opt/${ROOT##*/}"|"/var/www/${ROOT##*/}") ;;
            *) bad "root допустим ровно одним уровнем внутри /opt или /var/www, получено «$ROOT»" ;;
          esac

          # Юнит уезжает в `systemctl restart "$UNIT"` от root, и на сервере его
          # не проверяет никто. Алфавит — тот, которым systemd называет юниты:
          # шаблонные через «@», экземпляры через «:». Суффикс не требуется
          # (systemd додумывает .service сам), а вот пробел запрещён: строка из
          # двух юнитов доехала бы до systemctl одним аргументом и упала бы уже
          # на сервере, посреди отката.
          if [ -n "$UNIT" ]; then
            case "$UNIT" in
              *[!A-Za-z0-9@:._-]*) bad "unit: допустимы только буквы, цифры и «@:._-», получено «$UNIT»" ;;
            esac
            [ "${#UNIT}" -le 100 ] || bad "unit: длиннее 100 символов"
          fi

          # Адрес проверки после отката. Тоже не проверяется на сервере, а
          # уезжает в ту же команду и дальше в curl. Только https: проверок по
          # HTTP среди целей нет, а допущение второй схемы расширяло бы то, что
          # попадает в команду, ради несуществующего случая. Кавычки, пробелы и
          # обратный слэш вырезаны алфавитом: команда собирается ниже строкой.
          if [ -n "$HEALTH" ]; then
            # Схема и алфавит одним выражением: разложенные на два условия, они
            # дают два сообщения об одной ошибке. Кавычек, пробела, обратного
            # слэша, «<» и «>» в наборе нет.
            HEALTH_RE='^https://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'
            [[ "$HEALTH" =~ $HEALTH_RE ]] \
              || bad "health: ожидается https://<адрес> из букв, цифр и «._~:/?#@!\$&()*+,;=%-», получено «$HEALTH»"
            [ "${#HEALTH}" -le 300 ] || bad "health: длиннее 300 символов"
          fi

          # Команда собирается ОДНОЙ строкой на оба случая: список релизов и
          # сам откат отличаются одним флагом, и два сборщика рано или поздно
          # разошлись бы в наборе аргументов — а расходились бы они в пользу
          # того, который никто не читает глазами.
          #
          # Значения одеваются в одинарные кавычки, потому что на той стороне
          # строку разбирает shell. Проверки выше — не «на всякий случай», а
          # гейт именно этой подстановки: одинарной кавычки в значении быть не
          # может ни у одного из полей.
          ARGS="--app '$APP' --root '$ROOT'"
          [ -z "$UNIT" ]   || ARGS="$ARGS --unit '$UNIT'"
          [ -z "$HEALTH" ] || ARGS="$ARGS --health '$HEALTH'"
          [ "$NGINX_RELOAD" != "1" ] || ARGS="$ARGS --nginx-reload"
          if [ "$IN_LIST" = "true" ]; then
            ARGS="$ARGS --list"
          elif [ -n "$IN_TO" ]; then
            ARGS="$ARGS --to '$IN_TO'"
          fi

          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "rollback.sh $ARGS"

      - name: Ключи доступа
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY или DEPLOY_HOST не заданы в секретах репозитория — откатывать негде"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_HOST_KEY не задан"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      # Единственный шаг, который трогает прод. Ровно та же команда, что у
      # cmd_rollback в bin/dk: пересборки нет, релизы лежат на сервере,
      # переключается симлинк.
      #
      # ARGS приезжает переменной окружения, а не подстановкой ${{ }} в тело
      # скрипта: подстановка выражения раннер делает ТЕКСТОМ до запуска shell,
      # и её содержимое было бы кодом для локальной оболочки, а не аргументами.
      # Внутри двойных кавычек $ARGS не разбивается на слова здесь и разбирается
      # там — именно этого мы и хотим.
      #
      # BatchMode=yes: без него ssh на непринятом ключе хоста или закрытом ключе
      # ждёт ответа человека, которого нет, и job молчит до общего лимита.
      - name: Вызвать rollback.sh на хосте
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          ARGS: ${{ steps.args.outputs.args }}
        run: |
          # ubuntu — тот же дефолт, что в bin/dk: DEPLOY_USER задан не во всех
          # репозиториях, а пустой user превратил бы адрес в «@host».
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${USER:-ubuntu}@$HOST" \
            "sudo /opt/deploy-kit/rollback.sh $ARGS"

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
