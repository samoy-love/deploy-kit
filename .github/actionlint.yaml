# Метки своих раннеров для actionlint: без списка он считает ошибкой любую
# метку, которой нет у раннеров GitHub.
#
# home  — большие одноразовые раннеры (4 ядра, 4 ГиБ): выкатки, регресс, сборка.
# light — лёгкие (3 ядра, 2 ГиБ) под линтеры и тесты на Node; выкатки на них
#         не идут — отсюда home в runs-on всех переиспользуемых workflow.
self-hosted-runner:
  labels:
    - home
    - light
