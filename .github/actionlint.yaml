# Метки своих раннеров для actionlint: без списка он считает ошибкой любую
# метку, которой нет у раннеров GitHub.
#
# home-heavy — набор Runner Scale Set больших одноразовых раннеров (4 ядра,
#              4 ГиБ): выкатки, регресс, сборка. На нём все переиспользуемые
#              workflow этого репозитория.
# home-light — набор лёгких (3 ядра, 2 ГиБ) под линтеры и тесты на Node.
# home, light — прежние метки тех же раннеров; остаются, пока в репозиториях
#               живут ветки с ними.
self-hosted-runner:
  labels:
    - home-heavy
    - home-light
    - home
    - light
